  --badge-note-bg: #fae8e2;

  --badge-focus-text: #f57d26;
  --badge-focus-bg: #fde3da;
  --badge-focus-border: #e0dcc7;
  --stat-todo-bg: #e9f0e9;
  --stat-backlog-bg: #efebd4;
  --stat-waiting-bg: #faedcd;
  --stat-done-bg: #f0f1d2;
  --stat-wins-text: #df69ba;
  --stat-wins-bg: #fae8e2;
  --quicknotes-bar-bg: #faf5ea;
  --quicknotes-bar-bg-hover: #f5efe2;
  --quicknotes-bar-gradient: linear-gradient(180deg, #fcf9f1 0%, #faf5ea 100%);
  --quicknotes-bar-gradient-hover: linear-gradient(180deg, #fcf9f1 0%, #f5efe2 100%);
  --quicknotes-bar-border: var(--border);
  --quicknotes-indicator-border: rgba(0, 0, 0, 0.08);
  --quicknotes-indicator-bg: rgba(0, 0, 0, 0.03);

  --badge-padding-x: 6px;
  --badge-radius: var(--radius-sm);

  --shadow-float: 0 2px 6px rgba(0, 0, 0, 0.18);
  --shadow-popover: 0 8px 20px rgba(0, 0, 0, 0.12);
  --label-letter-spacing: 0.1em;
  --brand-letter-spacing: 0.08em;
  --active-font-weight: 600;
  --heavy-font-weight: 700;
  --nav-active-border-width: 2px;
  --row-status-width: 2px;

  --check-radius: var(--radius-sm);

<style data-source="./styles.css">
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  --interactive-hover-bg: color-mix(in srgb, var(--surface-hover) 82%, var(--accent) 18%);
  --interactive-hover-border: color-mix(in srgb, var(--accent) 58%, var(--border));
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.4;
  min-height: 100vh;
  font-size: 14px;
}

body,
.header,
.card,
.item,
.badge,
.btn,
button,
input,
select,
textarea,
.quicknotes-bar,
.quicknotes-panel {
  transition: background-color 0.32s ease, background-image 0.32s ease, border-color 0.32s ease, color 0.32s ease, box-shadow 0.32s ease;
}

::selection {
  background: var(--accent);
  color: #fff;
}

.header {
  background: var(--bg-elev);
  border-bottom: var(--border-width) solid var(--border);
  padding: 0 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: var(--layout-gap);
  height: var(--header-height);
}

.logo {
  font-weight: 600;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: var(--brand-letter-spacing);
  text-transform: uppercase;
  flex-shrink: 0;
}

.nav {
  display: flex;
  gap: calc(var(--control-gap) / 2);
  overflow-x: auto;
  min-width: 0;
  flex: 0 1 auto;
}

.header-search {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  flex: 1 1 240px;
  max-width: 360px;
}

.header-search input,
.view-search input {
  width: 100%;
  min-width: 0;
  background: var(--surface);
  border: var(--border-width) solid var(--border);
  border-radius: var(--control-radius);
  color: var(--text);
  padding: var(--control-padding-y) var(--control-padding-x);
  font: inherit;
  outline: none;
}

.header-search input:focus,
.view-search input:focus {
  border-color: var(--accent);
}

.nav button {
  background: none;
  border: var(--border-width) solid transparent;
  border-left: var(--nav-active-border-width) solid transparent;
  border-radius: var(--control-radius);
  padding: var(--control-padding-y) var(--control-padding-x);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  text-transform: lowercase;
  transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
}

.nav button:hover {
  background: var(--interactive-hover-bg);
  color: var(--text);
  border-color: var(--interactive-hover-border);
}

.nav button.active {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--border);
  border-left-color: var(--accent);
  font-weight: var(--active-font-weight);
}

.header-actions {
  margin-left: auto;
  display: flex;
  gap: var(--control-gap);
  flex-shrink: 0;
  align-items: center;
}

.header-actions button,
.theme-trigger {
  background: none;
  border: var(--border-width) solid var(--border);
  border-radius: var(--control-radius);
  padding: var(--control-padding-y) var(--control-padding-x);
  font-size: 13px;
  color: var(--text-secondary);
  text-transform: lowercase;
  transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
}

.theme-picker {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.header-actions button,
.theme-trigger {
  cursor: pointer;
}

.header-actions button:hover,
.theme-trigger:hover,
.theme-picker.open .theme-trigger {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--interactive-hover-bg);
}

.theme-trigger {
  min-width: 96px;
  height: 38px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
}

.theme-trigger-icon {
  font-size: 17px;
  line-height: 1;
  transform: translateY(-1px);
}

.theme-trigger-label {
  font-size: 11px;
  color: inherit;
  letter-spacing: var(--label-letter-spacing);
  text-transform: lowercase;
}

.theme-trigger-badge {
  position: absolute;
  top: -3px;
  right: -3px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--warning);
  border: 2px solid var(--bg);
  box-sizing: content-box;
}

.theme-option-swatch {
  background: linear-gradient(135deg, var(--theme-swatch-bg) 0 50%, var(--theme-swatch-accent) 50% 100%);
  border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}

.theme-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: min(240px, calc(100vw - 24px));
  max-height: calc(100vh - var(--header-height) - 18px);
  overflow-y: auto;
  z-index: 130;
  display: none;
  grid-template-columns: 1fr;
  gap: 8px;
  padding: 8px;
  background: var(--bg-elev);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-popover);
}

.theme-picker.open .theme-menu {
  display: grid;
}

.theme-option {
  width: 100%;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  border-color: transparent;
  padding: 7px 8px;
  text-align: left;
  color: var(--text-secondary);
}

.theme-option:hover,
.theme-option.active {
  border-color: var(--border);
  color: var(--text);
}

.theme-option:hover { background: var(--interactive-hover-bg); }

.theme-option.active {
  background: var(--accent-light);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: var(--active-font-weight);
}

.theme-menu-section {
  display: grid;
  gap: 6px;
}

.theme-menu-label {
  padding: 0 4px;
  font-size: 10px;
  letter-spacing: var(--label-letter-spacing);
  text-transform: uppercase;
  color: var(--text-muted);
}

.theme-menu-divider {
  height: 1px;
  background: var(--border);
  margin: 0 2px;
}

.theme-action {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: none;
  border: var(--border-width) solid transparent;
  border-radius: var(--control-radius);
  padding: 7px 8px;
  text-align: left;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  text-transform: lowercase;
}

.theme-action:hover {
  background: var(--interactive-hover-bg);
  border-color: var(--interactive-hover-border);
  color: var(--text);
}

.theme-action-update {
  justify-content: flex-start;
  color: var(--text);
  font-weight: var(--active-font-weight);
}

.theme-action-update:hover {
  border-color: var(--warning);
}

.theme-action-update-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warning);
}

.theme-action-update-version {
  margin-left: auto;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: none;
}

.theme-action-note {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: lowercase;
}

.theme-action-toggle {
  margin-left: auto;
  padding: 1px 7px;
  border: var(--border-width) solid var(--border);
  border-radius: 999px;
  font-size: 10px;
  color: var(--text-muted);
  text-transform: lowercase;
}

.theme-action-toggle.is-on {
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent);
}

.theme-menu-devices {
  margin-top: 4px;
  padding: 5px 8px 2px;
  border-top: var(--border-width) solid var(--border);
}

.theme-menu-device {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  line-height: 1.7;
  color: var(--text-muted);
  text-transform: lowercase;
}

.theme-menu-device.is-self .theme-menu-device-name {
  color: var(--text-secondary);
}

.theme-menu-device-seen {
  font-variant-numeric: tabular-nums;
}

.theme-option-swatch {
  width: 14px;
  height: 14px;
  border-radius: 999px;
}

.theme-option-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.main {
  width: min(100%, 1180px);
  margin: 0 auto;
  padding: var(--main-padding-y) var(--main-padding-x) 46px;
}

.main[data-view="overview"],
.main[data-view="search"],
.main[data-view="meetings"],
.main[data-view="reviews"] {
  width: min(100%, 1260px);
}

.main[data-view="planung"],
.main[data-view="team"],
.main[data-view="kontakte"],
.main[data-view="me"] {
  width: min(100%, 1680px);
}

.setup-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(8px) saturate(0.9);
  -webkit-backdrop-filter: blur(8px) saturate(0.9);
}

.setup-shell {
  width: min(100%, 520px);
  display: grid;
  gap: var(--layout-gap);
  box-shadow: var(--shadow-popover);
}

.setup-brand {
  height: var(--header-height);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-bottom: var(--border-width) solid var(--border);
}

.setup-panel {
  background: var(--surface);
  border: var(--border-width) solid var(--border);
  border-left: var(--border-accent-width) solid var(--accent);
  border-radius: var(--radius-md);
  padding: 24px;
  display: grid;
  gap: 14px;
}

.setup-kicker {
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: var(--label-letter-spacing);
  text-transform: uppercase;
}

.setup-panel h2 {
  color: var(--text);
  font-size: 20px;
  line-height: 1.2;
  font-weight: var(--heavy-font-weight);
}

.setup-panel p {
  color: var(--text-secondary);
  font-size: 13px;
  max-width: none;
}

.setup-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--control-gap);
}

.setup-button {
  width: fit-content;
  min-height: 34px;
}

.setup-button[hidden] {
  display: none;
}

.setup-hint {
  border-top: var(--border-width) solid var(--border);
  padding-top: 10px;
  color: var(--text-muted);
  font-size: 12px;
}

.card {
  background: var(--surface);
  border: var(--border-width) solid var(--border);
  border-left: var(--border-accent-width) solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: var(--card-padding);
  margin-bottom: var(--stack-gap);
}

.board-todo {
  border-left-color: var(--blue);
  background: linear-gradient(180deg, var(--surface) 0%, var(--board-todo-bg) 100%);
}

.board-backlog {
  border-left-color: var(--text-muted);
  background: linear-gradient(180deg, var(--surface) 0%, var(--board-backlog-bg) 100%);
}

.board-waiting {
  border-left-color: var(--warning);
  background: linear-gradient(180deg, var(--surface) 0%, var(--board-waiting-bg) 100%);
}

.board-done {
  border-left-color: var(--success);
  background: linear-gradient(180deg, var(--surface) 0%, var(--board-done-bg) 100%);
}

.board-todo .card-title { color: var(--blue); }
.board-backlog .card-title { color: var(--text-secondary); }
.board-waiting .card-title { color: var(--warning); }
.board-done .card-title { color: var(--success); }

.overview-board {
  display: grid;
  grid-template-columns: repeat(4, minmax(220px, 1fr));
  gap: var(--layout-gap);
  align-items: start;
}

.overview-board .card {
  margin-bottom: 0;
}

.task-sections {
  display: grid;
  gap: var(--stack-gap);
}

.task-table-card {
  padding: 0;
  overflow: hidden;
}

.task-table-sections {
  display: grid;
  gap: var(--layout-gap);
}

.task-table-sections .task-table-card {
  margin-bottom: 0;
}

.task-table-card .task-table-section-header {
  margin-bottom: 0;
  padding: 11px var(--table-padding-x);
  border-bottom: var(--border-width) solid var(--border);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: calc(var(--label-letter-spacing) + 0.02em);
  text-transform: uppercase;
}

.task-table-wrap {
  overflow-x: auto;
}

.task-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 13px;
}

.task-table th,
.task-table td {
  padding: var(--table-padding-y) var(--table-padding-x);
  border-top: var(--border-width) solid var(--border);
  text-align: left;
  vertical-align: middle;
}

.task-table th {
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: var(--label-letter-spacing);
  text-transform: uppercase;
  background: var(--bg-elev);
  white-space: nowrap;
}

.task-table-section .task-table thead th {
  border-top: 0;
}

.task-table tbody tr:hover { background: var(--interactive-hover-bg); }
.task-table tbody tr[draggable="true"] { cursor: grab; }
.task-table tbody tr.is-done { opacity: 0.68; }
.task-table tbody tr.dragging { opacity: 0.42; cursor: grabbing; }
.task-table tbody tr.task-table-row-todo { box-shadow: inset var(--row-status-width) 0 0 var(--blue); }
.task-table tbody tr.task-table-row-backlog { box-shadow: inset var(--row-status-width) 0 0 var(--text-muted); }
.task-table tbody tr.task-table-row-waiting { box-shadow: inset var(--row-status-width) 0 0 var(--warning); }
.task-table tbody tr.task-table-row-done { box-shadow: inset var(--row-status-width) 0 0 var(--success); }
.task-table tbody tr.task-table-row-past-due {
  box-shadow: inset var(--row-danger-width) 0 0 var(--danger);
  background: color-mix(in srgb, var(--danger) 12%, var(--surface));
}
.task-table tbody tr.task-table-row-past-due:hover {
  background: color-mix(in srgb, var(--danger) 18%, var(--surface-hover));
}
.task-table-section-todo {
  border-left-color: var(--blue);
}
.task-table-section-todo .task-table-section-header {
  color: var(--blue);
  background: color-mix(in srgb, var(--blue) 12%, var(--bg-elev));
}
.task-table-section-waiting {
  border-left-color: var(--warning);
}
.task-table-section-waiting .task-table-section-header {
  color: color-mix(in srgb, var(--warning) 84%, var(--text));
  background: color-mix(in srgb, var(--warning) 14%, var(--bg-elev));
}
.task-table-section-backlog {
  border-left-color: var(--text-muted);
}
.task-table-section-backlog .task-table-section-header {
  color: var(--text-secondary);
  background: color-mix(in srgb, var(--text-muted) 12%, var(--bg-elev));
}
.task-table-section-done {
  border-left-color: var(--success);
}
.task-table-section-done .task-table-section-header {
  color: color-mix(in srgb, var(--success) 84%, var(--text));
  background: color-mix(in srgb, var(--success) 12%, var(--bg-elev));
}
.task-table-group-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.meeting-prep-preview {

.meetings-section-label {

.prep-bullets { display: grid; gap: 2px; margin-bottom: 6px; }
.prep-bullet {

}
.prep-bullet:hover { border-color: var(--interactive-hover-border); background: var(--interactive-hover-bg); }
.prep-bullet-dragging { opacity: 0.45; }
.prep-bullet-drop-before { box-shadow: 0 -2px 0 var(--accent); }

}

.prep-bullet input[type=checkbox] {

  flex-shrink: 0;
}
.prep-bullet-done .prep-bullet-input {

}
.prep-bullet-input {
  flex: 1;

  background: transparent;
  color: var(--text-primary);

  padding: 3px 4px;

.prep-bullet-input:focus { background: var(--bg-elev); }
.prep-bullet-delete {
  border: none;

  opacity: 0;
  padding: 4px;
  font-size: 12px;

}
.prep-bullet:hover .prep-bullet-delete { opacity: 1; }
.prep-bullet-delete:hover { color: var(--danger); background: var(--interactive-hover-bg); }
.prep-empty {

.prep-carryover {

.prep-carryover-row {

.prep-carryover-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.prep-carryover-source {

  background: transparent;
  color: var(--text-muted);
  padding: 1px 0;

  font-size: 11px;

.prep-carryover-source:hover { color: var(--accent); text-decoration: underline; }

.insights-list { display: grid; gap: 3px; }
.insight-row {

.insight-label {

}
.insight-value { color: var(--text-primary); min-width: 0; }
.insight-value a { color: var(--accent); text-decoration: none; }

.insight-spark {

}
.spark-bar {

}

.btn {

  font-size: 13px;
  font-weight: 500;
  cursor: pointer;

  text-transform: lowercase;
  transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);

  gap: 12px;
}

.month-review-archive-card {
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  background: var(--surface);
  padding: 12px;
}

.month-review-archive-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  padding: 10px;
}

.month-review-archive-current {
  flex: 1 1 auto;
  min-width: 0;
  text-align: center;
}

.month-review-archive-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}

.month-review-archive-title {
  margin-top: 4px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.month-review-archive-text {
  color: var(--text);
  font-size: 13px;
  line-height: 1.65;
}

.month-review-archive-empty {
  border: 1px dashed var(--border);
  background: var(--bg-elev);
  padding: 18px;
  text-align: center;
}

.month-review-archive-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}

.review-meeting-row {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  cursor: pointer;
}

.review-meeting-row:first-of-type {
  border-top: 0;
  padding-top: 0;
}

.review-meeting-row:last-child {
  padding-bottom: 0;
}

.review-meeting-row:hover {
  background: var(--interactive-hover-bg);
  box-shadow: inset 2px 0 0 var(--accent);
}

.review-schedule-card {
  overflow: hidden;
}

.review-schedule-list {
  display: grid;
  grid-template-rows: repeat(5, 60px);
  height: 300px;
}

.review-schedule-list .review-meeting-row {
  min-height: 0;
}

.review-schedule-empty {
  color: var(--text-muted);
  font-size: 14px;
}

.review-meeting-badge {
  min-width: 44px;
  text-align: center;
  padding: 4px 0;
  border: 1px solid var(--border);
  background: var(--bg-elev);
}

.review-meeting-badge-weekday {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}

.review-meeting-badge-day {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.05;
}

.review-meeting-main { min-width: 0; }

.review-marker-row {
  border-left: 2px solid var(--marker-color, var(--accent));
  padding-left: 6px;
}

.review-marker-badge {
  border-color: color-mix(in srgb, var(--marker-color, var(--accent)) 55%, var(--border));
  background: color-mix(in srgb, var(--marker-color, var(--accent)) 12%, var(--bg-elev));
}

.review-marker-badge .review-meeting-badge-day {
  color: var(--marker-color, var(--accent));
}

.review-marker-side {
  color: var(--marker-color, var(--accent));
  font-size: 11px;
  font-weight: 700;
  text-transform: lowercase;
}

.stats-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: start;
  margin-bottom: 8px;
}

.stats-inline {
  display: grid;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  padding: 0;
  overflow: hidden;
}

.stats-inline-main {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.stats-inline-meta {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  width: clamp(160px, 18vw, 200px);
  min-width: 160px;
  margin-left: 6px;
}

.stats-inline-meta .stat-chip {
  padding: 5px 8px 5px;
  gap: 6px;
}

.stats-inline-meta .stat-chip::before {
  height: 1px;
  opacity: 0.7;
}

.stats-inline-meta .stat-number {
  font-size: 13px;
}

.stats-inline-meta .stat-label {
  font-size: 9px;
  letter-spacing: 0.14em;
}

.stat-chip {
  position: relative;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
  padding: 8px 10px 7px;
  border-right: 1px solid var(--border);
  background: transparent;
}

.stat-card {
  border: 0;
  padding: 0;
  text-align: left;
  background: transparent;
}

.simple-stats-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.simple-stats-row .stat-card {
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 7px 10px;
  min-width: 170px;
}

.stat-chip:last-child {
  border-right: 0;
}

.stat-chip::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: currentColor;
  opacity: 0.95;
}

.stats-inline .stat-number {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}

.stats-inline .stat-label {
  font-size: 10px;
  color: currentColor;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  opacity: 0.92;
  white-space: nowrap;
}

.stat-card .stat-number { font-size: 14px; font-weight: 700; }
.stat-card .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }

.review-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(280px, 1fr));
  gap: 8px;
  align-items: start;
}

/* Bei fuenf bis sieben Leuten passen die Karten nebeneinander — dann steht
   alles gleichzeitig da und niemand muss aufklappen. */
.review-team-focus-card {
  grid-column: 1 / -1;
}

/* Bewusst kein align-items:start — die Karten einer Reihe ziehen sich auf
   dieselbe Hoehe, sonst franst das Raster bei unterschiedlich vielen
   Bloecken aus. */
.review-team-focus-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 8px;
}

.dashboard-links {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex: 1 1 auto;
  overflow-x: auto;
  scrollbar-gutter: stable;
}

.dashboard-links-title {
  display: none;
  flex: 0 0 auto;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: lowercase;
}

.dashboard-link,
.dashboard-link-empty {
  min-width: 0;
  height: 30px;
  display: inline-grid;
  align-items: center;
  gap: 4px;
  padding: 3px 7px;
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  background: transparent;
  color: var(--text);
  text-align: left;
  text-decoration: none;
  transition: background-color 0.08s, border-color 0.08s, transform 0.08s;
}

.dashboard-link {
  grid-template-columns: minmax(0, 1fr) 16px;
  flex: 0 0 auto;
  max-width: 260px;
}

.dashboard-link-empty {
  grid-template-columns: 18px minmax(0, 1fr);
}

.dashboard-link-main {
  min-width: 0;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: center;
  gap: 5px;
  color: inherit;
  text-decoration: none;
}

.dashboard-link-empty {
  cursor: pointer;
  font: inherit;
}

.dashboard-link:hover,
.dashboard-link-empty:hover {
  background: var(--interactive-hover-bg);
  border-color: color-mix(in srgb, var(--accent) 58%, var(--border));
}

.dashboard-link-jira { border-left-color: var(--blue); }
.dashboard-link-gitlab { border-left-color: var(--accent); }

.dashboard-link-mark {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid currentColor;
  color: var(--accent);
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
}

.dashboard-link-jira .dashboard-link-mark { color: var(--blue); }
.dashboard-link-gitlab .dashboard-link-mark { color: var(--accent); }

.dashboard-link-mark svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.dashboard-link-copy {
  min-width: 0;
  display: grid;
  gap: 2px;
}

.dashboard-link-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dashboard-link-title {
  font-size: 11px;
  font-weight: 700;
}

.dashboard-link-meta {
  display: none;
  color: var(--text-muted);
  font-size: 10px;
}

.dashboard-link-edit {
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--text-muted);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 11px;
}

.dashboard-link-edit:hover {
  color: var(--accent);
  background: var(--interactive-hover-bg);
  border-color: var(--interactive-hover-border);
  border-color: var(--border);
  background: var(--surface);
}

.dashboard-link-add {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  line-height: 1;
}

.dashboard-link-add:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--interactive-hover-bg);
}

.dashboard-review-action {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.dashboard-review-count {
  min-width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid currentColor;
  border-radius: 999px;
  color: currentColor;
  opacity: .72;
  font-size: 11px;
}

.dashboard-focus {
  margin-bottom: 8px;
  padding: 7px 8px;
  border-left-color: var(--accent);
}

.dashboard-focus-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 5px;
}

.dashboard-focus-kicker {
  color: var(--text-muted);
  font-size: 11px;
  text-transform: lowercase;
}

.dashboard-focus-title {
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
}

.dashboard-focus-list {
  display: grid;
  gap: 4px;
}

.dashboard-focus-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  background: var(--bg-elev);
  padding: 5px 7px;
}

.dashboard-focus-copy {
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.dashboard-focus-copy .focus-title,
.dashboard-focus-copy .focus-desc {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Kopf, Kacheln, Blockliste: die Kacheln stehen bei jeder Karte auf derselben
   Hoehe, die Blockliste darunter nimmt den Rest und scrollt bei Bedarf. */
.tf-card {
  display: grid;
  grid-template-rows: auto auto 1fr;
  gap: 8px;
  min-width: 0;
  padding: 8px;
  border: 1px solid var(--border);
  border-left-width: 3px;
  background: var(--surface);
  transition: border-color 140ms ease;
}

.tf-card:hover {
  border-color: color-mix(in srgb, var(--accent) 38%, var(--border));
}

.tf-card-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 8px;
}

.tf-card-high { border-left-color: var(--danger); }
.tf-card-medium { border-left-color: var(--warning); }
.tf-card-low { border-left-color: var(--success); }

.tf-card-absent {
  border-color: color-mix(in srgb, var(--text-muted) 36%, var(--border));
  border-left-color: var(--text-muted);
  background: color-mix(in srgb, var(--text-muted) 8%, var(--surface));
  color: var(--text-muted);
}

.tf-card-absent .tf-name-link,
.tf-card-absent .tf-blocks,
.tf-card-absent .tf-metric-row {
  filter: grayscale(1);
  opacity: 0.62;
}

.review-row-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: none;
}

.tf-person-link,
.tf-name-link {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.tf-person-link {
  display: inline-flex;
}

.tf-name-link:hover {
  color: var(--accent);
}

.review-row-meta {
  color: var(--text-muted);
  font-size: 11px;
  margin-top: 2px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.review-row-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  min-width: 74px;
}

.review-nested-card {
  margin-top: 8px;
  margin-bottom: 0;
  background: var(--bg-elev);
}

.review-due-card {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
  max-height: calc(100vh - 220px);
}

.review-due-panel {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 0;
  min-height: 0;
}

.review-due-sections {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: auto;
  gap: 8px;
  min-height: 0;
}

.review-due-section {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  padding: 0;
  min-height: 0;
  max-height: 330px;
  overflow: hidden;
}

.review-due-section-danger {
  border-left: 3px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 5%, var(--bg-elev));
}

.review-due-section-warning {
  border-left: 3px solid var(--warning);
  background: color-mix(in srgb, var(--warning) 7%, var(--bg-elev));
}

.review-due-section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 9px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 64%, transparent);
}

.review-due-section-head > :first-child {
  min-width: 0;
}

.review-due-section-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.review-due-section-danger .review-due-section-title {
  color: var(--danger);
}

.review-due-section-warning .review-due-section-title {
  color: var(--warning);
}

.review-due-section-hint,
.review-due-empty {
  color: var(--text-muted);
  font-size: 12px;
}

.review-due-section-count {
  min-width: 28px;
  padding: 3px 6px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

.review-due-section-danger .review-due-section-count {
  color: var(--danger);
}

.review-due-section-warning .review-due-section-count {
  color: var(--warning);
}

.review-due-empty {
  padding: 10px;
}

.review-due-item-list {
  display: grid;
  flex: 1;
  align-content: start;
  min-height: 0;
  overflow-y: auto;
  margin: 0;
  padding: 0;
  list-style: none;
  scrollbar-gutter: stable;
}

.review-due-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.review-due-item:last-child {
  border-bottom: 0;
}

.review-due-item-main {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 8px;
  width: 100%;
  min-width: 0;
  padding: 8px 9px;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.review-due-item-main:hover {
  background: var(--interactive-hover-bg);
}

.review-due-item-date {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  padding-top: 1px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.review-due-item-day {
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.1;
}

.review-due-item-age {
  font-size: 10px;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.review-due-item-danger .review-due-item-day,
.review-due-item-danger .review-due-item-age {
  color: var(--danger);
}

.review-due-item-warning .review-due-item-day {
  color: var(--warning);
}

.review-due-item-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.review-due-item-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.review-due-item-notes {
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.review-due-item-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  color: var(--text-muted);
  font-size: 11px;
  min-width: 0;
}

.review-due-item-check {
  width: 34px;
  border: 0;
  border-left: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text-muted);
  cursor: pointer;
  font: inherit;
  font-weight: 700;
}

.review-due-item-check:hover {
  background: var(--success-light);
  color: var(--success);
}

.tf-name-line {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tf-absent-mark {
  flex-shrink: 0;
  padding: 1px 4px;
  border: 1px solid color-mix(in srgb, var(--text-muted) 42%, var(--border));
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.tf-metric-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.tf-blocks {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  align-content: start;
  gap: 3px;
  min-height: 0;
}

.tf-blocks-scroll {
  position: relative;
  min-height: 0;
}

/* Dass die Liste weitergeht, muss man sehen, bevor man scrollt: der Verlauf
   schneidet die vierte Zeile an, die Zeile darunter sagt wie viele fehlen.
   Wo scroll-driven animations unterstuetzt werden, blendet beides am
   Listenende aus. */
.tf-blocks-more .tf-blocks-scroll::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 16px;
  pointer-events: none;
  background: linear-gradient(to top, var(--surface), transparent);
}

.tf-blocks-hint {
  padding-top: 1px;
  color: color-mix(in srgb, var(--accent) 70%, var(--text-muted));
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-align: center;
  text-transform: uppercase;
}

@supports (animation-timeline: scroll()) {
  .tf-blocks-more { timeline-scope: --tf-blocks-scroll; }
  .tf-blocks-more .tf-blocks-list { scroll-timeline: --tf-blocks-scroll block; }
  .tf-blocks-more .tf-blocks-scroll::after,
  .tf-blocks-more .tf-blocks-hint {
    animation: tf-blocks-fade linear both;
    animation-timeline: --tf-blocks-scroll;
  }
}

@keyframes tf-blocks-fade {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Drei Zeilen plus ein angeschnittener Rest: der Schnitt ist die halbe
   Scroll-Ansage, den Rest macht der Verlauf aus .tf-blocks-more. */
.tf-blocks-list {
  display: grid;
  align-content: start;
  gap: 3px;
  max-height: 94px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}

.tf-blocks-count {
  padding: 0 3px;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 9px;
}

.tf-blocks-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.tf-blocks-link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--text-muted);
  font: inherit;
  letter-spacing: 0.06em;
  cursor: pointer;
}

.tf-blocks-link:hover { color: var(--accent); }

.tf-block {
  display: grid;
  grid-template-columns: 3px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5px 8px 5px 0;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg-elev) 78%, var(--surface));
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.tf-block:hover {
  border-color: color-mix(in srgb, var(--accent) 52%, var(--border));
  background: var(--interactive-hover-bg);
}

.tf-block-mark {
  align-self: stretch;
  background: var(--accent);
}

.tf-block-upcoming .tf-block-mark {
  background: color-mix(in srgb, var(--text-muted) 60%, transparent);
}

.tf-block-overdue {
  border-color: color-mix(in srgb, var(--danger) 50%, var(--border));
  background: color-mix(in srgb, var(--danger) 10%, var(--bg-elev));
}

.tf-block-overdue .tf-block-mark { background: var(--danger); }

.tf-block-overdue .tf-block-timing {
  color: color-mix(in srgb, var(--danger) 82%, var(--text));
  font-weight: 700;
}

/* Fertig von der Person, blockiert bei jemand anderem. */
.tf-block-handover .tf-block-mark {
  background: color-mix(in srgb, var(--warning) 78%, transparent);
}

.tf-block-handover .tf-block-title { color: var(--text-secondary); }

.tf-block-handover .tf-block-timing {
  color: color-mix(in srgb, var(--warning) 80%, var(--text));
  font-weight: 700;
}

.tf-block-body {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
}

.tf-block-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 600;
}

.tf-block-upcoming .tf-block-title { color: var(--text-secondary); }

.tf-block-ref {
  flex-shrink: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--accent);
}

.tf-block-timing {
  flex-shrink: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
}

.tf-blocks-empty {
  padding: 6px 8px;
  border: 1px dashed var(--border);
  color: var(--text-muted);
  font-size: 11px;
}


/* Label und Wert stehen in einer Zeile: die Kachel ist eine Kennzahl, kein
   Absatz — zwei Zeilen statt drei sparen pro Karte rund 14px. */
.tf-metric {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-content: start;
  align-items: baseline;
  gap: 2px 6px;
  min-width: 0;
  padding: 5px 7px;
  border: 1px solid var(--border);
  border-left-width: 3px;
  background: color-mix(in srgb, var(--bg-elev) 78%, var(--surface));
}

.tf-metric-note { grid-column: 1 / -1; }

button.tf-metric {
  width: 100%;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.tf-metric-action:hover {
  border-color: color-mix(in srgb, var(--accent) 52%, var(--border));
  background: var(--interactive-hover-bg);
}

.tf-metric-action:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.tf-metric-label {
  flex-shrink: 0;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.tf-metric-value {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.25;
}

.tf-metric-note {
  min-width: 0;
  color: var(--text-secondary);
  font-size: 10px;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.tf-sig-ok {
  border-color: color-mix(in srgb, var(--success) 42%, var(--border));
  background: color-mix(in srgb, var(--success) 7%, var(--bg-elev));
}

.tf-sig-warn {
  border-color: color-mix(in srgb, var(--warning) 48%, var(--border));
  background: color-mix(in srgb, var(--warning) 10%, var(--bg-elev));
}

.tf-sig-bad {
  border-color: color-mix(in srgb, var(--danger) 50%, var(--border));
  background: color-mix(in srgb, var(--danger) 10%, var(--bg-elev));
}

.tf-sig-ok .tf-metric-value { color: color-mix(in srgb, var(--success) 72%, var(--text)); }
.tf-sig-warn .tf-metric-value { color: color-mix(in srgb, var(--warning) 78%, var(--text)); }
.tf-sig-bad .tf-metric-value { color: color-mix(in srgb, var(--danger) 82%, var(--text)); }

.stat-todo { color: var(--blue); background: var(--stat-todo-bg); }
.stat-waiting { color: var(--warning); background: var(--stat-waiting-bg); }
.stat-done { color: var(--success); background: var(--stat-done-bg); }
.stat-wins { color: var(--stat-wins-text); background: var(--stat-wins-bg); }
.stat-backlog { color: var(--text-secondary); background: var(--stat-backlog-bg); }

.focus-card {
  background: transparent;
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  padding: 8px;
  margin-bottom: 6px;
}

.focus-title { font-weight: 600; font-size: 12px; color: var(--accent); }
.focus-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.filters {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: background-color 0.08s, border-color 0.08s, color 0.08s;
  text-transform: lowercase;
}

.filter-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--interactive-hover-bg); }
.filter-btn.active {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--accent);
  border-left: 2px solid var(--accent);
}

.meeting-detail-section { margin-bottom: 10px; }
.meeting-detail-section h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.meeting-detail-section-emphasis {
  padding: 12px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
}

.meeting-detail-section-emphasis h3 {
  margin-bottom: 8px;
}

.oneonone-carryover {
  border-left: 3px solid var(--accent);
}

.notes-page-head .overview-toolbar {
  grid-template-columns: auto minmax(240px, 420px);
  align-items: center;
}
.notes-page-intro {
  margin: -6px 0 14px;
  color: var(--text-muted);
  font-size: 12px;
}
.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
  gap: 12px;
  align-items: start;
}
.note-card {
  padding: 10px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--warning);
  background: var(--bg-elev);
}
.note-card.is-focused { border-color: var(--accent); }
.note-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}
.note-title {
  flex: 1;
  min-width: 0;
  padding: 5px 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  font-weight: 700;
}
.note-title:hover { border-color: var(--interactive-hover-border); }
.note-title:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.note-editor {
  width: 100%;
  min-height: 320px;
  resize: vertical;
  line-height: 1.55;
}
.note-meta {
  margin-top: 5px;
  color: var(--text-muted);
  font-size: 10px;
  text-align: right;
}
.planung-search { min-width: 210px; }
.planung-search-results {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 8px;
  padding: 7px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
}
.planung-search-results-head {
  flex: 0 0 auto;
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.planung-search-result {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  padding: 5px 7px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
.planung-search-result:hover { border-color: var(--accent); background: var(--interactive-hover-bg); }
.planung-search-result > span:not(.tl-block-swatch) { color: var(--text-muted); }
.planung-search-results-empty { color: var(--text-muted); font-size: 12px; }

.oneonone-carryover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.oneonone-carryover-head h3 {
  margin-bottom: 0;
}

.oneonone-carryover-count,
.meeting-carryover-preview {
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.oneonone-carryover-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.oneonone-carryover-column {
  min-width: 0;
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 8px;
}

.oneonone-carryover-title {
  margin-bottom: 6px;
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.oneonone-carryover-list {
  display: grid;
  gap: 4px;
}

.oneonone-carryover-list .item {
  margin-bottom: 0;
}

.oneonone-carryover-empty {
  color: var(--text-muted);
  font-size: 12px;
}

.oneonone-carryover-signals {
  display: grid;
  gap: 4px;
}

.oneonone-carryover-signal {
  display: grid;
  grid-template-columns: 42px auto minmax(0, 1fr);
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 5px 6px;
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  background: var(--bg-elev);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}

.oneonone-carryover-signal:hover {
  background: var(--interactive-hover-bg);
  border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
}

.oneonone-carryover-signal-highlight {
  border-left-color: var(--success);
}

.oneonone-carryover-signal-concern {
  border-left-color: var(--warning);
}

.oneonone-carryover-date {
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.oneonone-carryover-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.meeting-carryover-preview {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 8px;
  margin-bottom: 10px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  background: var(--bg-elev);
}

.meeting-carryover-preview strong {
  color: var(--accent);
}

.meeting-section-card {
  margin-bottom: 10px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
}

.meeting-section-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  cursor: pointer;
}

.meeting-section-toggle:hover { color: var(--accent); background: var(--interactive-hover-bg); }

.meeting-section-toggle-icon {
  font-size: 16px;
  line-height: 1;
  color: var(--text-secondary);
}

.meeting-section-content {
  padding: 0 12px 12px;
}

.meeting-section-content .meeting-detail-section {
  margin-bottom: 0;
}

.meeting-status-preview {
  margin-bottom: 12px;
  padding: 8px;
  border: 1px dashed var(--border);
  background: var(--bg-elev);
}

.meeting-status-preview h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.person-detail-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.person-avatar {
  width: 30px;
  height: 30px;
  border-radius: 0;
  border: 1px solid var(--accent);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
}

.growth-list {
  display: grid;
  gap: 4px;
}

.growth-entry {
  display: grid;
  grid-template-columns: 64px auto 1fr;
  gap: 10px;
  align-items: center;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-left: 2px solid transparent;
  background: var(--surface);
  font-size: 13px;
  cursor: pointer;
}

.growth-entry:hover {
  background: var(--interactive-hover-bg);
}

.growth-highlight {
  border-left-color: #4e8d68;
}

.growth-concern {
  border-left-color: #c58943;
}

.growth-date {
  color: var(--text-muted);
  font-size: 12px;
}

.growth-text {
  color: var(--text);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.segmented-toggle {
  display: inline-grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 12px;
}

.capture-mode-toggle {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.segmented-toggle-btn {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 700;
  text-transform: lowercase;
  cursor: pointer;
}

.segmented-toggle-btn.active {
  background: var(--interactive-hover-bg);
  color: var(--text);
}

.impact-month {
  margin-bottom: 12px;
  padding: 12px;
  background: var(--surface);
}

.impact-month-header {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}

.impact-month-kicker,
.impact-month-summary {
  color: var(--text-muted);
  font-size: 11px;
}

.impact-month-title {
  font-size: 18px;
  font-weight: 700;
  margin-top: 2px;
}

.impact-month-progress {
  height: 5px;
  background: var(--bg-elev);
  margin-top: 10px;
  overflow: hidden;
}

.impact-month-progress-bar {
  height: 100%;
  background: var(--accent);
}

.impact-month-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(220px, 0.42fr);
  gap: 10px;
  margin-top: 10px;
  align-items: start;
}

.impact-month-column {
  display: grid;
  gap: 8px;
  align-content: start;
  align-self: start;
}

.impact-month-column-head {
  font-size: 12px;
  font-weight: 700;
  text-transform: lowercase;
  color: var(--text-secondary);
}

.impact-stream {
  display: grid;
  gap: 6px;
  align-content: start;
  grid-auto-rows: max-content;
}

.impact-entry {
  display: grid;
  grid-template-columns: 52px auto 1fr 12px;
  gap: 10px;
  align-items: center;
  align-self: start;
  width: 100%;
  border: 1px solid var(--border);
  border-left: 2px solid var(--border);
  background: var(--bg-elev);
  padding: 8px 10px;
  text-align: left;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.impact-entry:hover {
  background: var(--interactive-hover-bg);
  border-color: var(--accent);
}

.impact-entry-personal { border-left: 2px solid #c24c8f; }
.impact-entry-highlight { border-left: 2px solid #4e8d68; }
.impact-entry-concern { border-left: 2px solid #c58943; }

.impact-entry-date {
  color: var(--text-muted);
  font-size: 12px;
}

.impact-entry-text {
  color: var(--text);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.impact-entry-pulse {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  justify-self: end;
}

.impact-entry-personal .impact-entry-pulse { background: #c24c8f; }
.impact-entry-highlight .impact-entry-pulse { background: #4e8d68; }
.impact-entry-concern .impact-entry-pulse { background: #c58943; }

.impact-person-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.impact-person-strip-panel {
  margin-top: 0;
  align-content: start;
}

.impact-person-chip {
  display: inline-grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 10px;
  padding: 8px 12px 8px 8px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  cursor: pointer;
  color: var(--text);
}

.impact-person-chip:hover {
  background: var(--interactive-hover-bg);
  border-color: var(--accent);
}

.impact-person-copy {
  display: grid;
  gap: 2px;
  text-align: left;
}

.impact-person-name {
  font-weight: 600;
}

.impact-person-metrics {
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.impact-metric-positive {
  color: #4e8d68;
  font-weight: 700;
}

.impact-metric-negative {
  color: #c58943;
  font-weight: 700;
}

.impact-metric-sep {
  color: var(--text-muted);
}

@media (max-width: 900px) {
  .impact-month-header,
  .impact-month-grid {
    grid-template-columns: 1fr;
    display: grid;
  }

  .impact-month-header {
    gap: 10px;
  }

  .month-close-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 700px) {
  .month-reflection-header,
  .month-close-actions {
    display: grid;
    gap: 8px;
  }
}

.back-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 12px;
  padding: 4px 0;
  margin-bottom: 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.back-btn:hover { color: var(--accent); }

.empty-state {
  text-align: center;
  padding: 22px 8px;
  color: var(--text-muted);
}

.empty-state-icon { font-size: 16px; margin-bottom: 4px; }
.empty-state-text { font-size: 12px; }

.month-selector {
  display: flex;
  align-items: center;
  gap: 2px;
  border: var(--border-width) solid var(--border);
  border-radius: var(--control-radius);
  padding: 2px;
  background: var(--bg-elev);
  width: 100%;
  box-sizing: border-box;
}

.month-selector button {
  background: none;
  border: var(--border-width) solid var(--border);
  border-radius: var(--control-radius);
  padding: 3px 6px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-secondary);
  transition: border-color var(--transition-fast), color var(--transition-fast), background-color var(--transition-fast);
}

.month-selector button:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--interactive-hover-bg);
}

.month-label {
  flex: 1 1 auto;
  font-weight: 600;
  font-size: 13px;
  min-width: 0;
  text-align: center;
  text-transform: lowercase;
}

.kbd {
  display: inline-block;
  padding: 1px 4px;
  background: var(--bg-elev);
  border: var(--border-width) solid var(--border);
  border-radius: var(--badge-radius);
  font-size: 11px;
  font-family: monospace;
  color: var(--text-muted);
}

.toast {
  position: fixed;
  bottom: 90px;
  right: 10px;
  max-width: min(520px, calc(100vw - 20px));
  background: var(--surface);
  color: var(--text);
  border: var(--border-width) solid var(--border);
  border-left: var(--border-accent-width) solid var(--accent);
  padding: var(--control-padding-y) var(--control-padding-x);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-float);
  font-size: 12px;
  z-index: 400;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity var(--transition-fast), transform var(--transition-fast);
  pointer-events: none;
}

.toast.show { opacity: 1; transform: translateY(0); }

.toast.toast-error {
  border-color: var(--danger);
  border-left-color: var(--danger);
  background: var(--danger-light);
}

/* Update banner */
.theme-menu-version {
  padding: 2px 4px 0;
  font-size: 10px;
  letter-spacing: var(--label-letter-spacing);
  color: var(--text-muted);
}

.update-banner {
  position: fixed;
  bottom: 90px;
  left: 10px;
  max-width: min(440px, calc(100vw - 20px));
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  color: var(--text);
  border: var(--border-width) solid var(--border);
  border-left: var(--border-accent-width) solid var(--warning);
  padding: var(--control-padding-y) var(--control-padding-x);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-float);
  font-size: 12px;
  z-index: 401;
}

.update-banner-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--warning);
}

.update-banner-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.update-banner-title {
  font-weight: var(--active-font-weight);
  text-transform: lowercase;
}

.update-banner-version {
  margin-left: 6px;
  color: var(--text-muted);
  font-weight: 400;
}

.update-banner-path {
  color: var(--text-muted);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.update-banner-action {
  flex: none;
  background: none;
  border: var(--border-width) solid var(--border);
  border-radius: var(--control-radius);
  padding: 5px 10px;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 12px;
  text-transform: lowercase;
}

.update-banner-action:hover {
  background: var(--interactive-hover-bg);
  border-color: var(--accent);
  color: var(--text);
}

.update-banner-close {
  flex: none;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 0 2px;
}

.update-banner-close:hover { color: var(--text); background: var(--interactive-hover-bg); }

/* QuickNotes */
.quicknotes {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 150;
  display: flex;
  flex-direction: column;
  pointer-events: auto;
}

.quicknotes-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: calc(var(--header-height) - 12px);
  padding: 0 12px;
  background-color: var(--quicknotes-bar-bg);
  background-image: var(--quicknotes-bar-gradient);
  border-top: var(--border-width) solid var(--quicknotes-bar-border);
  border-left: var(--border-accent-width) solid var(--accent);
  cursor: pointer;
  pointer-events: auto;
  transition: background-color var(--transition-fast), background-image var(--transition-fast);
  user-select: none;
}

.quicknotes-bar:hover {
  background-color: var(--quicknotes-bar-bg-hover);
  background-image: var(--quicknotes-bar-gradient-hover);
  box-shadow: inset 0 0 0 1px var(--interactive-hover-border);
}

.quicknotes-label {
  font-size: 13px;
  font-weight: var(--active-font-weight);
  color: var(--accent);
  text-transform: lowercase;
}

.quicknotes-label-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quicknotes-indicator {
  display: inline-flex;
  align-items: center;
  min-width: 44px;
  padding: var(--badge-padding-y) var(--badge-padding-x);
  border: var(--border-width) solid var(--quicknotes-indicator-border);
  border-radius: var(--badge-radius);
  background: var(--quicknotes-indicator-bg);
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: var(--label-letter-spacing);
  text-transform: uppercase;
}

.quicknotes-indicator[hidden] {
  display: none;
}

.quicknotes-indicator.has-content {
  border-color: var(--quicknotes-indicator-active-border);
  background: var(--quicknotes-indicator-active-bg);
  color: var(--quicknotes-indicator-active-text);
}

.quicknotes-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quicknotes-capture {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 26px;
  padding: 0 8px;
  border: var(--border-width) solid var(--quicknotes-capture-border);
  border-radius: var(--control-radius);
  background: var(--quicknotes-capture-bg);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  text-transform: lowercase;
}

.quicknotes-capture:hover {
  background: var(--quicknotes-capture-bg-hover);
  border-color: var(--accent);
}

.quicknotes-capture-label {
  color: var(--accent);
  font-size: 13px;
  font-weight: var(--active-font-weight);
}

.quicknotes-kbd {
  color: var(--text-secondary);
  border: var(--border-width) solid var(--border);
  border-radius: var(--badge-radius);
  background: var(--bg-elev);
  padding: 1px 6px;
  font-size: 11px;
  letter-spacing: var(--label-letter-spacing);
  text-transform: uppercase;
}

.quicknotes-panel {
  height: 0;
  overflow: hidden;
  transition: height 0.15s ease;
  pointer-events: none;
  background: var(--bg-elev);
  border-top: var(--border-width) solid var(--border);
}

.quicknotes.open .quicknotes-panel {
  height: min(50vh, 460px);
  pointer-events: auto;
}

.quicknotes.open .quicknotes-bar {
  border-left-color: var(--accent);
}

.quicknotes-editor {
  width: 100%;
  height: 100%;
  padding: 10px 12px;
  border: none;
  outline: none;
  resize: none;
  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg-elev);
  caret-color: var(--accent);
}

.quicknotes-editor::placeholder {
  color: var(--text-muted);
}

.quicknotes-editor::selection {
  background: var(--accent);
  color: #fff;
}

/* Move toast up when quicknotes is open */
.quicknotes.open ~ .toast {
  bottom: min(calc(50vh + 90px), 550px);
}

/* ============================================================
   TIMELINE / PLANUNG
   ============================================================ */
.timeline {
  border: 1px solid var(--border);
  background: var(--surface);
  overflow-x: auto;
  overflow-y: hidden;
  font-size: 12px;
  user-select: none;
}

.timeline-dense { font-size: 11px; }

.timeline-compact .tl-header,
.timeline-compact .tl-row {
  grid-template-columns: 140px 1fr;
  min-width: 0;
}

.timeline-compact .tl-body {
  min-width: 0;
}

.timeline-compact .tl-person,
.timeline-compact .tl-person-head {
  padding-left: 6px;
  padding-right: 6px;
}

.timeline-compact .tl-person-name {
  font-size: 10px;
}

.timeline-compact .tl-person-cap {
  font-size: 10px;
}
.timeline-compact .tl-person-cap .tl-cap-days {
  font-size: 11px;
}

.tl-header,
.tl-row {
  display: grid;
  grid-template-columns: 180px 1fr;
  align-items: stretch;
  min-width: 720px;
}

.tl-header {
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
  position: sticky;
  top: 0;
  z-index: 2;
}

.tl-person-head,
.tl-cap-head {
  padding: 6px 10px;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-right: 1px solid var(--border);
}
.tl-person-head {
  background: var(--bg-elev);
}
.tl-cap-head {
  border-right: none;
  border-left: 1px solid var(--border);
  text-align: right;
  background: var(--bg-elev);
}

.tl-grid-head { display: flex; flex-direction: column; }
.tl-months-row,
.tl-days-row {
  display: grid;
  min-width: 0;
}
.tl-months-row { border-bottom: 1px dashed var(--border); }
.tl-month-cell {
  padding: 4px 6px;
  font-size: 11px;
  color: var(--text-secondary);
  border-right: 1px solid var(--border);
  text-transform: lowercase;
  white-space: nowrap;
  overflow: hidden;
}
.tl-day-cell {
  padding: 3px 0;
  text-align: center;
  font-size: 10px;
  color: var(--text-muted);
  border-right: 1px solid var(--border);
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  line-height: 1.05;
}

.tl-day-dow {
  font-size: 9px;
  text-transform: none;
}

.tl-day-num {
  font-size: 11px;
  font-weight: 600;
}
.tl-day-cell.tl-week-start {
  border-left: 2px solid color-mix(in srgb, var(--accent) 45%, var(--border));
}
.tl-day-cell.tl-weekend {
  background: var(--weekend-bg);
  box-shadow:
    inset 0 1px 0 var(--weekend-bg-strong),
    inset 0 -1px 0 var(--weekend-border);
  color: var(--weekend-text);
  font-weight: 600;
  opacity: 0.9;
}
.tl-day-cell.tl-today { background: var(--today-bg); color: var(--today-text); font-weight: 700; }

.tl-body {
  position: relative;
  display: grid;
  gap: 14px;
  padding: 12px 0;
  min-width: 720px;
}

.tl-body-today-line {
  position: absolute;
  top: 0.5rem;
  bottom: -0.375rem;
  left: calc(var(--tl-person-col) + (100% - var(--tl-person-col)) * var(--tl-today-frac));
  transform: translateX(-50%);
  width: 0.125rem;
  background: var(--today-line);
  pointer-events: none;
  z-index: 5;
}

.tl-body-today-line::before {
  content: '';
  position: absolute;
  top: -0.25rem;
  left: 50%;
  transform: translateX(-50%);
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 999px;
  background: var(--today-line);
  box-shadow: 0 0 0 0.125rem var(--surface);
}

.tl-row {
  border-bottom: none;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 82%, var(--bg-elev));
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
  overflow: hidden;
}
/* row-wide support background removed — per-cell highlighting only */

.tl-person {
  padding: 12px 10px;
  border-right: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  gap: 4px;
  min-width: 0;
  background: color-mix(in srgb, var(--surface) 88%, var(--bg-elev));
}
.tl-person:hover { background: var(--interactive-hover-bg); }
.tl-person-main,
.tl-person-top {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.tl-person-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }

.tl-person-cap {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
  padding-left: 0;
}
.tl-person-cap .tl-cap-days { font-size: 12px; font-weight: 700; color: var(--text); }
.tl-person-cap .tl-cap-neg { color: var(--danger); }
.tl-person-cap .tl-cap-support { color: var(--warning); font-weight: 600; font-size: 11px; }

.tl-sup-badge {
  background: var(--warning);
  color: var(--bg);
  font-size: 9px;
  padding: 1px 4px;
  letter-spacing: 0.06em;
  font-weight: 700;
  flex-shrink: 0;
}

.tl-track {
  position: relative;
  min-height: var(--tl-track-height, 68px);
  min-width: 0;
  cursor: crosshair;
  background: color-mix(in srgb, var(--surface) 72%, var(--bg-elev));
}
.timeline-dense .tl-track { min-height: var(--tl-track-height, 52px); }

.tl-track-grid,
.tl-track-overlay {
  position: absolute;
  inset: 0;
}

.tl-track-grid {
  display: grid;
  min-height: inherit;
}

.tl-track-overlay {
  pointer-events: none;
  overflow: visible;
}

.tl-insert-lane {
  position: absolute;
  left: 0;
  right: 0;
  display: grid;
  pointer-events: auto;
  z-index: 1;
}

.tl-insert-cell {
  border-right: 1px solid transparent;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.tl-insert-button {
  appearance: none;
  border: 1px solid currentColor;
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  color: var(--text-muted);
  cursor: pointer;
  width: 20px;
  height: 20px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: auto;
  font-size: 16px;
  font-weight: 700;
  line-height: 1;
  transition: opacity 0.12s ease, background-color 0.12s ease, color 0.12s ease;
}

.tl-track:hover .tl-insert-button {
  opacity: 0.45;
}

.tl-track.tl-track-creating .tl-insert-button,
.tl-track.tl-track-creating .tl-insert-button:hover,
.tl-track.tl-track-creating .tl-insert-button:focus-visible {
  opacity: 0;
  pointer-events: none;
}

.tl-insert-button:hover,
.tl-insert-button:focus-visible {
  opacity: 1;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
  outline: none;
}

.tl-cell {
  border-right: 1px solid var(--border);
  min-width: 0;
}
.tl-cell.tl-week-start {
  border-left: 2px solid color-mix(in srgb, var(--accent) 30%, var(--border));
}
.tl-cell.tl-weekend {
  background: linear-gradient(180deg, var(--weekend-bg-strong) 0%, var(--weekend-bg) 100%);
  box-shadow:
    inset 1px 0 0 var(--weekend-border),
    inset 0 1px 0 rgba(255,255,255,0.03);
  opacity: 0.8;
}
.tl-cell.tl-support-cell { background: var(--warning-light); }
.tl-cell.tl-weekend.tl-support-cell {
  background: linear-gradient(180deg, var(--weekend-support-bg-strong) 0%, var(--weekend-support-bg) 100%);
  box-shadow:
    inset 1px 0 0 var(--weekend-support-border),
    inset 0 1px 0 rgba(255,255,255,0.03);
  opacity: 0.82;
}

.tl-block {
  position: absolute;
  top: 4px;
  height: var(--tl-lane-size, 28px);
  margin: 0;
  padding: 3px 6px;
  min-width: 0;
  box-sizing: border-box;
  background: var(--blue);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: grab;
  border: 1px solid rgba(0,0,0,0.2);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 4px;
  pointer-events: auto;
  border-radius: 6px;
}
.tl-block:hover { filter: brightness(1.08); }
.tl-block:active { cursor: grabbing; }

.tl-block-highlight {
  z-index: 6;
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  animation: tl-block-highlight-pulse 2s ease-out both;
}

@keyframes tl-block-highlight-pulse {
  0%, 100% { outline-color: transparent; filter: brightness(1); }
  12%, 42% { outline-color: var(--accent); filter: brightness(1.28); }
  27%, 58% { outline-color: transparent; filter: brightness(1.08); }
}

@media (prefers-reduced-motion: reduce) {
  .tl-block-highlight { animation: none; }
}

.tl-block-label {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tl-block-single {
  z-index: 3;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
  padding: 3px 4px;
}

.tl-block-projekt { background: var(--timeline-projekt); }
.tl-block-ticket { background: var(--timeline-ticket); }
.tl-block-incident { background: var(--timeline-incident); }
.tl-block-abwesenheit { background: var(--timeline-abwesenheit); }

.tl-block-done { opacity: 0.45; }
.tl-block-done .tl-block-label { text-decoration: line-through; }
.tl-block-check { flex: 0 0 auto; font-weight: 700; }

/* Zusammengefasste Bloecke: der Sammelbalken traegt die gestapelte Kante, damit
   man sieht, dass darunter mehr liegt. Nicht ziehbar, daher kein resize-Cursor. */
.tl-block-group {
  cursor: pointer;
  box-shadow: 0 2px 0 -1px var(--bg), 0 3px 0 -1px currentColor;
}
.tl-block-group-count {
  flex: 0 0 auto;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .02em;
  padding: 0 4px;
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.22);
}
/* Liegt hinter den Bloecken und faengt keine Klicks ab. */
.tl-group-band {
  position: absolute;
  z-index: 0;
  pointer-events: none;
  border-radius: 5px;
  margin: -2px -3px;
  padding: 2px 3px;
  background: color-mix(in srgb, var(--text) 7%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 12%, transparent);
}
.tl-block-group-count.is-open { cursor: pointer; }
.tl-block-group-count.is-open:hover { background: rgba(0, 0, 0, 0.38); }
/* Kinder einer aufgeklappten Gruppe: eingerueckte Kante statt eigener Farbe,
   die Typ-Farbe soll erhalten bleiben. */
.tl-block-group-child { border-left: 3px solid rgba(0, 0, 0, 0.28); }
.tl-block-overdue { box-shadow: 0 0 0 2px var(--danger); }
.tl-block-swatch-overdue {
  background: transparent;
  border-color: var(--danger);
  box-shadow: 0 0 0 1px var(--danger);
}

.tl-block-preview {
  background: transparent;
  border: 2px dashed var(--accent);
  color: var(--accent);
  text-align: center;
  justify-content: center;
  font-weight: 700;
}

.tl-cap {
  padding: 12px 10px;
  border-left: 1px solid var(--border);
  text-align: right;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  background: var(--surface);
}
.tl-cap-days { font-weight: 700; font-size: 14px; color: var(--text); }
.tl-cap-neg { color: var(--danger); }
.tl-cap-sub { color: var(--text-muted); font-size: 10px; text-transform: uppercase; }
.tl-cap-support { color: var(--warning); font-weight: 600; font-size: 11px; }

.tl-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 10px 4px 0 4px;
  font-size: 11px;
  color: var(--text-muted);
}
.tl-legend-item { display: inline-flex; align-items: center; gap: 5px; }
.tl-block-swatch {
  display: inline-block;
  width: 14px;
  height: 10px;
  border: 1px solid rgba(0,0,0,0.2);
}
.tl-legend-today {
  display: inline-block;
  width: 2px;
  height: 12px;
  background: var(--today-line);
}
.tl-marker-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 2px;
  background: linear-gradient(135deg, #ef4444, #3b82f6);
}

.tl-months-row { position: relative; }
.tl-marker-chip {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 6px;
  font-size: 10px;
  line-height: 1.4;
  white-space: nowrap;
  cursor: pointer;
  border-radius: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  z-index: 4;
}
.tl-marker-chip:hover { filter: brightness(1.08); }
.tl-marker-dot {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  flex: 0 0 auto;
}
.tl-marker-label { overflow: hidden; text-overflow: ellipsis; }

.tl-day-cell.tl-marker-day { font-weight: 700; }

.marker-swatches {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.marker-swatch {
  position: relative;
  width: 28px;
  height: 28px;
  border-radius: 4px;
  cursor: pointer;
  border: 2px solid transparent;
  box-sizing: border-box;
}
.marker-swatch input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.marker-swatch.selected { border-color: var(--text); box-shadow: 0 0 0 2px var(--surface) inset; }

.planung-sort { display: flex; gap: 4px; }

.planung-person-filter {
  max-width: 160px;
  font-family: inherit;
  appearance: none;
  padding-right: 18px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 10px) calc(50% + 1px), calc(100% - 6px) calc(50% + 1px);
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}

.planung-person-filter option { text-transform: none; color: var(--text); background: var(--surface); }

.planung-actions {
  margin-left: auto;
  flex: 0 0 auto;
  justify-self: end;
  display: flex;
  width: auto;
}

.planung-actions .btn { width: auto; }

.form-group-parked { flex: 0 0 auto; display: flex; align-items: flex-end; }
.form-group-parked .form-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  padding-bottom: 8px;
  cursor: pointer;
  white-space: nowrap;
}
.form-input[readonly] { opacity: 0.5; }

.planung-overdue-btn { color: var(--danger); border-color: var(--danger); }
.planung-overdue-btn:hover { color: var(--danger); border-color: var(--danger); filter: brightness(1.1); }
.planung-overdue-btn.active {
  color: var(--danger);
  border-color: var(--danger);
  border-left: 2px solid var(--danger);
}

.planung-overdue-panel {
  border: 1px solid var(--border);
  border-left: 2px solid var(--danger);
  background: var(--surface);
  margin-bottom: 12px;
}
.planung-overdue-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 10px;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
}
.planung-overdue-row:last-child { border-bottom: none; }
.planung-overdue-info {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  cursor: pointer;
}
.planung-overdue-info:hover .planung-overdue-label { color: var(--accent); }
.planung-overdue-person { font-weight: 600; flex: 0 0 auto; }
.planung-overdue-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.planung-overdue-date { color: var(--danger); flex: 0 0 auto; font-size: 11px; }
.planung-overdue-actions { display: flex; gap: 6px; flex: 0 0 auto; }

.planung-parked {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 0 0 10px;
  font-size: 11px;
}
.planung-parked-head { color: var(--text-muted); text-transform: lowercase; }
.planung-parked-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  font-size: 11px;
  border: 1px dashed var(--border);
  border-radius: 3px;
  background: var(--surface);
  color: var(--text-secondary);
  cursor: pointer;
}
.planung-parked-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--interactive-hover-bg); }
.planung-parked-person { font-weight: 600; }

.person-blocks { padding: 10px 2px; }
.person-blocks-head { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.person-blocks-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--text-muted);
  text-transform: lowercase;
  margin: 8px 0 4px;
}
button.person-blocks-toggle {
  width: 100%;
  border: none;
  background: transparent;
  padding: 0;
  font: inherit;
  font-size: 10px;
  color: var(--text-muted);
  cursor: pointer;
  text-align: left;
}
button.person-blocks-toggle:hover { color: var(--accent); }
.person-blocks-toggle-icon {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  width: 10px;
  display: inline-block;
  text-align: center;
}
.person-block-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  font-size: 12px;
  cursor: pointer;
  border-radius: 3px;
}
.person-block-row:hover { background: var(--interactive-hover-bg); }
.person-block-row.person-block-done { opacity: 0.5; }
.person-block-row.person-block-done .person-block-label { text-decoration: line-through; }
.person-block-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.person-block-range { color: var(--text-muted); font-size: 11px; flex: 0 0 auto; }
.person-block-overdue {
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: 3px;
  padding: 0 5px;
  font-size: 10px;
  text-transform: lowercase;
  flex: 0 0 auto;
}
.person-block-check {
  margin-left: auto;
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
}
.person-block-check:hover { border-color: var(--success, var(--accent)); color: var(--success, var(--accent)); background: var(--interactive-hover-bg); }
.person-block-checked { margin-left: auto; color: var(--text-muted); flex: 0 0 auto; }

.planung-info {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 10px 2px;
  font-size: 12px;
  color: var(--text-secondary);
  border-bottom: 1px dashed var(--border);
  margin-bottom: 10px;
}

.sudo-locked-placeholder {
  position: relative;
  min-height: 64px;
  border: 1px dashed var(--border);
  background: color-mix(in srgb, var(--surface) 88%, var(--text) 12%);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.sudo-locked-scrim {
  position: absolute;
  inset: 10px;
  display: grid;
  gap: 8px;
  filter: blur(4px);
  opacity: .55;
}

.sudo-locked-scrim span {
  display: block;
  height: 12px;
  max-width: 100%;
  background: var(--border);
}

.sudo-locked-scrim span:nth-child(1) { width: 72%; }
.sudo-locked-scrim span:nth-child(2) { width: 92%; }
.sudo-locked-scrim span:nth-child(3) { width: 58%; }

.sudo-locked-message {
  position: relative;
  z-index: 1;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.3;
}

.sudo-locked-message strong {
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
}

.support-editor {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
}
.support-editor-head {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.support-months-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.support-month-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  background: var(--warning-light);
  color: var(--warning);
  border: 1px solid var(--border);
  font-size: 11px;
}
.support-month-chip button {
  background: none;
  border: none;
  color: var(--warning);
  cursor: pointer;
  font-size: 11px;
  padding: 0;
}
.support-add { display: flex; gap: 6px; align-items: center; }
.support-add input { max-width: 180px; }

/* ============================================================
   Meetings split view
   ============================================================ */
.meetings-layout {
  display: grid;
