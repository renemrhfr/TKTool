function personDossierMonths(from, to) {
  const months = [];
  let cursor = from.slice(0, 7);
  const last = to.slice(0, 7);
  while (cursor <= last) {
    months.push(cursor);
    const [year, month] = cursor.split('-').map(Number);
    cursor = `${year + (month === 12 ? 1 : 0)}-${String(month === 12 ? 1 : month + 1).padStart(2, '0')}`;
  }
  return months;
}

function personDossierItemDate(item) {
  return item.date || (item.month ? `${item.month}-01` : '');
}

function dossierItemLine(item) {
  const date = personDossierItemDate(item);
  const check = item.status === 'done' ? 'x' : ' ';
  let line = `- [${check}] ${date ? formatDate(date) : 'ohne Datum'} · ${item.text}`;
  if (item.type !== 'todo') line += ` · ${itemTypeLabel(item.type)}`;
  if (item.status !== 'done') line += ` · ${itemTypeLabel(item.status)}`;
  line += '\n';
  if (item.notes) line += `  > ${item.notes.replace(/\n/g, '\n  > ')}\n`;
  return line;
}

function exportPersonDossier(id) {
  const p = data.persons.find(person => person.id === id);
  if (!p) return;

  const from = document.getElementById('personDossierFrom')?.value || '';
  const to = document.getElementById('personDossierTo')?.value || '';
  if (!from || !to) {
    toast('Zeitraum vollständig angeben');
    return;
  }
  if (from > to) {
    toast('„Von“ muss vor „Bis“ liegen');
    return;
  }

  const inRange = date => !!date && date >= from && date <= to;
  const items = data.items
    .filter(item => item.personId === id && !isPersonalWin(item) && inRange(personDossierItemDate(item)))
    .sort((a, b) => personDossierItemDate(b).localeCompare(personDossierItemDate(a)));
  const growth = items.filter(isGrowthEntry);
  const doneItems = items.filter(item => !isGrowthEntry(item) && item.status === 'done');
  const openItems = items.filter(item => !isGrowthEntry(item) && item.status !== 'done');
  const meetings = data.meetings
    .filter(meeting => meeting.type === 'oneOnOne' && meeting.personId === id && inRange(meeting.date))
    .sort((a, b) => b.date.localeCompare(a.date));
  const blocks = data.blocks
    .filter(block => block.personId === id && block.start && block.end && block.end >= from && block.start <= to)
    .sort((a, b) => b.start.localeCompare(a.start));

  const coveredMonths = new Set();
  items.forEach(item => coveredMonths.add(personDossierItemDate(item).slice(0, 7)));
  meetings.forEach(meeting => coveredMonths.add(meeting.date.slice(0, 7)));
  blocks.forEach(block => {
    personDossierMonths(
      block.start < from ? from : block.start,
      block.end > to ? to : block.end
    ).forEach(month => coveredMonths.add(month));
  });
  const missingMonths = personDossierMonths(from, to).filter(month => !coveredMonths.has(month));

  let md = `# Personen-Dossier: ${p.name}\n\n`;
  md += `**Zeitraum:** ${formatDate(from)} bis ${formatDate(to)}  \n`;
  md += `**Erstellt am:** ${formatDate(todayStr())}\n\n`;

  md += `## Überblick\n\n`;
  md += `- ${growth.length} Highlights / Concerns\n`;
  md += `- ${doneItems.length} erledigte Items\n`;
  md += `- ${openItems.length} offene Items\n`;
  md += `- ${meetings.length} 1:1-Gespräche\n`;
  md += `- ${blocks.length} Planungsblöcke\n`;
  md += `- ${missingMonths.length} Monate ohne personenbezogene Einträge\n\n`;
  if (missingMonths.length) {
    md += `**Keine Einträge in:** ${missingMonths.map(formatMonthName).join(', ')}\n\n`;
  }

  if (p.pushDirection || p.notes) {
    md += `## Profil-Kontext\n\n`;
    if (p.pushDirection) md += `**Push-Richtung:** ${p.pushDirection}\n\n`;
    if (p.notes) md += `**Notizen:**\n\n${p.notes}\n\n`;
  }

  md += `## Highlights & Concerns (${growth.length})\n\n`;
  if (growth.length) {
    growth.forEach(item => {
      md += `- ${formatDate(personDossierItemDate(item))} · **${itemTypeLabel(item.type)}:** ${item.text}\n`;
    });
  } else {
    md += `_Keine Einträge im gewählten Zeitraum._\n`;
  }
  md += '\n';

  md += `## Erledigte Items (${doneItems.length})\n\n`;
  md += doneItems.length ? doneItems.map(dossierItemLine).join('') : `_Keine Einträge im gewählten Zeitraum._\n`;
  md += '\n';

  md += `## Offene Items (${openItems.length})\n\n`;
  md += openItems.length ? openItems.map(dossierItemLine).join('') : `_Keine Einträge im gewählten Zeitraum._\n`;
  md += '\n';

  md += `## 1:1-Gespräche (${meetings.length})\n\n`;
  if (meetings.length) {
    meetings.forEach(meeting => {
      md += `### ${formatDate(meeting.date)}\n\n`;
      if (meeting.prep) md += `**Vorbereitung**\n\n${meeting.prep}\n\n`;
      if (meeting.notes) md += `**Mitschrift**\n\n${meeting.notes}\n\n`;
      if (!meeting.prep && !meeting.notes) md += `_Keine Notizen._\n\n`;
    });
  } else {
    md += `_Keine Gespräche im gewählten Zeitraum._\n\n`;
  }

  md += exportPersonBlocks(id, from, to, blocks);

  const slug = p.name.toLowerCase().trim().replace(/[^a-z0-9äöüß]+/gi, '-').replace(/^-|-$/g, '');
  closeOverlay();
  downloadFile(`${slug}-dossier-${from}-${to}.md`, md);
  toast('Personen-Dossier exportiert');
}

function exportMeeting(id) {
  const m = data.meetings.find(m => m.id === id);
  if (!m) return;

  let title = m.type === 'oneOnOne' ? '1:1' : (m.title || 'Meeting');
  if (m.personId) title += ' mit ' + personName(m.personId);

  let md = `# ${title} — ${m.date ? formatDate(m.date) : 'ohne Datum'}\n\n`;
  md += `## Vorbereitung\n${m.prep || '—'}\n\n`;
  md += `## Mitschrift\n${m.notes || '—'}\n`;

  const slugTitle = (m.title || m.type).toLowerCase().replace(/\s+/g, '-');
  const slug = `${slugTitle}-${m.date || 'ohne-datum'}${m.personId ? '-' + personName(m.personId).toLowerCase().replace(/\s+/g, '-') : ''}`;
  downloadFile(`${slug}.md`, md);
}

function exportWins() {

let cleanupDialogState = null;

const CLEANUP_MONTH_CHOICES = [0, 1, 2, 3, 4, 6, 9, 12, 18, 24, 36];

function openCleanupDialog() {
  if (typeof closeThemeMenu === 'function') closeThemeMenu();
  cleanupDialogState = { months: cleanupMonthsMap(), running: false };
  renderCleanupDialog();
  openOverlay();
}

function setCleanupGroupMonths(id, months) {
  if (!cleanupDialogState) return;
  cleanupDialogState.months[id] = Math.max(0, parseInt(months, 10) || 0);
  renderCleanupDialog();
}

function monthsLabel(months) {
  if (!months) return 'nie';
  if (months === 12) return '1 jahr';
  if (months === 24) return '2 jahre';
  if (months === 36) return '3 jahre';
  return `${months} mon`;
}

function relativeDaysLabel(iso) {
  if (!iso) return 'nie';
  const days = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  if (!Number.isFinite(days)) return 'unbekannt';
  if (days <= 0) return 'heute';
  return days === 1 ? 'gestern' : `vor ${days} tagen`;
}

// Zeigt, warum die Löschmarker noch da sind: entweder wartet ein Gerät auf
// seine Bestätigung, oder es ist alles bestätigt und sie fallen mit.
function renderCleanupGraveSection(staleGraves) {
  const graves = countGraves();
  if (!graves) return '';
  const pending = devicesPendingAck();
  const others = activeDevices().filter(d => d.id !== getDeviceId());
  if (staleGraves >= graves && !pending.length) {
    return `
      <div class="cleanup-row cleanup-row-fixed">
        <span class="cleanup-row-fixed-mark" aria-hidden="true">&#x2713;</span>
        <span class="cleanup-row-label">löschmarker</span>
        <span class="cleanup-row-hint">von allen geräten bestätigt, fallen mit</span>
        <span class="cleanup-row-count">${staleGraves}</span>
      </div>
    `;
  }
  return `
    <div class="cleanup-row cleanup-row-fixed">
      <span class="cleanup-row-fixed-mark" aria-hidden="true">&#8987;</span>
      <span class="cleanup-row-label">löschmarker</span>
      <span class="cleanup-row-hint">${pending.length
        ? `warten auf ${pending.map(d => esc(d.label || d.id.slice(0, 4))).join(', ')}`
        : `warten auf die frist (${GRAVE_GRACE_DAYS} tage)`}</span>
      <span class="cleanup-row-count">${staleGraves}/${graves}</span>
    </div>
    ${pending.length ? `
      <div class="cleanup-devices">
        TKTool dort einmal öffnen, dann verschwinden die Marker automatisch.
        ${others.map(d => `<span class="cleanup-device">${esc(d.label || d.id.slice(0, 4))} · ${relativeDaysLabel(d.lastSeenAt)}</span>`).join('')}
      </div>
    ` : ''}
  `;
}

function renderCleanupDialog() {
  if (!cleanupDialogState) return;
  const { months, running } = cleanupDialogState;
  const picked = cleanupCandidates(months);
  const total = Object.values(picked).reduce((sum, list) => sum + list.length, 0);
  const staleGraves = countStaleGraves();
  const lastCleanup = backupSetting()?.lastCleanupAt;

  const rows = CLEANUP_GROUPS.map(group => {
    const groupMonths = months[group.id] || 0;
    const count = (picked[group.id] || []).length;
    // Wieviel läge bei der großzügigsten Einstellung an? Zeigt, ob eine
    // strengere Aufbewahrung überhaupt etwas brächte.
    const possible = cleanupCandidates({ [group.id]: 36 })[group.id].length;
    return `
      <div class="cleanup-row ${groupMonths ? '' : 'cleanup-row-off'}">
        <span class="cleanup-row-label">${esc(group.label)}</span>
        <span class="cleanup-row-hint">${esc(group.hint)}</span>
        <select class="cleanup-row-select" onchange="setCleanupGroupMonths('${group.id}', this.value)">
          ${CLEANUP_MONTH_CHOICES.map(m => `
            <option value="${m}" ${m === groupMonths ? 'selected' : ''}>${monthsLabel(m)}</option>
          `).join('')}
        </select>
        <span class="cleanup-row-count" title="${possible} älter als 3 jahre">${count}</span>
      </div>
    `;
  }).join('') + renderCleanupGraveSection(staleGraves);

  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">Cleanup</span>
      <button class="modal-close" onclick="closeOverlay()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">aufbewahren</label>
        <div class="cleanup-groups">${rows}</div>
        <div class="form-hint">
          Alles Ältere wird gelöscht. Notizen, Personen und Monatsreviews bleiben immer.
        </div>
      </div>
      <div class="cleanup-summary">
        <strong>${total}</strong> einträge weniger in suche, listen und exporten
        ${lastCleanup ? `<span class="cleanup-summary-last">letztes cleanup: ${relativeDaysLabel(lastCleanup)}</span>` : ''}
      </div>
      <div class="form-hint">
        Backup nach <code>${BACKUP_DIRNAME}/</code> läuft vorher automatisch.
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn btn-danger" style="flex:1;min-width:160px"
          ${(total || staleGraves) && !running ? '' : 'disabled'}
          onclick="confirmCleanup()">${running ? 'läuft...' : `Backup + ${total} löschen`}</button>
        <button class="btn btn-secondary" onclick="closeOverlay()">Abbrechen</button>
      </div>
    </div>
  `;
}

async function confirmCleanup() {
  if (!cleanupDialogState || cleanupDialogState.running) return;
  const months = cleanupDialogState.months;
  const picked = cleanupCandidates(months);
  const lines = CLEANUP_GROUPS
    .filter(g => (picked[g.id] || []).length)
    .map(g => `• ${picked[g.id].length} ${g.label} (älter als ${monthsLabel(months[g.id])})`);
  if (lines.length && !confirm(`Endgültig löschen?\n\n${lines.join('\n')}\n\nEin Backup wird vorher angelegt.`)) return;
  cleanupDialogState.running = true;
  renderCleanupDialog();
  try {
    const result = await runCleanup(months);
    closeOverlay();
    cleanupDialogState = null;
    toast(`${result.removed} Einträge gelöscht — Backup: ${result.backup.path}`, 6000);
    render();
  } catch (error) {
    console.error('Cleanup failed:', error);
    cleanupDialogState.running = false;
    renderCleanupDialog();
    reportUiError('Cleanup fehlgeschlagen – es wurde nichts gelöscht', error);
  }
}

function importBackup() {
  if (typeof closeThemeMenu === 'function') closeThemeMenu();
  document.getElementById('importInput').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.items || imported.persons || imported.meetings) {
        if (confirm('Aktuelle Daten mit Backup ersetzen?')) {
          data = { ...defaultData(), ...imported };
          saveData(data);
          toast('Daten importiert');
          render();
        }
      } else {
        alert('Ungültiges Backup-Format');
      }
    } catch { alert('Fehler beim Lesen der Datei'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============================================================
// OVERLAY / TOAST HELPERS
// ============================================================
function openOverlay() {
  document.getElementById('overlay').classList.add('open');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal').className = 'modal';
}

let toastTimer = null;
function toast(msg, duration = 2000, kind = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('toast-error', kind === 'error');
  t.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

function downloadFile(name, content) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function normalizeExternalUrl(url) {
  const value = (url || '').trim();
  if (!value) return '';
  if (/^https?:\/\//i.test(value)) return value;
  return `https://${value}`;
}

function memberLinkIcon(kind) {
  if (kind === 'jira') {
    return `
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 2.5h8v11H4z"></path>

        <path d="M6 8h4"></path>
        <path d="M6 11h4"></path>
        <path d="M4 2.5l2 2"></path>
      </svg>
    `;
  }
  return `
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M6 4L2.5 8 6 12"></path>
      <path d="M10 4l3.5 4-3.5 4"></path>
      <path d="M8.5 3 7 13"></path>
    </svg>
  `;
}

function renderMemberLink(url, kind, label, options = {}) {
  const href = normalizeExternalUrl(url);
  if (!href) return '';
  const { text = '', withText = false } = options;
  return `
    <a
      class="member-link member-link-${kind} ${withText ? 'member-link-with-text' : ''}"
      href="${esc(href)}"
      target="_blank"
      rel="noopener noreferrer"
      title="${esc(label)}"
      aria-label="${esc(label)}"
      onclick="event.stopPropagation()"
    >
      ${memberLinkIcon(kind)}
      ${withText ? `<span>${esc(text)}</span>` : ''}
    </a>
  `;
}

function renderMemberLinkBar(person) {
  const jira = renderMemberLink(person.jiraUrl, 'jira', `${person.name}: Jira Dashboard öffnen`, { withText: true, text: 'Jira' });
  const gitlab = renderMemberLink(person.gitlabMrUrl, 'gitlab', `${person.name}: GitLab Merge Requests öffnen`, { withText: true, text: 'GitLab' });
  if (!jira && !gitlab) return '';
  return `<div class="member-link-bar">${jira}${gitlab}</div>`;
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

<script data-source="./js/planung.js">
// ============================================================
// PLANUNG / BLOCKS / TIMELINE
// ============================================================

const BLOCK_TYPES = [
  { val: 'ticket', label: 'Ticket' },
  { val: 'projekt', label: 'Projekt' },
  { val: 'incident', label: 'Incident' },
  { val: 'abwesenheit', label: 'Abwesenheit' },
];
const MARKER_COLORS = [
  '#ef4444', // red
  '#3b82f6', // blue
  '#10b981', // green
];
// --- Date helpers ---
function parseISO(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function daysBetween(a, b) {
  const ms = parseISO(b) - parseISO(a);
  return Math.round(ms / 86400000) + 1;
}
function isWeekendDate(d) {
  const w = d.getDay();
  return w === 0 || w === 6;
}
function workdaysBetween(startISO, endISO) {
  if (!startISO || !endISO || endISO < startISO) return 0;
  let n = 0;
  let d = parseISO(startISO);
  const end = parseISO(endISO);
  while (d <= end) {
    if (!isWeekendDate(d)) n++;
    d = addDays(d, 1);
  }
  return n;
}
function monthOfDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthStart(m) {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo - 1, 1);
}
function monthEnd(m) {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo, 0);
}
function startOfWeek(d) {
  const r = new Date(d);
  const w = r.getDay();
  const diff = (w + 6) % 7;
  r.setDate(r.getDate() - diff);
  return r;
}
function endOfWeek(d) {
  return addDays(startOfWeek(d), 6);
}
function formatMonthName(m) {
  const months = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const [y, mo] = m.split('-');
  return months[parseInt(mo) - 1] + ' ' + y;
}

// --- Block status helpers ---
// "Geparkt": Block ohne Datum — schon angelegt, aber noch keiner Woche zugeordnet.
function isBlockParked(b) {
  return !b.start || !b.end;
}
// Abwesenheiten sind mit Ablauf einfach vorbei, die muss niemand "erledigen".
function blockNeedsDone(b) {
  return b.typ !== 'abwesenheit';
}
function isBlockOverdue(b) {
  return !isBlockParked(b) && blockNeedsDone(b) && !b.done && b.end < todayStr();
}

// --- Overlapping block workdays within [winStart, winEnd] ---
function blockWorkdaysInWindow(b, winStart, winEnd) {
  if (isBlockParked(b)) return 0;
  if (b.end < winStart || b.start > winEnd) return 0;
  const s = b.start > winStart ? b.start : winStart;
  const e = b.end < winEnd ? b.end : winEnd;
  return workdaysBetween(s, e);
}

function allocatedWorkdaysInWindow(blocks, winStart, winEnd) {
  const days = new Set();
  blocks.forEach(b => {
    if (isBlockParked(b)) return;
    if (b.end < winStart || b.start > winEnd) return;
    let d = parseISO(b.start > winStart ? b.start : winStart);
    const end = parseISO(b.end < winEnd ? b.end : winEnd);
    while (d <= end) {
      if (!isWeekendDate(d)) days.add(toISO(d));
      d = addDays(d, 1);
    }
  });
  return days.size;
}

function personSupportInMonth(p, month) {
  return (p.supportMonate || []).includes(month);
}

function personSupportInWindow(p, startISO, endISO) {
  if (!p.supportMonate || p.supportMonate.length === 0) return false;
  const months = new Set();
  let d = parseISO(startISO);
  const end = parseISO(endISO);
  while (d <= end) {
    months.add(monthOfDate(d));
    d = addDays(d, 1);
  }
  return p.supportMonate.some(m => months.has(m));
}

// Woran sitzt jemand heute? Abwesenheiten bleiben aussen vor, die sind ein
// eigener Zustand. Sortiert nach Ende: was zuerst faellig wird, steht vorne.
function personActiveBlocks(personId, date = todayStr()) {
  return (data.blocks || [])
    .filter(b => b.personId === personId
      && b.typ !== 'abwesenheit'
      && !b.done
      && !isBlockParked(b)
      && b.start <= date
      && b.end >= date)
    .sort((a, b) => a.end.localeCompare(b.end));
}

function personCurrentBlock(personId, date = todayStr()) {
  return personActiveBlocks(personId, date)[0] || null;
}

// Abgelaufen, aber nie auf "erledigt" gesetzt. Faellt sonst aus jeder
// Ansicht heraus, weil das Ende in der Vergangenheit liegt — genau deshalb
// ist es das ehrlichste "hier stimmt was nicht"-Signal.
function personOverdueBlocks(personId) {
  return (data.blocks || [])
    .filter(b => b.personId === personId && isBlockOverdue(b))
    .sort((a, b) => a.end.localeCompare(b.end));
}

// Was danach ansteht, bis zum Ende des gewaehlten Fensters.
function personUpcomingBlocks(personId, date = todayStr(), until = null) {
  return (data.blocks || [])
    .filter(b => b.personId === personId
      && b.typ !== 'abwesenheit'
      && !b.done
      && !isBlockParked(b)
      && b.start > date
      && (!until || b.start <= until))
    .sort((a, b) => a.start.localeCompare(b.start));
}

// --- Capacity for a person in a window ---
function personCapacity(personId, winStart, winEnd) {
  const werktage = workdaysBetween(winStart, winEnd);
  const blocks = data.blocks.filter(b => b.personId === personId);
  const allokiert = allocatedWorkdaysInWindow(blocks, winStart, winEnd);
  return { werktage, allokiert, frei: werktage - allokiert };
}

// ============================================================
// TIMELINE RENDERER
// ============================================================
// ============================================================
// JIRA-HIERARCHIE IN DER TIMELINE
// ============================================================
// Entwickler legen sich unter ihrem Auftragsticket Subtasks an und jedes davon
// wird ein eigener Block — bei fuenf Subtasks ist die Zeile fuenf Lanes hoch,
// obwohl es *eine* Sache ist. Zusammengefasst wird rein strukturell: ein Block
// haengt unter einem anderen, wenn sein Ticket laut Jira unter dessen Ticket
// haengt *und* beide Bloecke derselben Person gehoeren. Ein Parent, auf den
// kein Block dieser Person zeigt — allen voran das Sammel-Epic
// "Tagesgeschaeft" — bildet keine Gruppe: die Themen darunter haben nichts
// miteinander zu tun. Bewusst ohne Sonderfall auf Ticket-Typ oder Key.
const expandedBlockGroups = new Set();

function blockGroupKey(personId, ref) {
  return personId + ':' + String(ref || '').toUpperCase();
}

function toggleBlockGroup(personId, ref) {
  const key = blockGroupKey(personId, ref);
  if (expandedBlockGroups.has(key)) expandedBlockGroups.delete(key);
  else expandedBlockGroups.add(key);
  render();
}

// Nimmt die gelayouteten Block-Eintraege einer Person und liefert die Einheiten,
// die tatsaechlich gezeichnet werden: einzelne Bloecke, zugeklappte Gruppen
// (ein Balken ueber die gesamte Spanne) oder aufgeklappte Gruppen (Kopf plus
// Kinder als eigene Bloecke).
function groupPersonBlocks(entries, personId) {
  const refOf = e => String((e.b && e.b.jiraRef) || '').trim().toUpperCase();
  const byRef = new Map();
  for (const e of entries) {
    const ref = refOf(e);
    if (ref && !byRef.has(ref)) byRef.set(ref, e);
  }

  // Bis zum obersten Ticket hochlaufen, auf das diese Person auch einen Block
  // hat. Damit faellt Epic > Auftrag > Subtask auf eine Ebene zusammen, statt
  // verschachtelte Balken zu erzeugen. Der Zaehler kappt Ringe.
  const rootRefOf = ref => {
    let cur = ref;
    for (let i = 0; i < 10; i++) {
      const parentRef = jiraParentKeyForRef(cur);
      if (!parentRef || parentRef === cur || !byRef.has(parentRef)) return cur;
      cur = parentRef;
    }
    return cur;
  };

  const buckets = new Map();
  const loose = [];
  for (const e of entries) {
    const ref = refOf(e);
    // Zwei Bloecke auf dasselbe Ticket: nur der erste traegt die Gruppe.
    if (!ref || byRef.get(ref) !== e) { loose.push(e); continue; }
    const root = rootRefOf(ref);
    if (!buckets.has(root)) buckets.set(root, []);
    buckets.get(root).push(e);
  }

  const units = loose.map(e => ({ ...e }));
  for (const [root, members] of buckets) {
    const head = members.find(e => refOf(e) === root);
    if (!head || members.length < 2) { units.push(...members.map(e => ({ ...e }))); continue; }
    const children = members.filter(e => e !== head);
    const group = { ref: root, count: children.length, members };
    // Wird ein Block angesprungen (Suche, Dashboard), muss seine Gruppe auf —
    // sonst haengt highlightPlanungBlock an einem Element, das es nicht gibt.
    const holdsHighlight = viewState.planungHighlightBlockId
      && members.some(e => e.b.id === viewState.planungHighlightBlockId);
    if (holdsHighlight || expandedBlockGroups.has(blockGroupKey(personId, root))) {
      // Aufgeklappt bleibt die Gruppe *eine* Einheit fuer den Lane-Packer —
      // sonst fuellt der die Luecken zwischen den Subtasks mit fremden Bloecken
      // auf und unter dem Auftrag steht dann alles Moegliche.
      units.push({
        ...head,
        sIdx: Math.min(...members.map(e => e.sIdx)),
        eIdx: Math.max(...members.map(e => e.eIdx)),
        groupOpen: group,
        head,
        children,
      });
    } else {
      units.push({
        ...head,
        sIdx: Math.min(...members.map(e => e.sIdx)),
        eIdx: Math.max(...members.map(e => e.eIdx)),
        group,
      });
    }
  }
  return units;
}

// Ein Kopfblock deckt in der Timeline die Spanne seiner Kinder mit ab — das war
// bisher reine Darstellung. Die gespeicherten Daten blieben kurz, und sobald das
// echte Ende durch war, galt der Auftrag als ueberfaellig, obwohl darunter noch
// gearbeitet wird (und wanderte in die Jira-Drift). Deshalb ziehen wir hier die
// Daten selbst nach: dieselbe Rechnung wie im Renderer, Kopf eingeschlossen —
// die Spanne waechst also nur, ein zurueckgezogenes Kind schrumpft den Auftrag
// nicht wieder. Liefert die Zahl der geaenderten Bloecke.
function syncParentBlockSpans(blocks) {
  const refOf = b => String((b && b.jiraRef) || '').trim().toUpperCase();
  const byPerson = new Map();
  for (const b of blocks || []) {
    // Ohne Ticket keine Hierarchie, ohne Datum keine Spanne: geparkte Bloecke
    // bleiben geparkt, auch als Kopf.
    if (!b.personId || !refOf(b) || isBlockParked(b)) continue;
    if (!byPerson.has(b.personId)) byPerson.set(b.personId, []);
    byPerson.get(b.personId).push(b);
  }

  let changed = 0;
  for (const personBlocks of byPerson.values()) {
    const byRef = new Map();
    for (const b of personBlocks) if (!byRef.has(refOf(b))) byRef.set(refOf(b), b);

    // Identisch zu groupPersonBlocks: bis zum obersten Ticket hoch, auf das
    // diese Person auch einen Block hat. Der Zaehler kappt Ringe.
    const rootRefOf = ref => {
      let cur = ref;
      for (let i = 0; i < 10; i++) {
        const parentRef = jiraParentKeyForRef(cur);
        if (!parentRef || parentRef === cur || !byRef.has(parentRef)) return cur;
        cur = parentRef;
      }
      return cur;
    };

    const buckets = new Map();
    for (const b of personBlocks) {
      const ref = refOf(b);
      if (byRef.get(ref) !== b) continue; // zweiter Block auf dasselbe Ticket
      const root = rootRefOf(ref);
      if (!buckets.has(root)) buckets.set(root, []);
      buckets.get(root).push(b);
    }

    for (const [root, members] of buckets) {
      if (members.length < 2) continue;
      const head = members.find(b => refOf(b) === root);
      if (!head) continue;
      const start = members.reduce((min, b) => (b.start < min ? b.start : min), head.start);
      const end = members.reduce((max, b) => (b.end > max ? b.end : max), head.end);
      if (head.start === start && head.end === end) continue;
      head.start = start;
      head.end = end;
      changed++;
    }
  }
  return changed;
}

// Haengt an dieser Einheit nur noch Wartendes? Dieselbe Rechnung wie die
// Handover-Markierung am Balken: alles Offene muss woanders liegen, sonst
// beschaeftigt die Einheit die Person weiterhin.
function isWaitingUnit(unit) {
  const entries = unit.group ? unit.group.members
    : unit.groupOpen ? [unit.head, ...unit.children]
    : [unit];
  const open = entries.map(e => e.b).filter(m => !m.done);
  if (!open.length) return false;
  return open.every(m => {
    const s = m.jiraRef ? jiraStatusForBlock(m) : null;
    return !!(s && isJiraHandoverStatus(s.status));
  });
}

function renderTimeline({ personIds, startDate, endDate, options = {} }) {
  const {
    weekendsOnly = false,
    showWeekends = true,
    dense = false,
    compact = false,
    idPrefix = 'tl',
    supportAnchorMonth = null,
    insertLane = false,
    showCapacity = true,
    blockQuery = '',
  } = options;
  const start = parseISO(startDate);
  const end = parseISO(endDate);
  const totalDays = daysBetween(startDate, endDate);

  // Build day array
  const markerByDate = {};
  (data.markers || []).forEach(m => { markerByDate[m.date] = m; });

  const days = [];
  for (let i = 0; i < totalDays; i++) {
    const d = addDays(start, i);
    const iso = toISO(d);
    const weekend = isWeekendDate(d);
    if (!showWeekends && weekend) continue;
    days.push({ iso, date: d, weekend, marker: markerByDate[iso] || null, idx: days.length });
  }
  const cols = days.length;
  const todayISO = todayStr();
  const todayIdx = days.findIndex(d => d.iso === todayISO);

  // Header: months row + days row
  let monthsRow = '';
  let curMonth = null;
  let spanStart = 0;
  days.forEach((d, i) => {
    const m = monthOfDate(d.date);
    if (m !== curMonth) {
      if (curMonth !== null) {
        monthsRow += `<div class="tl-month-cell" style="grid-column:${spanStart + 1} / ${i + 1}">${formatMonthName(curMonth)}</div>`;
      }
      curMonth = m;
      spanStart = i;
    }
  });
  if (curMonth !== null) {
    monthsRow += `<div class="tl-month-cell" style="grid-column:${spanStart + 1} / ${cols + 1}">${formatMonthName(curMonth)}</div>`;
  }

  const daysRow = days.map((d, i) => {
    const dow = d.date.getDay();
    const weekday = formatWeekdayShort(d.iso);
    const label = String(d.date.getDate());
    const classes = ['tl-day-cell'];
    if (d.weekend) classes.push('tl-weekend');
    if (d.iso === todayISO) classes.push('tl-today');
    if (dow === 1 && i > 0) classes.push('tl-week-start');
    if (d.marker) classes.push('tl-marker-day');
    const style = d.marker ? ` style="background:${d.marker.color}33;box-shadow:inset 0 -2px 0 ${d.marker.color}"` : '';
    return `<div class="${classes.join(' ')}"${style}><span class="tl-day-dow">${esc(weekday)}</span><span class="tl-day-num">${label}</span></div>`;
  }).join('');

  const laneSize = dense ? 22 : 28;
  const laneGap = 4;
  const trackPadding = 4;
  const minLanes = 2;
  // Ab so vielen Lanes wird eine Personenzeile zu hoch fuer den Ueberblick —
  // dann fallen wir aufs dichte Packen zurueck.
  const MAX_STACKED_LANES = 8;

  const rowsHtml = personIds.map(pid => {
    const person = data.persons.find(p => p.id === pid);
    if (!person) return '';
    const hasSupInWindow = personSupportInWindow(person, startDate, endDate);
    const isSupport = supportAnchorMonth
      ? personSupportInMonth(person, supportAnchorMonth)
      : hasSupInWindow;
    const showSupBadge = supportAnchorMonth ? isSupport : hasSupInWindow;
    const cap = personCapacity(pid, startDate, endDate);

    // Track cells (weekends + support/markers). Today is shown by the header column and needle.
    const cellsHtml = days.map((d, i) => {
      const classes = ['tl-cell'];
      if (d.weekend) classes.push('tl-weekend');
      if (d.date.getDay() === 1 && i > 0) classes.push('tl-week-start');
      // determine support month cell
      if (personSupportInMonth(person, monthOfDate(d.date))) classes.push('tl-support-cell');
      if (d.marker) classes.push('tl-marker-cell');
      const style = d.marker ? ` style="background:${d.marker.color}26"` : '';
      return `<div class="${classes.join(' ')}"${style} data-day-idx="${i}" data-day-iso="${d.iso}"></div>`;
    }).join('');

    // Blocks
    const personBlocks = data.blocks
      .filter(b => b.personId === pid && !isBlockParked(b) && b.end >= startDate && b.start <= endDate && blockMatchesPlanungQuery(b, blockQuery))
      .map(b => {
        const sISO = b.start < startDate ? startDate : b.start;
        const eISO = b.end > endDate ? endDate : b.end;
        let sIdx = days.findIndex(d => d.iso === sISO);
        let eIdx = days.findIndex(d => d.iso === eISO);
        // Start/Ende fällt auf einen ausgeblendeten Tag (Wochenende):
        // auf den nächsten bzw. vorherigen sichtbaren Tag snappen.
        if (sIdx < 0) sIdx = days.findIndex(d => d.iso > sISO);
        if (eIdx < 0) {
          for (let i = days.length - 1; i >= 0; i--) {
            if (days[i].iso < eISO) { eIdx = i; break; }
          }
        }
        if (sIdx < 0 || eIdx < 0 || eIdx < sIdx) return null; // liegt komplett auf ausgeblendeten Tagen
        return { b, sIdx, eIdx };
      })
      .filter(Boolean)
      .sort((a, b) => (a.sIdx - b.sIdx) || ((b.eIdx - b.sIdx) - (a.eIdx - a.sIdx)));

    const jiraDrift = jiraDriftForPerson(person);
    const staleBlockIds = jiraDrift ? new Set(jiraDrift.stale.map(sb => sb.id)) : new Set();

    const units = groupPersonBlocks(personBlocks, pid)
      .sort((a, b) => (a.sIdx - b.sIdx) || ((b.eIdx - b.sIdx) - (a.eIdx - a.sIdx)));

    // Lane-Vergabe in drei festen Baendern: oben die Tickets mit Subtasks,
    // darunter die einzelnen Bloecke, ganz unten das nur noch Wartende. Kein
    // Band rutscht in eine Luecke des Bandes darueber.
    const laneEnds = [];
    let laneFloor = 0;
    const laneFree = (lane, sIdx) => laneEnds[lane] === undefined || sIdx > laneEnds[lane];
    const firstFreeLane = (sIdx, span) => {
      for (let lane = laneFloor; ; lane++) {
        let ok = true;
        for (let i = 0; i < span; i++) if (!laneFree(lane + i, sIdx)) { ok = false; break; }
        if (ok) return lane;
      }
    };
    // Innerhalb einer aufgeklappten Gruppe: Auftrag oben, Subtasks darunter so
    // dicht wie es ihre Zeiten zulassen.
    const innerLayoutOf = entry => {
      const inner = [];
      const innerEnds = [];
      // Der Auftrag selbst spannt immer ueber alle seine Subtasks — aufgeklappt
      // wie zugeklappt dieselbe Dauer.
      const head = { ...entry.head, sIdx: entry.sIdx, eIdx: entry.eIdx, isHead: true };
      for (const member of [head, ...entry.children]) {
        let lane = innerEnds.findIndex(end => member.sIdx > end);
        if (lane < 0) { lane = innerEnds.length; innerEnds.push(member.eIdx); }
        else innerEnds[lane] = member.eIdx;
        inner.push({ member, lane });
      }
      return { inner, laneCount: innerEnds.length };
    };
    const laneSpanOf = u => (u.groupOpen ? innerLayoutOf(u).laneCount : 1);

    const laidOutBlocks = [];
    const placeUnit = entry => {
      if (!entry.groupOpen) {
        const lane = firstFreeLane(entry.sIdx, 1);
        laneEnds[lane] = entry.eIdx;
        laidOutBlocks.push({ ...entry, lane });
        return;
      }
      // Eine aufgeklappte Gruppe braucht *zusammenhaengende* Lanes ueber ihre
      // gesamte Spanne — nur so stehen Auftrag und Subtasks als Block
      // untereinander und nicht mit Fremdem dazwischen.
      const { inner, laneCount: innerLanes } = innerLayoutOf(entry);
      const base = firstFreeLane(entry.sIdx, innerLanes);
      for (let i = 0; i < innerLanes; i++) laneEnds[base + i] = entry.eIdx;
      laidOutBlocks.push({
        ...entry, lane: base, bandLanes: innerLanes, isBand: true,
      });
      for (const { member, lane } of inner) {
        laidOutBlocks.push({
          ...member,
          lane: base + lane,
          groupOpen: member.isHead ? entry.groupOpen : undefined,
          groupChild: member.isHead ? undefined : entry.groupOpen.ref,
        });
      }
    };

    const isParentUnit = u => !!(u.group || u.groupOpen);
    const waitingUnits = units.filter(isWaitingUnit);
    const activeUnits = units.filter(u => !isWaitingUnit(u));
    const tiers = [
      activeUnits.filter(isParentUnit),
      activeUnits.filter(u => !isParentUnit(u)),
      waitingUnits,
    ];

    // Normalfall: jede Einheit bekommt ihre eigene Zeile, auch wenn daneben
    // Platz waere — das ist ruhiger zu lesen als greedy gepacktes Gedraenge.
    // Erst wenn die Zeile dadurch zu hoch wuerde, wird wieder dicht gepackt.
    const stackedLanes = units.reduce((sum, u) => sum + laneSpanOf(u), 0);
    const stackEachUnit = stackedLanes <= MAX_STACKED_LANES;

    for (const tier of tiers) {
      if (!tier.length) continue;
      laneFloor = laneEnds.length;
      for (const unit of tier) {
        if (stackEachUnit) laneFloor = laneEnds.length;
        placeUnit(unit);
      }
    }

    const occupiedLaneCount = laneEnds.length;
    const laneCount = insertLane
      ? Math.max(minLanes, occupiedLaneCount + 1)
      : Math.max(minLanes, occupiedLaneCount);
    const trackHeight = laneCount * laneSize + Math.max(0, laneCount - 1) * laneGap + trackPadding * 2;
    const trackMetrics = `data-cols="${cols}" style="--tl-track-height:${trackHeight}px;--tl-lane-size:${laneSize}px;--tl-lane-gap:${laneGap}px"`;

    const blocksHtml = laidOutBlocks.map(unit => {
      const { b, sIdx, eIdx, lane } = unit;
      // Hinterlegte Flaeche der aufgeklappten Gruppe — macht sichtbar, was
      // zusammengehoert, ohne den Bloecken selbst Farbe wegzunehmen.
      if (unit.isBand) {
        const height = unit.bandLanes * laneSize + (unit.bandLanes - 1) * laneGap;
        return `<div class="tl-group-band"
          style="left:${(sIdx / cols) * 100}%;width:${((eIdx - sIdx + 1) / cols) * 100}%;top:${trackPadding + lane * (laneSize + laneGap)}px;height:${height}px"></div>`;
      }
      // Ein zugeklappter Sammelbalken traegt die Zustaende aller Mitglieder,
      // ein normaler Block nur seinen eigenen — dieselbe Rechnung, andere Menge.
      const members = unit.group ? unit.group.members.map(e => e.b) : [b];
      const openMembers = members.filter(m => !m.done);
      const allDone = openMembers.length === 0;
      const isSingleDay = sIdx === eIdx;
      const classes = ['tl-block', `tl-block-${b.typ}`];
      if (viewState.planungHighlightBlockId === b.id) classes.push('tl-block-highlight');
      if (isSingleDay) classes.push('tl-block-single');
      if (allDone) classes.push('tl-block-done');
      else if (openMembers.some(isBlockOverdue)) classes.push('tl-block-overdue');
      if (members.some(m => staleBlockIds.has(m.id))) classes.push('tl-block-jira-stale');
      if (unit.group) classes.push('tl-block-group');
      if (unit.groupChild) classes.push('tl-block-group-child');
      const stateOf = m => (m.jiraRef && !m.done ? jiraStatusForBlock(m) : null);
      const jiraState = stateOf(b);
      // Beim Sammelbalken nur markieren, wenn *alles* Offene woanders liegt —
      // sonst behauptet der Balken, die Person sei frei, obwohl sie es nicht ist.
      const handoverOn = openMembers.length > 0 && openMembers.every(m => {
        const s = stateOf(m);
        return s && isJiraHandoverStatus(s.status);
      });
      const handover = handoverOn ? ((stateOf(openMembers[0]) || {}).status || '') : '';
      if (handover) classes.push('tl-block-handover-on');
      // Immer anzeigen, wenn Jira einen Parent kennt — auch wenn er keiner
      // Gruppe entspricht. Titel nur, wenn der Snapshot ihn kennt.
      const parentRef = b.jiraRef ? jiraParentKeyForRef(b.jiraRef) : '';
      const parentSummary = parentRef ? jiraSummaryForKey(parentRef) : '';
      const parentLabel = parentRef ? parentRef + (parentSummary ? ' — ' + parentSummary : '') : '';
      const title = [
        b.label || '(ohne Label)',
        `${formatDate(b.start)}–${formatDate(b.end)}`,
        allDone ? 'erledigt' : (openMembers.some(isBlockOverdue) ? 'überfällig — noch nicht erledigt' : ''),
        b.jiraRef ? 'Jira: ' + b.jiraRef + (jiraUrl(b.jiraRef) ? ' (Cmd/Strg-Klick öffnet)' : '') : '',
        // Der Parent steht sonst nirgends: haengt er nicht bei derselben Person,
        // bildet er ja bewusst keine Gruppe — dann ist der Tooltip die einzige
        // Stelle, an der man das Sammel-Epic ueberhaupt sieht.
        parentLabel ? '↳ unter ' + parentLabel : '',
        // Status ist ein Standbild vom letzten Sync — das Alter gehoert dazu.
        jiraState && jiraState.status ? `Status: ${jiraState.status} (Stand: ${jiraSyncAgeLabel() || 'unbekannt'})` : '',
        handover ? '→ wartet woanders — Person ist hier faktisch frei, Puffer für Rückläufer lassen' : '',
        members.some(m => staleBlockIds.has(m.id)) ? '⚠ Jira-Ticket nicht mehr offen (erledigt oder umassigned)' : '',
        unit.group ? `\n${unit.group.count} untergeordnet — klicken zum Aufklappen:` : '',
        unit.group ? unit.group.members.filter(e => e.b !== b)
          .map(e => `· ${e.b.jiraRef ? e.b.jiraRef + ' ' : ''}${e.b.label || '(ohne Label)'}${e.b.done ? ' ✓' : ''}`)
          .join('\n') : '',
      ].filter(Boolean).join('\n');
      const leftPct = (sIdx / cols) * 100;
      const widthPct = ((eIdx - sIdx + 1) / cols) * 100;
      const topPx = trackPadding + lane * (laneSize + laneGap);
      const geometry = `style="left:${leftPct}%;width:${widthPct}%;top:${topPx}px;height:${laneSize}px"`;

      // Der Sammelbalken ist bewusst nicht ziehbar: ein Zug muesste alle
      // Bloecke darunter mitnehmen, und das ueberblickt niemand mehr. Klick
      // klappt auf, drinnen verschiebt man einzeln.
      if (unit.group) {
        return `<div class="${classes.join(' ')}" ${geometry}
          title="${esc(title)}"
          onclick="event.stopPropagation();toggleBlockGroup('${pid}','${esc(unit.group.ref)}')"
          onpointerdown="event.stopPropagation()">
          ${allDone ? '<span class="tl-block-check">&#x2713;</span>' : ''}<span class="tl-block-label">${esc(b.label || b.typ)}</span><span class="tl-block-group-count">+${unit.group.count}</span>
        </div>`;
      }

      const collapseBadge = unit.groupOpen
        ? `<span class="tl-block-group-count is-open" title="Gruppe zuklappen"
            onclick="event.stopPropagation();toggleBlockGroup('${pid}','${esc(unit.groupOpen.ref)}')"
            onpointerdown="event.stopPropagation()">&#8722;${unit.groupOpen.count}</span>`
        : '';
      return `<div class="${classes.join(' ')}" ${geometry}
        data-block-id="${b.id}"
        title="${esc(title)}"
        onclick="event.stopPropagation();if(_suppressNextBlockClick)return;if((event.metaKey||event.ctrlKey)&&openBlockJira('${b.id}'))return;openBlockForm('${b.id}')"
        onpointerdown="onBlockPointerDown(event,'${b.id}')">
        ${b.done ? '<span class="tl-block-check">&#x2713;</span>' : ''}${handover ? `<span class="tl-block-handover">${esc(handover.toLowerCase())}</span>` : ''}<span class="tl-block-label">${esc(b.label || b.typ)}</span>${collapseBadge}
      </div>`;
    }).join('');

    const insertLaneHtml = insertLane ? `
      <div class="tl-insert-lane"
        style="top:${trackPadding + (laneCount - 1) * (laneSize + laneGap)}px;height:${laneSize}px;grid-template-columns:repeat(${cols},minmax(0,1fr))">
        ${days.map(d => `
          <div class="tl-insert-cell">
            <button class="tl-insert-button"
              type="button"
              title="Block am ${formatDate(d.iso)} einfügen"
              onpointerdown="event.stopPropagation()"
              onclick="event.stopPropagation();openBlockForm(null,'${pid}','${d.iso}','${d.iso}')">
              +
            </button>
          </div>
        `).join('')}
      </div>
    ` : '';

    // Capacity label (inline in name column)
    let capInline;
    if (isSupport) {
      capInline = `<span class="tl-person-cap"><span class="tl-cap-support">SUP</span></span>`;
    } else if (!showCapacity) {
      capInline = '';
    } else {
      const freiCls = cap.frei < 0 ? 'tl-cap-neg' : '';
      capInline = `<span class="tl-person-cap" title="${cap.frei} frei von ${cap.werktage} WT"><span class="tl-cap-days ${freiCls}">${cap.frei}/${cap.werktage}</span><span>Frei</span></span>`;
    }

    const labelClick = `navigate('team:detail',{personId:'${pid}'})`;
    return `
      <div class="tl-row">
        <div class="tl-person" style="height:${trackHeight}px" onclick="${labelClick}">
          <div class="tl-person-main">
            <div class="tl-person-top">
              ${showSupBadge ? '<span class="tl-sup-badge" title="Support-Rotation">SUP</span>' : ''}
              <span class="tl-person-name">${esc(person.name)}</span>
              ${jiraDrift && jiraDrift.hasDrift ? `<button class="tl-jira-drift" type="button"
                onclick="event.preventDefault();event.stopPropagation();openJiraDriftMenu('${pid}')"
                title="${esc([
                  jiraDrift.unplanned.length ? `${jiraDrift.unplanned.length} Ticket${jiraDrift.unplanned.length === 1 ? '' : 's'} ohne Block: ${jiraDrift.unplanned.map(t => t.key).join(', ')}` : '',
                  jiraDrift.stale.length ? `${jiraDrift.stale.length} Block${jiraDrift.stale.length === 1 ? '' : 's'} veraltet: ${jiraDrift.stale.map(sb => sb.jiraRef).join(', ')}` : '',
                  jiraDrift.renamed.length ? `${jiraDrift.renamed.length} Titel geändert: ${jiraDrift.renamed.map(sb => sb.jiraRef).join(', ')}` : '',
                  jiraDrift.expired.length ? `${jiraDrift.expired.length} Block${jiraDrift.expired.length === 1 ? '' : 's'} abgelaufen, Ticket offen: ${jiraDrift.expired.map(sb => sb.jiraRef).join(', ')}` : '',
                  '— klicken zum Übernehmen',
                ].filter(Boolean).join('\n'))}">jira ±${jiraDrift.unplanned.length + jiraDrift.stale.length + jiraDrift.renamed.length + jiraDrift.expired.length}</button>` : ''}
            </div>
          </div>
          ${capInline}
        </div>
        <div class="tl-track-row" style="height:${trackHeight}px">
          <div class="tl-track"
            data-person-id="${pid}"
            ${trackMetrics}
            onpointerdown="onTrackPointerDown(event,'${pid}')">
            <div class="tl-track-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">
              ${cellsHtml}
            </div>
            <div class="tl-track-overlay">
              ${blocksHtml}
              ${insertLaneHtml}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Marker chips shown in header (single row across all people)
  const markerChips = (data.markers || [])
    .map(m => ({ m, idx: days.findIndex(d => d.iso === m.date) }))
    .filter(x => x.idx >= 0)
    .map(({ m, idx }) => {
      const leftPct = ((idx + 0.5) / cols) * 100;
      const title = `${m.label || ''} — ${m.date}`;
      const style = `left:${leftPct}%;border-color:${m.color};color:${m.color}`;
      return `<div class="tl-marker-chip" style="${style}" title="${esc(title)}" onclick="event.stopPropagation();openMarkerForm('${m.id}')"><span class="tl-marker-dot" style="background:${m.color}"></span><span class="tl-marker-label">${esc(m.label || '')}</span></div>`;
    }).join('');
  return `
    <div class="timeline ${dense ? 'timeline-dense' : ''} ${compact ? 'timeline-compact' : ''}" id="${idPrefix}-timeline" style="--tl-person-col:${compact ? 140 : 180}px">
      <div class="tl-header">
        <div class="tl-person-head"></div>
        <div class="tl-grid-head">
          <div class="tl-months-row" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${monthsRow}${markerChips}</div>
          <div class="tl-days-row" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${daysRow}</div>
        </div>
      </div>
      <div class="tl-body">
        ${todayIdx >= 0 ? `<div class="tl-body-today-line" style="--tl-today-frac:${((todayIdx + 0.5) / cols).toFixed(6)}"></div>` : ''}
        ${rowsHtml}
      </div>
    </div>
  `;
}

// ============================================================
// PLANUNG VIEW
// ============================================================
function planungExtraPastWeeks() {
  return Math.max(0, parseInt(viewState.planungExtraPastWeeks || 0, 10) || 0);
}

function planungExtraFutureWeeks() {
  return Math.max(0, parseInt(viewState.planungExtraFutureWeeks || 0, 10) || 0);
}

function planungShowWeekends() {
  try { return localStorage.getItem(PLANUNG_WEEKENDS_KEY) === '1'; } catch { return false; }
}

function togglePlanungWeekends() {
  try { localStorage.setItem(PLANUNG_WEEKENDS_KEY, planungShowWeekends() ? '0' : '1'); } catch {}
  render();
}

function planungWeekOffset() {
  return parseInt(viewState.planungWeekOffset || 0, 10) || 0;
}

function navigateToPlanungBlock(blockId) {
  const block = (data.blocks || []).find(candidate => candidate.id === blockId);
  if (!block || isBlockParked(block)) {
    navigate('planung');
    return;
  }

  const today = todayStr();
  const anchor = block.start > today ? block.start : block.end < today ? block.end : today;
  const currentWeek = startOfWeek(parseISO(today));
  const targetWeek = startOfWeek(parseISO(anchor));
  const weekOffset = Math.round((targetWeek - currentWeek) / (7 * 86400000));

  navigate('planung', {
    planungWeekOffset: weekOffset,
    planungHighlightBlockId: blockId,
  });
  setTimeout(() => highlightPlanungBlock(blockId), 0);
}

function highlightPlanungBlock(blockId) {
  const target = Array.from(document.querySelectorAll('#planung-timeline .tl-block'))
    .find(element => element.dataset.blockId === blockId);
  if (!target) return;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  target.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center', inline: 'nearest' });
  setTimeout(() => {
    target.classList.remove('tl-block-highlight');
    if (viewState.planungHighlightBlockId === blockId) delete viewState.planungHighlightBlockId;
  }, reducedMotion ? 1200 : 2200);
}

function planungWindow() {
  // Default window: current week, with optional extension controls
  const today = parseISO(todayStr());
  const baseStart = addDays(startOfWeek(today), planungWeekOffset() * 7);
  const start = addDays(baseStart, -7 * planungExtraPastWeeks());
  const end = addDays(baseStart, 6 + 7 * planungExtraFutureWeeks());
  return { start: toISO(start), end: toISO(end) };
}

function planungSupportMonth() {
  const { start, end } = planungWindow();
  const mid = addDays(parseISO(start), Math.floor(daysBetween(start, end) / 2));
  return monthOfDate(mid);
}

function planungAnchorMonth() {
  return planungSupportMonth();
}

function renderPlanung() {
  const { start, end } = planungWindow();
  const month = planungSupportMonth();
  const sort = viewState.planungSort || 'name';
  const rawQuery = viewState.planungQuery || '';
  const blockQuery = rawQuery.trim().toLocaleLowerCase('de-AT');
  const personFilter = planungPersonFilter();
  const queryBlocks = blockQuery ? data.blocks.filter(block => blockMatchesPlanungQuery(block, blockQuery)) : data.blocks;
  // Personenfilter zieht durch alle Panels — sonst zeigt die Zeile eine Person,
  // die Liste darunter aber weiter das ganze Team.
  const matchingBlocks = personFilter ? queryBlocks.filter(block => block.personId === personFilter) : queryBlocks;
  const matchingPersonIds = new Set(matchingBlocks.map(block => block.personId));

  // Auswahlliste bleibt vollstaendig, auch wenn gerade gefiltert wird.
  const filterablePersons = data.persons
    .filter(p => p.type !== 'kontakt')
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name, 'de-AT'));

  const team = data.persons.filter(p => p.type !== 'kontakt'
    && (!personFilter || p.id === personFilter)
    && (!blockQuery || matchingPersonIds.has(p.id) || personNameMatchesPlanungQuery(p.id, blockQuery)));
  const withCap = team.map(p => {
    const isSupport = personSupportInMonth(p, month);
    const cap = personCapacity(p.id, start, end);
    return { p, isSupport, cap };
  });

  let sorted;
  if (sort === 'name') {
    sorted = withCap.slice().sort((a, b) => a.p.name.localeCompare(b.p.name, 'de-AT'));
  } else {
    const nonSup = withCap.filter(x => !x.isSupport).sort((a, b) => b.cap.frei - a.cap.frei);
    const sup = withCap.filter(x => x.isSupport).sort((a, b) => a.p.name.localeCompare(b.p.name, 'de-AT'));
    sorted = [...nonSup, ...sup];
  }

  let personIds = sorted.map(x => x.p.id);
  // Freeze order during block drag to avoid jumping rows
  if (_tlDrag && _tlFrozenOrder) {
    const knownSet = new Set(_tlFrozenOrder);
    const extras = personIds.filter(id => !knownSet.has(id));
    personIds = _tlFrozenOrder.filter(id => personIds.includes(id)).concat(extras);
  }

  const personName = pid => {
    const p = data.persons.find(x => x.id === pid);
    return p ? p.name : '(unbekannt)';
  };

  const overdue = matchingBlocks.filter(isBlockOverdue).sort((a, b) => a.end.localeCompare(b.end));
  const overdueChip = overdue.length ? `
    <button class="filter-btn planung-overdue-btn ${viewState.planungShowOverdue ? 'active' : ''}"
      onclick="togglePlanungOverdue()"
      title="Abgelaufene Blöcke, die noch nicht erledigt sind">${overdue.length} offen</button>
  ` : '';
  // Bottleneck-Blick: alles, was gerade bei QA/Review haengt — quer ueber das
  // Team, weil sich genau da der Stau zeigt, den die Einzelansicht verbirgt.
  // Nur wenn explizit auf eine Person gefiltert wird, zieht das auch hier durch.
  const waiting = jiraHandoverBlocks(personFilter || null).sort((a, b) => (a.end || '').localeCompare(b.end || ''));
  const waitingByStatus = {};
  for (const b of waiting) {
    const st = (jiraStatusForBlock(b) || {}).status || '';
    (waitingByStatus[st] = waitingByStatus[st] || []).push(b);
  }
  const handoverChip = waiting.length ? `
    <button class="filter-btn planung-handover-btn ${viewState.planungShowHandover ? 'active' : ''}"
      onclick="togglePlanungHandover()"
      title="${esc(['Blöcke, deren Ticket nicht mehr beim Entwickler liegt:',
        ...Object.keys(waitingByStatus).sort().map(st => `${st.toLowerCase()}: ${waitingByStatus[st].length}`),
        `Stand: ${jiraSyncAgeLabel() || 'unbekannt'}`].join('\n'))}">${waiting.length} wartet</button>
  ` : '';
  const handoverPanel = (waiting.length && viewState.planungShowHandover) ? `
    <div class="planung-overdue-panel">
      ${waiting.map(b => {
        const st = (jiraStatusForBlock(b) || {}).status || '';
        return `
        <div class="planung-overdue-row">
          <span class="planung-overdue-info" onclick="openBlockForm('${b.id}')" title="Block öffnen">
            <span class="planung-overdue-person">${esc(personName(b.personId))}</span>
            <span class="planung-overdue-label">${esc(b.label || b.typ)}</span>
            <span class="jira-status-chip jira-status-handover">${esc(st.toLowerCase())}</span>
          </span>
        </div>`;
      }).join('')}
    </div>
  ` : '';
  const overduePanel = (overdue.length && viewState.planungShowOverdue) ? `
    <div class="planung-overdue-panel">
      ${overdue.map(b => `
        <div class="planung-overdue-row">
          <span class="planung-overdue-info" onclick="openBlockForm('${b.id}')" title="Block öffnen">
            <span class="planung-overdue-person">${esc(personName(b.personId))}</span>
            <span class="planung-overdue-label">${esc(b.label || b.typ)}</span>
            <span class="planung-overdue-date">bis ${formatDate(b.end)}</span>
          </span>
          <span class="planung-overdue-actions">
            <button class="btn btn-sm btn-secondary" onclick="extendBlockToThisWeek('${b.id}')" title="Ende auf Freitag dieser Woche setzen">+1 woche</button>
            <button class="btn btn-sm btn-secondary" onclick="markBlockDone('${b.id}')" title="Als erledigt markieren">&#x2713; done</button>
          </span>
        </div>
      `).join('')}
    </div>
  ` : '';

  const parked = matchingBlocks.filter(isBlockParked);
  const parkedRow = parked.length ? `
    <div class="planung-parked">
      <span class="planung-parked-head">geparkt</span>
      ${parked.map(b => `
        <button class="planung-parked-chip" onclick="openBlockForm('${b.id}')" title="Klicken zum Einplanen">
          <span class="planung-parked-person">${esc(personName(b.personId))}</span>${esc(b.label || b.typ)}
        </button>
      `).join('')}
    </div>
  ` : '';
  const searchResults = blockQuery ? `
    <div class="planung-search-results">
      <div class="planung-search-results-head">${matchingBlocks.length} treffer</div>
      ${matchingBlocks.length ? matchingBlocks
        .slice()
        .sort((a, b) => (a.start || '9999').localeCompare(b.start || '9999'))
        .map(block => `
          <button class="planung-search-result" onclick="openBlockForm('${block.id}')">
            <span class="tl-block-swatch tl-block-${block.typ}"></span>
            <strong>${esc(block.label || block.typ)}</strong>
            <span>${esc(personName(block.personId))}</span>
            <span>${isBlockParked(block) ? 'geparkt' : `${formatDate(block.start)} – ${formatDate(block.end)}`}</span>
            ${block.jiraRef ? `<span>${esc(block.jiraRef)}</span>` : ''}
          </button>
        `).join('')
        : '<span class="planung-search-results-empty">Keine Blöcke entsprechen der Suche.</span>'}
    </div>
  ` : '';

  return `
    <div class="section-header">
      <div class="overview-toolbar">
        <div class="overview-toolbar-main planung-toolbar-main">
          <div class="month-selector">
            <button onclick="changePlanungWeek(-1)">&#8592;</button>
            <button class="btn btn-sm btn-secondary" onclick="extendPlanungPastWeek()" title="Eine Vorwoche mehr anzeigen">+</button>
            <span class="month-label">${formatDate(start)} – ${formatDate(end)}</span>
            <button class="btn btn-sm btn-secondary" onclick="extendPlanungFutureWeek()" title="Eine Folgewoche mehr anzeigen">+</button>
            <button onclick="changePlanungWeek(1)">&#8594;</button>
            ${(planungWeekOffset() || planungExtraPastWeeks() || planungExtraFutureWeeks()) ? `<button class="btn btn-sm btn-secondary" onclick="resetPlanungWindow()" style="margin-left:8px">Reset</button>` : ''}
          </div>
          <div class="planung-sort">
            <button class="filter-btn ${sort === 'frei' ? 'active' : ''}" onclick="setPlanungSort('frei')">frei</button>
            <button class="filter-btn ${sort === 'name' ? 'active' : ''}" onclick="setPlanungSort('name')">name</button>
            <button class="filter-btn ${planungShowWeekends() ? 'active' : ''}" onclick="togglePlanungWeekends()" title="Samstag/Sonntag ein-/ausblenden">sa/so</button>
            ${overdueChip}
            ${handoverChip}
            <select class="filter-btn planung-person-filter ${personFilter ? 'active' : ''}"
              title="Nur einen Mitarbeiter anzeigen"
              onchange="setPlanungPerson(this.value)">
              <option value=""${personFilter ? '' : ' selected'}>alle mitarbeiter</option>
              ${filterablePersons.map(p => `<option value="${esc(p.id)}"${personFilter === p.id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}
            </select>
          </div>
          <div class="view-search planung-search">
            <input id="planungSearchInput" type="search"
              placeholder="grep: mitarbeiter, label, jira-ref, notiz..."

          </div>
          <div class="overview-actions planung-actions">
            <button class="jira-sync-stamp jira-sync-stamp-toolbar" type="button" onclick="openJiraImport()" title="Jira-Abfrage öffnen und Antwort einspielen">jira ${jiraSyncAgeLabel() || 'nie'} &#8635;</button>
            <button class="btn btn-primary btn-sm" onclick="openBlockForm(null)">+ Block</button>

    </div>

    ${handoverPanel}

    ${personIds.length ? renderTimeline({ personIds, startDate: start, endDate: end, options: { idPrefix: 'planung', supportAnchorMonth: month, insertLane: true, showCapacity: sort === 'frei', showWeekends: planungShowWeekends(), blockQuery } })
      : `<div class="empty-state"><div class="empty-state-icon">&#128269;</div><div class="empty-state-text">${blockQuery ? 'Keine passenden Blöcke' : 'Keine Teammitglieder'}</div></div>`}

    <div class="tl-legend">
      ${BLOCK_TYPES.map(t => `<span class="tl-legend-item"><span class="tl-block-swatch tl-block-${t.val}"></span>${t.label}</span>`).join('')}
      <span class="tl-legend-item"><span class="tl-legend-today"></span>Heute</span>
      <span class="tl-legend-item"><span class="tl-sup-badge">SUP</span>Support-Rotation</span>
      <span class="tl-legend-item"><span class="tl-block-swatch tl-block-swatch-overdue"></span>überfällig</span>

// Der grep trifft auch Mitarbeiternamen: dann zaehlen alle Bloecke dieser
// Person mit. Ab 2 Zeichen, damit ein einzelner Buchstabe nicht das halbe
// Team einsammelt und den grep wirkungslos macht.
function personNameMatchesPlanungQuery(personId, query) {
  if (!query || query.length < 2) return false;
  const person = data.persons.find(p => p.id === personId);
  return !!person && person.type !== 'kontakt'
    && person.name.toLocaleLowerCase('de-AT').includes(query);
}

function blockMatchesPlanungQuery(block, query) {
  if (!query) return true;
  if (personNameMatchesPlanungQuery(block.personId, query)) return true;
  return [block.label, block.jiraRef, block.notiz]
    .filter(Boolean)
    .some(value => String(value).toLocaleLowerCase('de-AT').includes(query));
}

function setPlanungQuery(value) {
  const input = document.getElementById('planungSearchInput');
  pendingPlanungSearchSelection = input
    ? { start: input.selectionStart, end: input.selectionEnd }
    : { start: value.length, end: value.length };
  viewState.planungQuery = value;
  render();
}

function restorePlanungSearchFocus() {
  if (!pendingPlanungSearchSelection) return;
  const input = document.getElementById('planungSearchInput');
  if (!input) { pendingPlanungSearchSelection = null; return; }
  const selection = pendingPlanungSearchSelection;
  pendingPlanungSearchSelection = null;
  input.focus();
  input.setSelectionRange(selection.start, selection.end);
}

function extendPlanungPastWeek() {
  viewState.planungExtraPastWeeks = planungExtraPastWeeks() + 1;
  render();
}

function extendPlanungFutureWeek() {
  viewState.planungExtraFutureWeeks = planungExtraFutureWeeks() + 1;
  render();
}

function changePlanungWeek(dir) {
  viewState.planungWeekOffset = planungWeekOffset() + (dir < 0 ? -1 : 1);
  render();
}

function resetPlanungWindow() {
  viewState.planungWeekOffset = 0;
  viewState.planungExtraPastWeeks = 0;
  viewState.planungExtraFutureWeeks = 0;
  render();
}

// Leerer String = ganzes Team. Verweist der Filter auf eine geloeschte Person,
// faellt er still auf "alle" zurueck.
function planungPersonFilter() {
  const id = viewState.planungPerson || '';
  if (!id) return '';
  return (data.persons || []).some(p => p.id === id && p.type !== 'kontakt') ? id : '';
}

function setPlanungPerson(id) {
  viewState.planungPerson = id || '';
  render();
}

function setPlanungSort(sort) {
  viewState.planungSort = sort;
  render();
}

function togglePlanungOverdue() {
  viewState.planungShowOverdue = !viewState.planungShowOverdue;
  render();
}

function togglePlanungHandover() {
  viewState.planungShowHandover = !viewState.planungShowHandover;
  render();
}

function extendBlockToThisWeek(id) {
  const b = data.blocks.find(x => x.id === id);
  if (!b || isBlockParked(b)) return;
  const friday = toISO(addDays(startOfWeek(parseISO(todayStr())), 4));
  b.end = friday > todayStr() ? friday : todayStr();
  saveData(data);
  toast('Block bis ' + formatDate(b.end) + ' verlängert');
  render();
}

function markBlockDone(id) {
  const b = data.blocks.find(x => x.id === id);
  if (!b) return;
  b.done = true;
  saveData(data);
  toast('Block erledigt');
  render();
}

// ============================================================
// PERSON PLANUNG (timeline + support editor on detail page)
// ============================================================
function renderPersonPlanungCard(person) {
  const today = new Date();
  const todayISO = todayStr();
  const months = parseInt(viewState.personTimelineMonths || 1, 10);
  const startISO = todayISO;
  const end = new Date(today);
  end.setMonth(end.getMonth() + months);
  const endISO = toISO(end);

  const curMonth = currentMonth();
  const sup = (person.supportMonate || []).slice().sort();
  const isSupThis = sup.includes(curMonth);
  const past = sup.filter(m => m <= curMonth);
  const future = sup.filter(m => m > curMonth);
  const last = past.length ? past[past.length - 1] : null;
  const next = future.length ? future[0] : null;

  const pBlocks = data.blocks.filter(b => b.personId === person.id && blockNeedsDone(b));
  const openBlocks = pBlocks.filter(b => !isBlockParked(b) && !b.done).sort((a, b) => a.start.localeCompare(b.start));
  const parkedList = pBlocks.filter(isBlockParked);
  const allDone = pBlocks.filter(b => !isBlockParked(b) && b.done).sort((a, b) => b.start.localeCompare(a.start));
  // Erledigtes ist Archiv, nicht Arbeitsvorrat: eingeklappt, bis jemand fragt.
  const showDone = !!viewState.personBlocksShowDone;
  const doneBlocks = showDone ? allDone : [];
  const blockRow = (b) => `
    <div class="person-block-row ${b.done ? 'person-block-done' : ''}" onclick="openBlockForm('${b.id}')">
      <span class="tl-block-swatch tl-block-${b.typ}"></span>
      <span class="person-block-label">${esc(b.label || b.typ)}</span>
      <span class="person-block-range">${isBlockParked(b) ? 'geparkt' : formatDate(b.start) + '–' + formatDate(b.end)}</span>
      ${isBlockOverdue(b) ? '<span class="person-block-overdue">überfällig</span>' : ''}
      ${(() => {
        if (b.done || !b.jiraRef) return '';
        const state = jiraStatusForBlock(b);
        return state && isJiraHandoverStatus(state.status)
          ? `<span class="jira-status-chip jira-status-handover" title="Wartet woanders (Stand: ${esc(jiraSyncAgeLabel() || 'unbekannt')})">${esc(state.status.toLowerCase())}</span>`
          : '';
      })()}
      ${b.done
        ? '<span class="person-block-checked">&#x2713;</span>'
        : `<button class="person-block-check" onclick="event.stopPropagation();markBlockDone('${b.id}')" title="Als erledigt markieren">&#x2713;</button>`}
    </div>`;
  const blocksSection = (openBlocks.length || parkedList.length || allDone.length) ? `
    <div class="person-blocks">
      <div class="person-blocks-head">Blöcke</div>
      ${openBlocks.map(blockRow).join('')}
      ${parkedList.map(blockRow).join('')}
      ${allDone.length ? `
        <button class="person-blocks-sub person-blocks-toggle" type="button"
          onclick="togglePersonBlocksShowDone()"
          title="${showDone ? 'Erledigte ausblenden' : 'Erledigte anzeigen'}">
          <span class="person-blocks-toggle-icon">${showDone ? '&minus;' : '+'}</span>
          erledigt &middot; ${allDone.length}
        </button>
        ${doneBlocks.map(blockRow).join('')}` : ''}
    </div>
  ` : '';

  return `
    <div class="card">
      <div class="card-header">
        <span class="card-title">Planung</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-secondary" onclick="changePersonTimelineMonths(1)">+ Monat</button>
          <button class="btn btn-sm btn-primary" onclick="openBlockForm(null,'${person.id}')">+ Block</button>
        </div>
      </div>

      <div class="planung-info">
        <div><strong>Support-Rotation diesen Monat:</strong> ${isSupThis ? 'ja' : 'nein'}</div>
        <div><strong>Letzte:</strong> ${last ? formatMonthName(last) : '—'}</div>
        <div><strong>Nächste:</strong> ${next ? formatMonthName(next) : '—'}</div>
      </div>

      ${renderTimeline({ personIds: [person.id], startDate: startISO, endDate: endISO, options: { idPrefix: 'person', supportAnchorMonth: curMonth, showWeekends: planungShowWeekends() } })}

      ${blocksSection}

      <div class="support-editor">
        <div class="support-editor-head">Support-Rotation verwalten</div>
        <div class="support-months-list">
          ${sup.length ? sup.map(m => `
            <span class="support-month-chip">
              ${formatMonthName(m)}
              <button onclick="removeSupportMonth('${person.id}','${m}')" title="Entfernen">&#x2715;</button>
            </span>
          `).join('') : '<span style="color:var(--text-muted)">Keine Monate</span>'}
        </div>
        <div class="support-add">
          <input type="month" class="form-input" id="supportMonthInput-${person.id}" value="${curMonth}">
          <button class="btn btn-secondary btn-sm" onclick="addSupportMonthFromInput('${person.id}')">+ Monat</button>
        </div>
      </div>
    </div>
  `;
}

function togglePersonBlocksShowDone() {
  viewState.personBlocksShowDone = !viewState.personBlocksShowDone;
  render();
}

function changePersonTimelineMonths(delta) {
  const cur = parseInt(viewState.personTimelineMonths || 1, 10);
  viewState.personTimelineMonths = Math.max(1, cur + delta);
  render();
}

function addSupportMonthFromInput(personId) {
  const input = document.getElementById(`supportMonthInput-${personId}`);
  if (!input || !input.value) return;
  addSupportMonth(personId, input.value);
}

function addSupportMonth(personId, month) {
  const p = data.persons.find(p => p.id === personId);
  if (!p) return;
  if (!p.supportMonate) p.supportMonate = [];
  if (!p.supportMonate.includes(month)) {
    p.supportMonate.push(month);
    p.supportMonate.sort();
    saveData(data);
    render();
  }
}

function removeSupportMonth(personId, month) {
  const p = data.persons.find(p => p.id === personId);
  if (!p || !p.supportMonate) return;
  p.supportMonate = p.supportMonate.filter(m => m !== month);
  saveData(data);
  render();
}

// ============================================================
// MEETING DETAIL — embedded team status
// ============================================================
function renderMeetingTeamStatusForDate(dateISO, options = {}) {
  if (!dateISO) return '';
  const { inForm = false, personIds = null, heading = 'Team-Status', idPrefix = null } = options;
  const weekStart = startOfWeek(parseISO(dateISO));
  const start = toISO(weekStart);
  const end = toISO(addDays(weekStart, 4));

  let resolvedPersonIds = personIds;
  if (!resolvedPersonIds) {
    const team = data.persons
      .filter(p => p.type !== 'kontakt')
      .slice()
      .sort(comparePersonsByName);
    if (!team.length) return '';
    resolvedPersonIds = team.map(p => p.id);
  }
  resolvedPersonIds = resolvedPersonIds
    .slice()
    .sort((a, b) => comparePersonsByName(
      data.persons.find(person => person.id === a),
      data.persons.find(person => person.id === b),
    ));
  if (!resolvedPersonIds.length) return '';

  return `
    <div class="${inForm ? 'meeting-status-preview' : 'meeting-detail-section'}">
      <h3>${esc(heading)} — KW ${formatDateShort(start)}–${formatDateShort(end)}</h3>
      ${renderTimeline({ personIds: resolvedPersonIds, startDate: start, endDate: end, options: { showWeekends: false, dense: true, compact: inForm, idPrefix: idPrefix || (inForm ? 'meeting-preview' : 'meeting'), supportAnchorMonth: monthOfDate(parseISO(dateISO)), insertLane: true } })}
    </div>
  `;
}

function renderMeetingTeamStatus(m) {
  if (!m.date) return '';
  if (m.type === 'oneOnOne' && m.personId) {
    const person = data.persons.find(p => p.id === m.personId);
    return renderMeetingTeamStatusForDate(m.date, {
      personIds: [m.personId],
      heading: person ? person.name : '1:1-Status',
      idPrefix: `meeting-${m.id}`,
    });
  }
  if (!isTeamMeeting(m)) return '';
  return renderMeetingTeamStatusForDate(m.date, { idPrefix: `meeting-${m.id}` });
}

// ============================================================
// BLOCK CRUD
// ============================================================
function openBlockForm(blockId, prefillPersonId, prefillStart, prefillEnd) {
  const b = blockId ? data.blocks.find(x => x.id === blockId) : null;
  const personOpts = data.persons.filter(p => p.type !== 'kontakt')
    .map(p => `<option value="${p.id}" ${((b && b.personId === p.id) || prefillPersonId === p.id) ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

  const start = b ? (b.start || '') : (prefillStart || todayStr());
  const end = b ? (b.end || '') : (prefillEnd || todayStr());
  const typ = b ? b.typ : 'ticket';
  const parked = b ? isBlockParked(b) : false;
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">${b ? 'Block bearbeiten' : 'Neuer Block'}</span>
      <button class="modal-close" onclick="closeOverlay()">&#x2715;</button>
    </div>
    <div class="modal-body">

        <label class="form-label">Person</label>
