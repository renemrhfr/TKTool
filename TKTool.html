  if (!data.monthReviews) data.monthReviews = [];
  const existing = monthReview(month);
  const trimmed = summary.trim();
  if (!trimmed) {
    if (existing) data.monthReviews = data.monthReviews.filter(review => review.month !== month);
    return;
  }
  if (existing) {
    existing.summary = trimmed;
    existing.updatedAt = todayStr();
    return;
  }
  data.monthReviews.push({
    id: uid(),
    month,
    summary: trimmed,
    createdAt: todayStr(),
    updatedAt: todayStr(),
  });
}

function currentMonthTeamGrowthSummary(month) {
  const growth = monthItems(data.items.filter(isGrowthEntry), month);
  const byPerson = {};
  growth.forEach(item => {
    if (!item.personId) return;
    if (!byPerson[item.personId]) byPerson[item.personId] = { highlights: 0, concerns: 0 };
    if (item.type === 'highlight') byPerson[item.personId].highlights += 1;
    if (item.type === 'concern') byPerson[item.personId].concerns += 1;
  });
  return Object.entries(byPerson)
    .map(([personId, counts]) => ({ personId, ...counts }))
    .sort((a, b) => {
      const deltaA = a.highlights - a.concerns;
      const deltaB = b.highlights - b.concerns;
      if (deltaB !== deltaA) return deltaB - deltaA;
      return personName(a.personId).localeCompare(personName(b.personId), 'de-AT');
    });
}

function renderMonthReflectionCard(month, options = {}) {
  const { empty = false } = options;
  const review = monthReview(month);
  if (!review && !empty) return '';
  return `
    <div class="month-reflection-card card ${review ? 'has-review' : 'is-empty'}">
      <div class="month-reflection-header">
        <div>
          <div class="month-reflection-kicker">${formatMonth(month)} · meine monatsspur</div>
          <div class="month-reflection-title">Wie der Monat für mich war</div>
        </div>
        ${review ? '<span class="badge badge-focus">Monatsrückblick</span>' : ''}
      </div>
      <div class="month-reflection-body">
        ${review
          ? `<div class="month-reflection-text">${esc(review.summary).replace(/\n/g, '<br>')}</div>`
          : '<div class="month-reflection-empty">Dein Rückblick erscheint hier, sobald du den Monat abschliesst.</div>'}
      </div>
    </div>
  `;
}

function personGrowthSignal(personId, days = 30) {
  const start = dateShift(todayStr(), -(days - 1));
  const items = data.items
    .filter(item => item.personId === personId && isGrowthEntry(item) && item.date && item.date >= start)
    .sort(compareItemsByDateDesc);
  return {
    items,
    highlights: items.filter(item => item.type === 'highlight').length,
    concerns: items.filter(item => item.type === 'concern').length,
  };
}

function personInitials(person) {
  const parts = String(person?.name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return parts.slice(0, 2).map(part => part.charAt(0).toUpperCase()).join('');
}

function personAccentColor(person) {
  const palette = ['var(--blue)', 'var(--accent)', 'var(--success)', 'var(--warning)', 'var(--purple)', 'var(--danger)'];
  const source = String(person?.id || person?.name || 'x');
  let hash = 0;
  for (let i = 0; i < source.length; i += 1) hash = ((hash << 5) - hash) + source.charCodeAt(i);
  return palette[Math.abs(hash) % palette.length];
}

// `count` haengt eine kleine Zahl an den Kreis (im Teamfokus: die Punkte, die
// Handlungsbedarf haben). `countTone` faerbt sie nach Schwere, nicht nach
// Menge — Arbeitsmenge ist kein Signal, ein veralteter Block schon.
function personAvatar(person, size = 'md', options = {}) {
  if (!person) return '';
  const { absent = false, count = null, countTone = '', countTitle = '' } = options;
  const avatar = `
    <span class="person-avatar-badge person-avatar-${size} ${absent ? 'is-absent' : ''}" style="--person-accent:${personAccentColor(person)}" aria-hidden="true">
      ${esc(personInitials(person))}
    </span>
  `;
  if (count === null || count === '') return avatar;
  return `
    <span class="person-avatar-stack person-avatar-stack-${size}"${countTitle ? ` title="${esc(countTitle)}"` : ''}>
      ${avatar}
      <span class="person-avatar-count ${countTone ? `person-avatar-count-${countTone}` : ''}">${esc(String(count))}</span>
    </span>
  `;
}

function meetingParticipantIds(meeting) {
  if (!meeting) return [];
  const ids = [];
  if (meeting.personId) ids.push(meeting.personId);
  if (Array.isArray(meeting.participants)) ids.push(...meeting.participants);
  return [...new Set(ids.filter(Boolean))];
}

function isTeamMeeting(meeting) {
  if (!meeting || meeting.type === 'oneOnOne') return false;
  return meeting.isTeamMeeting === true;
}

function meetingParticipants(meeting) {
  return meetingParticipantIds(meeting)
    .map(id => data.persons.find(person => person.id === id))
    .filter(Boolean)
    .sort(comparePersonsByName);
}

function renderParticipantStack(meeting, limit = 4) {
  const participants = meetingParticipants(meeting);
  if (!participants.length) return '';
  const visible = participants.slice(0, limit).map(person => `
    <button class="participant-stack-avatar" onclick="event.stopPropagation();openPersonById('${person.id}')" title="${esc(person.name)}">
      ${personAvatar(person, 'sm')}
    </button>
  `).join('');
  const extra = participants.length > limit ? `<span class="participant-stack-more">+${participants.length - limit}</span>` : '';
  return `<div class="participant-stack">${visible}${extra}</div>`;
}

function personRoute(id) {
  const p = data.persons.find(person => person.id === id);
  if (!p) return null;
  return p.type === 'kontakt' ? 'kontakte:detail' : 'team:detail';
}

function openPersonById(id) {
  const route = personRoute(id);
  if (!route) return;
  navigate(route, { personId: id });
}

function openPersonTodos(personId) {
  const person = personById(personId);
  navigate('overview', {
    month: currentMonth(),
    overviewLayout: 'list',
    overviewQuery: person?.name || personName(personId),
  });
}

function meetingTitleText(meeting) {
  if (!meeting) return '';
  if (meeting.type === 'oneOnOne') return '1:1' + (meeting.personId ? ' mit ' + personName(meeting.personId) : '');
  return meeting.title || 'Meeting';
}

function meetingOptions(selectedId, options = {}) {
  const { includeEmpty = true, personId = null } = options;
  const meetings = data.meetings
    .filter(m => !personId || !m.personId || m.personId === personId)
    .slice()
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  let html = includeEmpty ? '<option value="">—</option>' : '';
  html += meetings.map(m => `
    <option value="${m.id}" ${selectedId === m.id ? 'selected' : ''}>${esc(meetingTitleText(m))}${m.date ? ' · ' + formatDate(m.date) : ''}</option>
  `).join('');
  return html;
}

function meetingItems(id) {
  return data.items
    .filter(item => item.meetingId === id)
    .sort((a, b) => compareByDueDate(a, b));
}

function previousOneOnOneMeeting(meeting) {
  if (!meeting || meeting.type !== 'oneOnOne' || !meeting.personId) return null;
  const referenceDate = meeting.date || todayStr();
  return data.meetings
    .filter(item =>
      item.type === 'oneOnOne' &&
      item.personId === meeting.personId &&
      item.id !== meeting.id &&
      item.date &&
      item.date < referenceDate
    )
    .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
}

function oneOnOneCarryover(meeting) {
  if (!meeting || meeting.type !== 'oneOnOne' || !meeting.personId) {
    return { openFollowUps: [], openTodos: [], recentSignals: [] };
  }
  const referenceDate = meeting.date || todayStr();
  const previousMeeting = previousOneOnOneMeeting(meeting);
  const personItems = data.items.filter(item => item.personId === meeting.personId);
  const openItems = personItems.filter(item => item.status !== 'done' && item.id && item.meetingId !== meeting.id);
  const openFollowUps = openItems
    .filter(item => item.meetingId)
    .sort(compareByDueDate);
  const openTodos = openItems
    .filter(item => !item.meetingId && item.type === 'todo')
    .sort(compareByDueDate);
  const recentSignals = personItems
    .filter(item =>
      isGrowthType(item.type) &&
      item.date &&
      item.date <= referenceDate &&
      (!previousMeeting || item.date > previousMeeting.date)
    )
    .sort(compareItemsByDateDesc)
    .slice(0, 6);
  return { openFollowUps, openTodos, recentSignals };
}

function carryoverCount(carryover) {
  return carryover.openFollowUps.length + carryover.openTodos.length + carryover.recentSignals.length;
}

function personActivitySummary(personId) {
  const month = currentMonth();
  const itemDates = data.items
    .filter(item => item.personId === personId && item.date)
    .map(item => item.date);
  const meetingDates = data.meetings
    .filter(meeting => meetingParticipantIds(meeting).includes(personId) && meeting.date)
    .map(meeting => meeting.date);
  const latestDate = itemDates.concat(meetingDates).sort((a, b) => b.localeCompare(a))[0] || '';
  const monthItems = data.items.filter(item => item.personId === personId && item.month === month);
  const monthMeetings = data.meetings.filter(meeting =>
    meetingParticipantIds(meeting).includes(personId) &&
    meeting.date &&
    meeting.date.slice(0, 7) === month
  );
  const monthSignals = monthItems.filter(isGrowthEntry);
  const parts = [
    monthItems.length ? `${monthItems.length} Items` : '',
    monthMeetings.length ? `${monthMeetings.length} Termine` : '',
    monthSignals.length ? `${monthSignals.length} Signale` : '',
  ].filter(Boolean);
  return {
    latestDate,
    label: latestDate ? formatDateShort(latestDate) : 'keine Aktivität',
    note: parts.length ? parts.join(' · ') : 'aktueller Monat leer',
  };
}

// --- Jira sync snapshot helpers ---
// Gematcht wird über die Jira Account-ID, nicht über die E-Mail: Jira Cloud
// akzeptiert in JQL keine Adressen mehr, und der Snapshot ist damit direkt
// nach accountId aufgeschlüsselt.
// null = kein Mapping möglich (kein Sync-File oder keine Account-ID am Profil),
// [] = Mapping vorhanden, aber keine Tickets assigned.
function jiraTicketsForPerson(person) {
  if (!jiraSyncData || !person || !person.jiraAccountId) return null;
  const assignees = jiraSyncData.assignees || {};
  const tickets = assignees[person.jiraAccountId.trim()];
  // Der Filter greift beim Lesen, nicht beim Import: so wirkt eine geaenderte
  // Status-Auswahl sofort, auch auf einen alten Snapshot.
  return Array.isArray(tickets) ? tickets.filter(t => !isJiraStatusExcluded(t.status)) : [];
}

// Alle Tickets aus dem Snapshot als flache Liste (key + summary), fuer die
// Vorschlagsliste im Block-Formular. Dedupliziert, weil ein Ticket sowohl in
// assignees als auch in refs stecken kann.
function jiraTicketPool() {
  if (!jiraSyncData) return [];
  const byKey = {};
  for (const list of Object.values(jiraSyncData.assignees || {})) {
    if (!Array.isArray(list)) continue;
    for (const t of list) {
      const key = String(t.key || '').trim().toUpperCase();
      if (key && !byKey[key]) byKey[key] = { key, summary: String(t.summary || '') };
    }
  }
  const refs = jiraSyncData.refs || {};
  for (const raw of Object.keys(refs)) {
    const key = raw.trim().toUpperCase();
    if (key && !byKey[key]) byKey[key] = { key, summary: String(refs[raw].summary || '') };
  }
  return Object.values(byKey).sort((a, b) => a.key.localeCompare(b.key));
}

// Titel eines Keys, egal aus welcher Ecke des Snapshots er kommt.
function jiraSummaryForKey(ref) {
  const key = String(ref || '').trim().toUpperCase();
  if (!key) return '';
  const hit = jiraTicketPool().find(t => t.key === key);
  return hit ? hit.summary : '';
}

// Die Abfrage, die der Browser für uns ausführt: alle offenen Tickets des
// Teams plus der Status jedes in der Planung referenzierten Keys. Beides in
// einem Request, damit es bei einem Copy-Paste bleibt.
function jiraQueryUrl() {
  const base = getJiraBaseUrl();
  if (!base) return '';
  const accountIds = data.persons
    .filter(p => p.type !== 'kontakt' && p.jiraAccountId)
    .map(p => p.jiraAccountId.trim())
    .filter((id, i, all) => all.indexOf(id) === i);
  const today = todayStr();
  const refKeys = (data.blocks || [])
    .filter(b => !b.done && b.jiraRef && (b.end || b.start || '') >= today)
    .map(b => b.jiraRef.trim().toUpperCase())
    .filter((key, i, all) => all.indexOf(key) === i);
  if (!accountIds.length && !refKeys.length) return '';

  const quoted = values => values.map(v => `"${v}"`).join(',');
  const excluded = jiraExcludedStatuses();
  let jql = '';
  if (accountIds.length) {
    jql = `assignee in (${quoted(accountIds)}) AND resolution = Unresolved`;
    // Ausgeschlossene Status gar nicht erst holen — sonst gehen sie vom
    // maxResults-Budget ab. Der refs-Teil unten bleibt bewusst ungefiltert,
    // dort brauchen wir den Status auch von erledigten Tickets.
    if (excluded.length) jql += ` AND status not in (${quoted(excluded)})`;
  }
  if (refKeys.length) {
    const byKey = `key in (${quoted(refKeys)})`;
    jql = jql ? `(${jql}) OR ${byKey}` : byKey;
  }
  jql += ' ORDER BY updated DESC';

  const params = new URLSearchParams({
    jql,
    fields: 'summary,status,priority,issuetype,updated,assignee,resolution,parent',
    maxResults: String(JIRA_QUERY_MAX_RESULTS),
  });
  return `${base}/rest/api/3/search/jql?${params}`;
}

// Drift zwischen Jira und Planung, über jiraRef-Key-Matching (nicht Anzahl):
// unplanned = assigned Tickets ohne laufenden/zukünftigen Block,
// stale = Blöcke, deren Ticket laut Sync erledigt oder umassigned ist.
// Blöcke ohne jiraRef bleiben bewusst außen vor.
function jiraDriftForPerson(person) {
  const tickets = jiraTicketsForPerson(person);
  if (tickets === null) return null;
  const today = todayStr();
  // Offen ist offen, egal ob das Enddatum schon durch ist. Sonst gilt ein
  // abgelaufener Block als "nicht verplant" und "+ block" legt denselben
  // Ticket-Block ein zweites Mal an — der Block gehoert verlaengert, nicht
  // dupliziert.
  const openBlocks = (data.blocks || []).filter(b =>
    b.personId === person.id && !b.done && b.jiraRef);
  const activeBlocks = openBlocks.filter(b => (b.end || b.start || '') >= today);
  const plannedKeys = new Set(openBlocks.map(b => b.jiraRef.trim().toUpperCase()));
  const openKeys = new Set(tickets.map(t => String(t.key || '').toUpperCase()));
  const unplanned = tickets.filter(t => !plannedKeys.has(String(t.key || '').toUpperCase()));
  // Ticket laeuft in Jira noch, der Block ist aber abgelaufen: eigene Sorte
  // Drift mit eigener Aktion (verlaengern) statt eines zweiten Blocks.
  const expired = openBlocks.filter(b =>
    (b.end || b.start || '') < today && openKeys.has(b.jiraRef.trim().toUpperCase()));
  const refs = (jiraSyncData && jiraSyncData.refs) || {};
  const refByKey = {};
  for (const k of Object.keys(refs)) refByKey[k.trim().toUpperCase()] = refs[k];
  const stale = activeBlocks.filter(b => {
    const key = b.jiraRef.trim().toUpperCase();
    if (openKeys.has(key)) return false;
    const ref = refByKey[key];
    if (!ref) return false; // unbekannter Key (Epic, fremdes Projekt) -> kein Urteil
    if (ref.statusCategory === 'done') return true;
    if (isJiraStatusExcluded(ref.status)) return true;
    return !!(ref.assignee && person.jiraAccountId
      && ref.assignee.trim() !== person.jiraAccountId.trim());
  });
  // Titel-Drift nur fuer Bloecke, deren Label aus Jira stammt und seither
  // nicht von Hand geaendert wurde (label === jiraSummary). Handgeschriebene
  // Labels sollen nicht dauerhaft als "veraltet" gemeldet werden.
  const staleIds = new Set(stale.map(b => b.id));
  const ticketByKey = {};
  for (const t of tickets) ticketByKey[String(t.key || '').toUpperCase()] = t;
  const renamed = activeBlocks.filter(b => {
    if (staleIds.has(b.id)) return false;
    if (!b.jiraSummary || b.label !== b.jiraSummary) return false;
    const current = jiraCurrentSummary(b.jiraRef, ticketByKey, refByKey);
    return !!current && current !== b.jiraSummary;
  });
  return {
    unplanned,
    stale,
    renamed,
    expired,
    hasDrift: unplanned.length > 0 || stale.length > 0 || renamed.length > 0 || expired.length > 0,
  };
}

// Aktueller Ticket-Titel aus dem Snapshot: erst die offene Ticketliste der
// Person, sonst der mitgelieferte Status geplanter Keys (refs).
function jiraCurrentSummary(ref, ticketByKey, refByKey) {
  const key = String(ref || '').trim().toUpperCase();
  if (!key) return '';
  const fromTicket = ticketByKey && ticketByKey[key];
  if (fromTicket && fromTicket.summary) return fromTicket.summary;
  const fromRef = refByKey && refByKey[key];
  return (fromRef && fromRef.summary) || '';
}

function jiraSyncAgeLabel() {
  if (!jiraSyncData || !jiraSyncData.generatedAt) return '';
  const ts = new Date(jiraSyncData.generatedAt).getTime();
  if (Number.isNaN(ts)) return '';
  const mins = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (mins < 60) return `vor ${mins} min`;
  const hours = Math.round(mins / 60);
  if (hours < 48) return `vor ${hours} h`;
  return `vor ${Math.round(hours / 24)} Tagen`;
}

function includesQuery(value, query) {
  return String(value || '').toLocaleLowerCase('de-AT').includes(query);
}

function itemMatchesQuery(item, query) {
  const linkedMeeting = item.meetingId ? data.meetings.find(m => m.id === item.meetingId) : null;
  return [
    item.text,
    item.notes,
    item.type,
    item.status,
    item.date,
    item.month,
    personName(item.personId),
    meetingTitleText(linkedMeeting),
  ].some(value => includesQuery(value, query));
}

function personMatchesQuery(person, query) {
  return [
    person.name,
    person.pushDirection,
    person.type === 'kontakt' ? '' : person.notes,
    person.jiraUrl,
    person.jiraAccountId,
    person.gitlabMrUrl,
  ].some(value => includesQuery(value, query));
}

function meetingMatchesQuery(meeting, query) {
  const linkedItems = data.items.filter(item => item.meetingId === meeting.id);
  return [
    meeting.title,
    meeting.prep,
    meeting.notes,
    meeting.date,
    personName(meeting.personId),
    ...meetingParticipants(meeting).map(person => person.name),
    ...linkedItems.flatMap(item => [item.text, item.notes, item.status, item.type]),
    meeting.type === 'oneOnOne' ? '1:1' : 'meeting',
    isTeamMeeting(meeting) ? 'team' : 'other',
  ].some(value => includesQuery(value, query));
}

function focusMatchesQuery(focus, query) {
  return [focus.title, focus.description, focus.month].some(value => includesQuery(value, query));
}

function prevMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  if (mo === 1) return (y - 1) + '-12';
  return y + '-' + String(mo - 1).padStart(2, '0');
}

function nextMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  if (mo === 12) return (y + 1) + '-01';
  return y + '-' + String(mo + 1).padStart(2, '0');
}

</script>
<script data-source="./js/nav.js">
// ============================================================
// ROUTER
// ============================================================
let currentView = 'reviews';
let viewState = {};
let pendingOverviewSearchSelection = null;
let pendingMeetingSearchSelection = null;
let pendingPlanungSearchSelection = null;
let pendingNotesSearchSelection = null;
let sudoMode = false;

function isSudoMode() {
  return sudoMode;
}

function toggleSudoMode() {
  sudoMode = !sudoMode;
  toast(`sudo ${sudoMode ? 'on' : 'off'}`);
  render();
}

function sudoLockedPlaceholder(label = 'Interner Bereich') {
  return `
    <div class="sudo-locked-placeholder" aria-label="${esc(label)} gesperrt">
      <div class="sudo-locked-scrim" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="sudo-locked-message">
        <strong>${esc(label)}</strong>
        <span>Sudo Mode mit Cmd/Ctrl+Shift+S aktivieren</span>
      </div>
    </div>
  `;
}

function navigate(view, state = {}) {
  const previousView = currentView;
  const preserveMeetingState = previousView.startsWith('meetings') && view.startsWith('meetings');
  currentView = view;
  viewState = preserveMeetingState
    ? {
        meetingQuery: viewState.meetingQuery,
        meetingFilter: viewState.meetingFilter,
        meetingRange: viewState.meetingRange,
        ...state,
      }
    : state;
  render();
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view.split(':')[0]);
  });
}

document.getElementById('nav').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') navigate(e.target.dataset.view);
});

// ============================================================
// RENDER
// ============================================================
function render() {
  const app = document.getElementById('app');
  app.dataset.view = currentView.split(':')[0];
  syncGlobalSearchInput();
  switch (currentView) {
    case 'overview': app.innerHTML = renderOverview(); break;
    case 'team': app.innerHTML = renderTeam(); break;
    case 'team:detail': app.innerHTML = renderTeam(); break;
    case 'kontakte': app.innerHTML = renderKontakte(); break;
    case 'kontakte:detail': app.innerHTML = renderKontaktDetail(); break;
    case 'meetings': app.innerHTML = renderMeetings(); setTimeout(initPrepBulletsAutoResize, 0); break;
    case 'meetings:detail': app.innerHTML = renderMeetings(); setTimeout(initPrepBulletsAutoResize, 0); break;
    case 'reviews': app.innerHTML = renderReviews(); break;
    case 'planung': app.innerHTML = renderPlanung(); break;
    case 'notizen': app.innerHTML = renderNotes(); setTimeout(initNotesView, 0); break;
    case 'search': app.innerHTML = renderSearch(); break;
    default: app.innerHTML = renderOverview();
  }
  restoreOverviewSearchFocus();
  restoreMeetingSearchFocus();
  restorePlanungSearchFocus();
  restoreNotesSearchFocus();
}

</script>
<script data-source="./js/todo.js">
// ============================================================
// OVERVIEW
// ============================================================
function renderOverview() {
  const month = viewState.month || currentMonth();
  const query = (viewState.overviewQuery || '').trim().toLocaleLowerCase('de-AT');
  const layout = overviewLayout();
  const review = monthReview(month);
  const pastOpenWarning = renderPastOpenItemsWarning();
  const items = data.items
    .filter(i => !isGrowthEntry(i))
    .filter(i => i.month === month)
    .filter(i => !query || itemMatchesQuery(i, query));

  const todos = items.filter(i => i.status === 'todo').sort(compareByDueDate);
  const backlog = items.filter(i => i.status === 'backlog').sort(compareByDueDate);
  const waiting = items
    .filter(i => i.status === 'waiting')
    .sort(compareByDueDate);
  const done = items.filter(i => i.status === 'done');

  return `
    <div class="section-header">
      <div class="overview-toolbar">
        <div class="overview-toolbar-main">
          <div class="overview-toolbar-start">
            <div class="month-selector">
              <button onclick="changeMonth(-1)">&#8592;</button>
              <span class="month-label">${formatMonth(month)}</span>
              <button onclick="changeMonth(1)">&#8594;</button>
            </div>
          </div>
          <div class="view-search overview-search-row">
            <input
              id="overviewSearchInput"
              type="search"
              placeholder="monat filtern..."
              value="${esc(viewState.overviewQuery || '')}"
              oninput="setOverviewQuery(this.value)"
            >
            <button
              class="btn btn-primary btn-sm overview-add-todo-btn"
              type="button"
              onclick="openCapture({ type: 'todo', status: 'todo', month: '${month}' })"
              title="Todo hinzufügen"
              aria-label="Todo hinzufügen"
            >+</button>
            ${query ? `<button class="btn btn-secondary btn-sm" onclick="clearOverviewQuery()">Reset</button>` : ''}
          </div>
          <div class="view-toggle overview-search-toggle" role="tablist" aria-label="Todo Ansicht">
            <button class="view-toggle-btn ${layout === 'board' ? 'active' : ''}" onclick="setOverviewLayout('board')" role="tab" aria-selected="${layout === 'board'}">board</button>
            <button class="view-toggle-btn ${layout === 'list' ? 'active' : ''}" onclick="setOverviewLayout('list')" role="tab" aria-selected="${layout === 'list'}">list</button>
          </div>
          <details class="overview-actions-menu">
            <summary>monat</summary>
            <div class="overview-actions-menu-panel">
              <button class="btn btn-secondary btn-sm" onclick="openMonthCarryover('${month}')">monat abschliessen</button>
              <button class="btn btn-secondary btn-sm" onclick="exportMonth('${month}')">export .md</button>
            </div>
          </details>
        </div>
        ${review ? `<div class="overview-toolbar-secondary">${renderMonthReflectionCard(month)}</div>` : ''}
        ${pastOpenWarning}
      </div>
    </div>

    ${layout === 'list'
      ? renderTaskTable(items)
      : `
        <div class="overview-board">
          ${renderItemSection('backlog', backlog, 'backlog')}
          ${renderItemSection('todo', todos, 'todo')}
          ${renderItemSection('warte auf...', waiting, 'waiting')}
          ${renderItemSection('erledigt', done, 'done')}
        </div>
      `}
  `;
}

function pastOpenItemsByMonth() {
  const current = currentMonth();
  return data.items
    .filter(item => !isGrowthEntry(item))
    .filter(item => item.status !== 'done')
    .filter(item => item.month && item.month < current)
    .reduce((groups, item) => {
      groups[item.month] = groups[item.month] || [];
      groups[item.month].push(item);
      return groups;
    }, {});
}

function renderPastOpenItemsWarning() {
  const groups = pastOpenItemsByMonth();
  const months = Object.keys(groups).sort();
  if (!months.length) return '';
  const count = months.reduce((sum, month) => sum + groups[month].length, 0);
  const oldest = months[0];
  const newest = months[months.length - 1];
  const rangeLabel = oldest === newest ? formatMonth(oldest) : `${formatMonth(oldest)} - ${formatMonth(newest)}`;
  return `
    <button class="overview-lost-items-warning" type="button" onclick="navigate('overview', {month:'${oldest}', overviewLayout:'list'})">
      <span class="overview-lost-items-mark">!</span>
      <span>${count} offene Item${count === 1 ? '' : 's'} in Vormonat${months.length === 1 ? '' : 'en'}</span>
      <span class="overview-lost-items-month">${esc(rangeLabel)}</span>
    </button>
  `;
}

function renderMonthlyFocusPanel(month) {
  const focuses = data.focuses.filter(f => f.month === month);
  return `
    <div class="dashboard-focus card">
      <div class="dashboard-focus-head">
        <div>
          <div class="dashboard-focus-kicker">${formatMonth(month)}</div>
          <div class="dashboard-focus-title">Monthly Focus</div>
        </div>
        <button class="btn btn-sm btn-secondary" onclick="openFocusForm('${month}')">+ Focus</button>
      </div>
      <div class="dashboard-focus-list">
        ${focuses.length ? focuses.map(f => `
          <div class="dashboard-focus-item">
            <div class="dashboard-focus-copy">
              <div class="focus-title">${esc(f.title)}</div>
              ${f.description ? `<div class="focus-desc">${esc(f.description)}</div>` : ''}
            </div>
            <button class="overview-focus-delete" onclick="deleteFocus('${f.id}')" title="Löschen">&#x2715;</button>
          </div>
        `).join('') : '<div class="overview-focus-empty">Noch kein Focus gesetzt</div>'}
      </div>
    </div>
  `;
}

function renderTeamGrowthPersonChips(perPerson, emptyText, options = {}) {
  const extraClass = options.extraClass ? ` ${options.extraClass}` : '';
  const onClick = personId => options.closeOverlay
    ? `closeOverlay();navigate('team', {personId:'${personId}'})`
    : `navigate('team', {personId:'${personId}'})`;
  return `
    <div class="impact-person-strip${extraClass}">
      ${perPerson.length ? perPerson.map(entry => `
        <button class="impact-person-chip" onclick="${onClick(entry.personId)}">
          ${personAvatar(personById(entry.personId), 'sm')}
          <span class="impact-person-copy">
            <span class="impact-person-name">${esc(personName(entry.personId))}</span>
            <span class="impact-person-metrics">
              <span class="impact-metric-positive">+${entry.highlights}</span>
              <span class="impact-metric-sep">/</span>
              <span class="impact-metric-negative">-${entry.concerns}</span>
            </span>
          </span>
        </button>
      `).join('') : `<div class="team-empty-copy">${emptyText}</div>`}
    </div>
  `;
}

function renderMonthImpactPanel(month) {
  const progress = monthProgress(month);
  const personalWins = monthItems(data.items.filter(isPersonalWin), month).sort(compareItemsByDateDesc);
  const teamGrowth = monthItems(data.items.filter(isGrowthEntry), month).sort(compareItemsByDateDesc);
  const highlights = teamGrowth.filter(item => item.type === 'highlight');
  const concerns = teamGrowth.filter(item => item.type === 'concern');
  const perPerson = currentMonthTeamGrowthSummary(month);
  return `
    <div class="impact-month card">
      <div class="impact-month-header">
        <div>
          <div class="impact-month-kicker">${formatMonth(month)} · Tag ${progress.elapsedDays} von ${progress.totalDays}</div>
          <div class="impact-month-title">Was ich diesen Monat bewegt habe</div>
        </div>
        <div class="impact-month-summary">${personalWins.length} Wins · ${highlights.length} Highlights · ${concerns.length} Concerns</div>
      </div>
      <div class="impact-month-progress" aria-hidden="true">
        <div class="impact-month-progress-bar" style="width:${progress.percent}%"></div>
      </div>

      <div class="impact-month-grid">
        <div class="impact-month-column">
          <div class="impact-month-column-head">mein impact diesen monat</div>
          ${personalWins.length ? `
            <div class="impact-stream">
              ${personalWins.slice(0, 8).map(item => `
                <button class="impact-entry impact-entry-personal" onclick="openEditItem('${item.id}')">
                  <span class="impact-entry-date">${formatDateShort(item.date) || '&ndash;'}</span>
                  <span class="badge badge-win">${itemTypeLabel(item.type)}</span>
                  <span class="impact-entry-text">${esc(item.text)}</span>
                  <span class="impact-entry-pulse" aria-hidden="true"></span>
                </button>
              `).join('')}
            </div>
          ` : '<div class="team-empty-copy">Noch keine persönlichen Wins in diesem Monat</div>'}
        </div>
        <div class="impact-month-column">
          <div class="impact-month-column-head">teamentwicklung diesen monat</div>
          ${renderTeamGrowthPersonChips(perPerson, 'Noch kein Teamwachstum in diesem Monat erfasst', { extraClass: 'impact-person-strip-panel' })}
        </div>
      </div>
    </div>
  `;
}

function renderSearch() {
  const rawQuery = (viewState.query || '').trim();
  const query = rawQuery.toLocaleLowerCase('de-AT');

  if (!query) {
    return `
      <div class="section-header">
        <span class="section-title">Suche</span>
      </div>
      <div class="empty-state">
        <div class="empty-state-icon">&#128269;</div>
        <div class="empty-state-text">Oben im Header einen Suchbegriff eingeben</div>
      </div>
    `;
  }

  const itemResults = data.items
    .filter(item => itemMatchesQuery(item, query))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const personResults = data.persons
    .filter(person => personMatchesQuery(person, query))
    .sort((a, b) => a.name.localeCompare(b.name, 'de-AT'));
  const meetingResults = data.meetings
    .filter(meeting => meetingMatchesQuery(meeting, query))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const focusResults = data.focuses
    .filter(focus => focusMatchesQuery(focus, query))
    .sort((a, b) => (b.month || '').localeCompare(a.month || ''));
  const noteResults = (data.notes || [])
    .filter(note => [note.title, note.text].some(value => includesQuery(value, query)))
    .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

  const resultCount = itemResults.length + personResults.length + meetingResults.length + focusResults.length + noteResults.length;

  return `
    <div class="section-header">
      <span class="section-title">Suche</span>
      <div class="search-summary">${resultCount} Treffer für "${esc(rawQuery)}"</div>
    </div>

    ${renderSearchSection('Items', itemResults, item => `
      <button class="search-result-card" onclick="openEditItem('${item.id}')">
        <div class="search-result-head">
          ${item.status === 'done' ? `<span class="badge badge-${item.type}">${itemTypeLabel(item.type)}</span>` : ''}
          <span class="search-result-date">${item.month ? formatMonth(item.month) : ''}</span>
        </div>
        <div class="search-result-title">${esc(item.text)}</div>
        ${item.notes ? `<div class="search-result-body">${esc(item.notes)}</div>` : ''}
        <div class="search-result-meta">${item.personId ? '@' + esc(personName(item.personId)) + ' · ' : ''}${item.status}${item.date ? ' · ' + formatDate(item.date) : ''}${item.meetingId ? ' · ' + esc(meetingTitleText(data.meetings.find(meeting => meeting.id === item.meetingId))) : ''}</div>
      </button>
    `)}

    ${renderSearchSection('Personen', personResults, person => `
      <button class="search-result-card" onclick="navigate('${person.type === 'kontakt' ? 'kontakte:detail' : 'team:detail'}', {personId:'${person.id}'})">
        <div class="search-result-head">
          <span class="badge ${person.type === 'kontakt' ? 'badge-note' : 'badge-focus'}">${person.type === 'kontakt' ? 'kontakt' : 'team'}</span>
        </div>
        <div class="search-result-title">${esc(person.name)}</div>
        ${person.pushDirection ? `<div class="search-result-body">${esc(person.pushDirection)}</div>` : ''}
      </button>
    `)}

    ${renderSearchSection('Meetings', meetingResults, meeting => `
      <button class="search-result-card" onclick="navigate('meetings:detail', {meetingId:'${meeting.id}'})">
        <div class="search-result-head">
          <span class="badge ${meeting.type === 'oneOnOne' ? 'badge-done' : 'badge-todo'}">${meeting.type === 'oneOnOne' ? '1:1' : (isTeamMeeting(meeting) ? 'team' : 'meeting')}</span>
          <span class="search-result-date">${meeting.date ? formatDate(meeting.date) : ''}</span>
        </div>
        <div class="search-result-title">${meetingDisplayTitle(meeting)}</div>
        ${meeting.prep ? `<div class="search-result-body">${esc(meeting.prep)}</div>` : meeting.notes ? `<div class="search-result-body">${esc(meeting.notes)}</div>` : ''}
      </button>
    `)}

    ${renderSearchSection('Focus', focusResults, focus => `
      <button class="search-result-card" onclick="navigate('overview', {month:'${focus.month}'})">
        <div class="search-result-head">
          <span class="badge badge-focus">focus</span>
          <span class="search-result-date">${formatMonth(focus.month)}</span>
        </div>
        <div class="search-result-title">${esc(focus.title)}</div>
        ${focus.description ? `<div class="search-result-body">${esc(focus.description)}</div>` : ''}
      </button>
    `)}

    ${renderSearchSection('Notizen', noteResults, note => `
      <button class="search-result-card" onclick="navigate('notizen', {focusNoteId:'${note.id}'})">
        <div class="search-result-head">
          <span class="badge badge-note">notiz</span>
          <span class="search-result-date">${formatNoteUpdatedAt(note.updatedAt)}</span>
        </div>
        <div class="search-result-title">${esc(note.title)}</div>
        ${note.text ? `<div class="search-result-body">${esc(previewText(note.text, 180))}</div>` : ''}
      </button>
    `)}

    ${resultCount === 0 ? `
      <div class="empty-state">
        <div class="empty-state-icon">&#128270;</div>
        <div class="empty-state-text">Keine Treffer gefunden</div>
      </div>
    ` : ''}
  `;
}

function renderSearchSection(title, entries, renderer) {
  if (!entries.length) return '';
  return `
    <div class="card">
      <div class="card-header">
        <span class="card-title">${title} (${entries.length})</span>
      </div>
      <div class="search-results-grid">
        ${entries.map(renderer).join('')}
      </div>
    </div>
  `;
}

function renderItemSection(title, items, status) {
  return `
    <div class="card drop-target board-${status}"
      ondragover="onItemDragOver(event)"
      ondragleave="onItemDragLeave(event)"
      ondrop="onItemDrop(event, '${status}')">
      <div class="card-header">
        <span class="card-title">${title} (${items.length})</span>
      </div>
      ${items.length ? `
        <ul class="item-list">
          ${items.map(i => renderItem(i, true)).join('')}
        </ul>
      ` : `<div style="color:var(--text-muted);font-size:14px">Keine Einträge</div>`}
    </div>
  `;
}

function compareOverviewTaskRows(a, b) {
  const statusOrder = { todo: 0, waiting: 1, backlog: 2, done: 3 };
  const statusDiff = (statusOrder[a.status] ?? 99) - (statusOrder[b.status] ?? 99);
  if (statusDiff !== 0) return statusDiff;
  const dueDiff = compareByDueDate(a, b);
  if (dueDiff !== 0) return dueDiff;
  return (a.text || '').localeCompare(b.text || '', 'de-AT');
}

function renderTaskSections(sections) {
  return `
    <div class="task-sections">
      ${sections.map(([title, items, status]) => renderTaskSection(title, items, status)).join('')}
    </div>
  `;
}

function renderTaskTable(items) {
  const groups = [
    { status: 'todo', label: 'Todo' },
    { status: 'waiting', label: 'Wartet auf' },
    { status: 'backlog', label: 'Backlog' },
    { status: 'done', label: 'Erledigt' },
  ].map(group => ({
    ...group,
    items: items
      .filter(item => item.status === group.status)
      .sort(compareOverviewTaskRows),
  }));
  return `
    <div class="task-table-sections">
      ${groups.map(group => `
        <section class="card task-table-card task-table-section task-table-section-${group.status} drop-target"
          ondragover="onItemDragOver(event)"
          ondragleave="onItemDragLeave(event)"
          ondrop="onItemDrop(event, '${group.status}')">
          <div class="card-header task-table-section-header">
            <span class="task-table-group-title">
              <span class="task-status-dot task-status-dot-${group.status}" aria-hidden="true"></span>
              ${group.label}
            </span>
            <span class="task-table-group-count">${group.items.length}</span>
          </div>
          ${group.items.length ? `
            <div class="task-table-wrap">
              <table class="task-table">
                <thead>
                  <tr>
                    <th>Task</th>
                    <th>Owner</th>
                    <th>Datum</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  ${group.items.map(item => renderTaskTableRow(item)).join('')}
                </tbody>
              </table>
            </div>
          ` : '<div class="task-table-group-empty">Keine Einträge</div>'}
        </section>
      `).join('')}
    </div>
  `;
}

function previewText(text, maxLength = 120) {
  if (!text) return '';
  const singleLine = String(text).replace(/\s+/g, ' ').trim();
  if (singleLine.length <= maxLength) return singleLine;
  return `${singleLine.slice(0, maxLength).trimEnd()}…`;
}

function renderTaskTableRow(item) {
  const isDone = item.status === 'done';
  const isPastDue = !isDone && item.date && item.date < todayStr();
  const person = item.personId ? data.persons.find(entry => entry.id === item.personId) : null;
  const notesPreview = previewText(item.notes);
  return `
    <tr class="${isDone ? 'is-done' : ''} ${isPastDue ? 'task-table-row-past-due' : ''} task-table-row-${item.status}"
      draggable="true"
      ondragstart="onItemDragStart(event, '${item.id}')"
      ondragend="onItemDragEnd(event)">
      <td class="task-table-task-cell" onclick="openEditItem('${item.id}')">
        <div class="task-table-task">
          <span class="task-status-dot task-status-dot-${item.status}" aria-hidden="true"></span>
          <span>${esc(item.text)}</span>
          ${isPastDue ? '<span class="overdue-badge">Überfällig</span>' : ''}
        </div>
        <div class="task-table-notes ${notesPreview ? '' : 'is-empty'}">${notesPreview ? esc(notesPreview) : ''}</div>
      </td>
      <td class="task-table-link">
        ${person ? `<button class="person-chip-button" onclick="openPersonById('${person.id}')">${personAvatar(person, 'sm')}<span>${esc(person.name)}</span></button>` : '<span class="task-table-muted">Niemand</span>'}
      </td>
      <td><span class="task-table-date ${isPastDue ? 'past-due' : ''}">${item.date ? formatDateShort(item.date) : ''}</span></td>
      <td class="task-table-actions">
        <div class="task-table-action-group">
          <div class="item-check ${isDone ? 'checked' : ''}" onclick="toggleItem('${item.id}')" title="Erledigt"></div>
          <button onclick="openEditItem('${item.id}')" title="Bearbeiten">&#9998;</button>
          <button onclick="deleteItem('${item.id}')" title="Löschen">&#x2715;</button>
        </div>
      </td>
    </tr>
  `;
}

function renderTaskSection(title, items, status) {
  return `
    <div class="card task-section task-${status}">
      <div class="card-header">
        <span class="card-title">${title} (${items.length})</span>
      </div>
      ${items.length ? `
        <ul class="item-list task-list">
          ${items.map(i => renderItem(i, false, { compact: true })).join('')}
        </ul>
      ` : `<div style="color:var(--text-muted);font-size:14px">Keine Einträge</div>`}
    </div>
  `;
}

function renderItem(item, draggable = false, options = {}) {
  const isDone = item.status === 'done';
  const isPastDue = !isDone && item.date && item.date < todayStr();
  const dateLabel = formatDateShort(item.date);
  const linkedMeeting = item.meetingId ? data.meetings.find(meeting => meeting.id === item.meetingId) : null;
  const { showStatus = false, compact = false } = options;
  const notesPreview = previewText(item.notes);
  const dragAttrs = draggable
    ? `draggable="true" ondragstart="onItemDragStart(event, '${item.id}')" ondragend="onItemDragEnd(event)"`
    : '';
  return `
    <li class="item ${isDone ? 'is-done' : ''} ${isPastDue ? 'item-overdue' : ''} ${compact ? 'item-compact' : ''}" ${dragAttrs}>
      <div class="item-content" onclick="openEditItem('${item.id}')" style="cursor:pointer;">
        <div class="item-text ${isDone ? 'done' : ''}">
          ${esc(item.text)}
          ${isPastDue ? '<span class="overdue-badge">Überfällig</span>' : ''}
        </div>
        ${notesPreview ? `<div class="item-notes">${esc(notesPreview)}</div>` : ''}
        <div class="item-meta">
          ${showStatus ? `<span class="badge badge-${item.status}">${item.status}</span>` : ''}
          ${item.personId ? `<button class="item-link-chip item-person-tag" onclick="event.stopPropagation();openPersonById('${item.personId}')">@${esc(personName(item.personId))}</button>` : ''}
          ${linkedMeeting ? `<button class="item-link-chip" onclick="event.stopPropagation();navigate('meetings:detail', {meetingId:'${linkedMeeting.id}'})">${meetingDisplayTitle(linkedMeeting)}</button>` : ''}
          ${isDone ? `<span class="badge badge-${item.type}">${itemTypeLabel(item.type)}</span>` : ''}
          ${dateLabel && !isDone ? `<span class="item-date ${isPastDue ? 'past-due' : ''}">${dateLabel}</span>` : ''}
        </div>
      </div>
      <div class="item-overlay">
        <div class="item-check ${isDone ? 'checked' : ''}" onclick="event.stopPropagation();toggleItem('${item.id}')" title="Erledigt"></div>
        <div class="item-actions">
          <button onclick="event.stopPropagation();openEditItem('${item.id}')" title="Bearbeiten">&#9998;</button>
          <button onclick="event.stopPropagation();deleteItem('${item.id}')" title="Löschen">&#x2715;</button>
        </div>
      </div>
    </li>
  `;
}

function changeMonth(dir) {
  const month = viewState.month || currentMonth();
  viewState.month = dir < 0 ? prevMonth(month) : nextMonth(month);
  render();
}

function setOverviewQuery(value) {
  const input = document.getElementById('overviewSearchInput');
  pendingOverviewSearchSelection = input
    ? { start: input.selectionStart, end: input.selectionEnd }
    : { start: value.length, end: value.length };
  viewState.overviewQuery = value;
  render();
}

function clearOverviewQuery() {
  viewState.overviewQuery = '';
  pendingOverviewSearchSelection = { start: 0, end: 0 };
  render();
}

function setOverviewLayout(layout) {
  const next = layout === 'board' ? 'board' : 'list';
  viewState.overviewLayout = next;
  try {
    localStorage.setItem(OVERVIEW_LAYOUT_KEY, next);
  } catch {}
  render();
}

function overviewLayout() {
  if (viewState.overviewLayout === 'board' || viewState.overviewLayout === 'list') {
    return viewState.overviewLayout;
  }
  try {
    const saved = localStorage.getItem(OVERVIEW_LAYOUT_KEY);
    return saved === 'board' ? 'board' : 'list';
  } catch {
    return 'list';
  }
}

<script data-source="./js/team.js">
// ============================================================
// JIRA TICKETS (Snapshot jira-tickets.json)
// ============================================================
// Der Stempel ist zugleich der Sync-Button: Klick oeffnet das Import-Menue.
// Der Browser kann die Tickets unter file:// nicht selbst holen (CORS), also
// oeffnet man die Jira-Abfrage in einem Tab und fuegt die Antwort hier ein.
function jiraSyncStamp() {
  const age = jiraSyncAgeLabel();
  return `<button class="jira-sync-stamp" type="button" onclick="event.stopPropagation(); openJiraImport()" title="Jira-Abfrage öffnen und Antwort einspielen">stand: ${age || 'unbekannt'} &#8635;</button>`;
}

// ============================================================
// JIRA IMPORT (Copy-Paste aus dem angemeldeten Browser)
// ============================================================
function openJiraImport() {
  const url = jiraQueryUrl();
  const base = getJiraBaseUrl();
  const mapped = data.persons.filter(p => p.type !== 'kontakt' && p.jiraAccountId).length;

  let intro;
  if (!base) {
    intro = `<div class="team-empty-copy">Keine Jira Base-URL gesetzt &mdash; im Theme-Menü unter &bdquo;Jira-URL&ldquo; nachtragen.</div>`;
  } else if (!url) {
    intro = `<div class="team-empty-copy">Noch keine Person mit Jira Account-ID und kein geplanter Block mit Ticket-Referenz &mdash; es gäbe nichts abzufragen.</div>`;
  } else {
    intro = `
      <a class="btn btn-primary" style="display:block;text-align:center" href="${esc(url)}" target="_blank" rel="noopener">1 &middot; Abfrage in Jira öffnen</a>
      <div class="form-hint">Öffnet einen Tab mit der JSON-Antwort (${mapped} ${mapped === 1 ? 'Person' : 'Personen'} verknüpft). Dort alles markieren und kopieren.</div>
    `;
  }

  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">Jira-Tickets einspielen</span>
      <button class="modal-close" onclick="closeOverlay()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">${intro}</div>
      ${renderJiraStatusFilter()}
      ${renderJiraHandoverFilter()}
      <div class="form-group">
        <label class="form-label">2 &middot; Antwort hier einfügen</label>
        <textarea class="form-textarea" id="jiraImportText" rows="8" placeholder='{"issues":[...]}' autofocus></textarea>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="submitJiraImport()">3 &middot; Einspielen</button>
      <div class="form-hint" style="margin-top:10px;text-align:center">
        Von einem anderen Gerät eingespielt?
        <a href="#" onclick="event.preventDefault(); closeOverlay(); refreshJiraSync()">Datei neu einlesen</a>
      </div>
    </div>
  `;
  openOverlay();
}

// Welche Status zaehlen. Aktive Chips = zaehlt, durchgestrichen = ignoriert.
// Die Liste sind alle je gesehenen Status, damit ein ausgeschlossener nicht
// verschwindet, sobald ihn die JQL nicht mehr mitliefert.
function renderJiraStatusFilter() {
  const known = jiraKnownStatuses();
  if (!known.length) {
    return `
      <div class="form-group">
        <label class="form-label">Status</label>
        <div class="form-hint">Nach dem ersten Einspielen lässt sich hier wählen, welche Status zählen.</div>
      </div>
    `;
  }
  const excluded = jiraExcludedStatuses().length;
  return `
    <div class="form-group">
      <label class="form-label">Status &mdash; welche zählen</label>
      <div class="jira-status-filter">
        ${known.map(status => `
          <button type="button" class="jira-status-chip ${isJiraStatusExcluded(status) ? 'off' : 'on'}"
            onclick="toggleJiraStatusFilter(${JSON.stringify(status).replace(/"/g, '&quot;')})">${esc(status)}</button>
        `).join('')}
      </div>
      <div class="form-hint">
        ${excluded ? `${excluded} Status ${excluded === 1 ? 'wird' : 'werden'} ignoriert — wirkt sofort, auch auf den aktuellen Stand.` : 'Alle Status zählen. Klick blendet einen Status aus (z.B. Storniert, Geschlossen).'}
      </div>
    </div>
  `;
}

function toggleJiraStatusFilter(status) {
  toggleJiraStatusExcluded(status);
  reopenJiraImportKeepingDraft();
}

// Welche Status bedeuten "liegt nicht mehr beim Entwickler" (QA, Review,
// Abnahme). Solche Bloecke bekommen in der Planung einen Marker: die Person
// ist fast frei, aber noch nicht ganz.
function renderJiraHandoverFilter() {
  const known = jiraKnownStatuses().filter(s => !isJiraStatusExcluded(s));
  if (!known.length) return '';
  const picked = jiraHandoverStatuses().length;
  return `
    <div class="form-group">
      <label class="form-label">Status &mdash; wartet woanders</label>
      <div class="jira-status-filter">
        ${known.map(status => `
          <button type="button" class="jira-status-chip ${isJiraHandoverStatus(status) ? 'handover' : ''}"
            onclick="toggleJiraHandoverFilter(${JSON.stringify(status).replace(/"/g, '&quot;')})">${esc(status)}</button>
        `).join('')}
      </div>
      <div class="form-hint">
        ${picked
          ? `${picked} Status ${picked === 1 ? 'gilt' : 'gelten'} als Übergabe — Blöcke dazu werden in der Planung markiert.`
          : 'Keiner gewählt. Markiere die Status, bei denen das Ticket beim Entwickler weg ist (z.B. QA, Review) — dann zeigt die Planung, wer eigentlich frei ist.'}
      </div>
    </div>
  `;
}

function toggleJiraHandoverFilter(status) {
  toggleJiraHandoverStatus(status);
  reopenJiraImportKeepingDraft();
}

// Nach einer Status-Auswahl das Menue neu bauen, ohne den eingefuegten
// JSON-Text zu verlieren.
function reopenJiraImportKeepingDraft() {
  const field = document.getElementById('jiraImportText');
  const draft = field ? field.value : '';
  render();
  openJiraImport();
  const restored = document.getElementById('jiraImportText');
  if (restored && draft) restored.value = draft;
}

async function submitJiraImport() {
  const field = document.getElementById('jiraImportText');
  const text = (field ? field.value : '').trim();
  if (!text) return;
  try {
    const snapshot = await importJiraJson(text);
    // Ein Sync kann neue Eltern-Kind-Beziehungen mitbringen: Kopfbloecke
    // nachziehen, bevor die Drift gegen die alten Spannen rechnet.
    if (typeof syncParentBlockSpans === 'function' && syncParentBlockSpans(data.blocks)) {
      saveData(data);
    }
    const count = Object.values(snapshot.assignees || {}).reduce((sum, list) => sum + list.length, 0);
    closeOverlay();
    render();
    const d = snapshot.diff || {};
    const parts = [];
    if (d.added) parts.push(`${d.added} neu`);
    if (d.retitled) parts.push(`${d.retitled} umbenannt`);
    if (d.restatused) parts.push(`${d.restatused} Status`);
    if (d.gone) parts.push(`${d.gone} weg`);
    const summary = d.first
      ? `${count} Tickets eingespielt`
      : parts.length
        ? `${parts.join(', ')} (${count} Tickets)`
        : `Keine Änderungen (${count} Tickets)`;
    toast(snapshot.truncated ? `${summary} — Jira hat mehr, als in eine Antwort passt` : summary);
  } catch (error) {
    toast(error.message || 'Einspielen fehlgeschlagen');
  }
}

function renderPersonJiraBlock(person) {

    return `

        </div>
        <div class="team-empty-copy">Noch keine Tickets eingespielt.</div>
      </div>
    `;
  }
  const tickets = jiraTicketsForPerson(person);
  if (tickets === null) {
    return `
      <div class="team-section-block">
        <div class="card-header">
          <span class="card-title">jira tickets</span>
          ${jiraSyncStamp()}
        </div>
        <div class="team-empty-copy">Keine Jira Account-ID hinterlegt &mdash; im Profil unter &bdquo;Bearbeiten&ldquo; ergänzen.</div>
      </div>
    `;
  }
  return `
    <div class="team-section-block">
      <div class="card-header">
        <span class="card-title">jira tickets (${tickets.length})</span>
        ${jiraSyncStamp()}
      </div>
      ${tickets.length ? `
        <div class="jira-ticket-list">
          ${tickets.map(t => {
            const url = jiraUrl(t.key);
            const keyEl = url
              ? `<a class="jira-ticket-key" href="${esc(url)}" target="_blank" rel="noopener">${esc(t.key)}</a>`
              : `<span class="jira-ticket-key">${esc(t.key)}</span>`;
            return `
              <div class="jira-ticket-row">
                ${keyEl}
                <span class="jira-ticket-summary" title="${esc(t.summary || '')}">${esc(t.summary || '')}</span>
                <span class="jira-status-chip jira-status-${esc(t.statusCategory || 'new')}">${esc((t.status || '').toLowerCase())}</span>
              </div>
            `;
          }).join('')}
        </div>
      ` : '<div class="team-empty-copy">Keine offenen Tickets assigned</div>'}

          ${selectedPerson ? `
            <div class="team-detail-header">
              <div class="team-detail-identity">
                ${personAvatar(selectedPerson, 'lg')}
                <div class="team-detail-copy" style="flex:1;min-width:0">
                  <div class="team-detail-topline">
                    <div class="team-detail-name">${esc(selectedPerson.name)}</div>
                    <div class="team-detail-actions">
                      <button class="btn btn-secondary btn-sm" onclick="openPersonForm('${selectedPerson.id}')">Bearbeiten</button>
                    </div>
                  </div>
                  <div class="team-detail-push">Kontakt</div>
                </div>
              </div>
            </div>

	            <div>
	              <div>
	                <div class="card-header">
                  <span class="card-title">Offene Items (${selectedOpenItems.length})</span>
                </div>
                ${selectedOpenItems.length
                  ? `<ul class="item-list">${selectedOpenItems.slice(0, 10).map(item => renderItem(item, false, { compact: true })).join('')}</ul>`
                  : '<div class="team-empty-copy">Keine offenen Items</div>'}
              </div>
	            </div>
          ` : `
            <div class="empty-state">
              <div class="empty-state-icon">&#128101;</div>
              <div class="empty-state-text">Kontakt wählen</div>
            </div>
          `}
        </section>
      </div>
    ` : `
      <div class="empty-state">
        <div class="empty-state-icon">&#128101;</div>
        <div class="empty-state-text">Noch keine Kontakte angelegt</div>
      </div>
    `}
  `;
}

// ============================================================
// KONTAKT DETAIL
// ============================================================
function renderKontaktDetail() {
  const p = data.persons.find(p => p.id === viewState.personId);
  if (!p) return '<div>Kontakt nicht gefunden</div>';
  const items = data.items.filter(i => i.personId === p.id);
  const openItems = items.filter(i => i.status !== 'done');

  return `
    <button class="back-btn" onclick="navigate('kontakte')">&#8592; Zurück</button>

    <div class="person-detail-header">
      <div class="person-avatar">${p.name.charAt(0).toUpperCase()}</div>
      <div>
        <div style="font-size:22px;font-weight:700">${esc(p.name)}</div>
        <div style="color:var(--text-muted);font-size:12px">Kontakt</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="openPersonForm('${p.id}')">Bearbeiten</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Offene Items (${openItems.length})</span></div>
      ${openItems.length ? '<ul class="item-list">' + openItems.map(i => renderItem(i)).join('') + '</ul>' : '<div style="color:var(--text-muted);font-size:14px">Keine offenen Items</div>'}
    </div>
	  `;
}

</script>
<script data-source="./js/meetings.js">
// ============================================================
// MEETINGS VIEW
// ============================================================
function meetingDisplayTitle(m) {
  return esc(meetingTitleText(m));
}

function openMeetingDetail(id) {
  navigate('meetings:detail', { meetingId: id });
}

function setMeetingQuery(value) {
  const input = document.getElementById('meetingSearchInput');
  pendingMeetingSearchSelection = input
    ? { start: input.selectionStart, end: input.selectionEnd }
    : { start: value.length, end: value.length };
  viewState.meetingQuery = value;
  render();
}

function setMeetingRangeFilter(value) {
  viewState.meetingRange = value;
  render();
}

function parsePrepBullets(prep) {
  if (!prep) return [];
  const bullets = [];
  let current = null;
  const push = () => { if (current) bullets.push(current); };
  for (const raw of prep.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const mDone = line.match(/^\s*-\s*\[x\](?:\s+(.*))?$/i);
    if (mDone) { push(); current = { text: mDone[1] || '', done: true }; continue; }
    const mOpen = line.match(/^\s*-\s*\[\s?\](?:\s+(.*))?$/);
    if (mOpen) { push(); current = { text: mOpen[1] || '', done: false }; continue; }
    const mDash = line.match(/^\s*[-*](?:\s+(.*))?$/);
    if (mDash) { push(); current = { text: mDash[1] || '', done: false }; continue; }
    if (current) {
      current.text += '\n' + line.replace(/^\s{1,4}/, '');
    } else if (line.trim()) {
      current = { text: line.trim(), done: false };
    }
  }
  push();
  return bullets;
}

function serializePrepBullets(bullets) {
  return bullets.map(b => {
    const prefix = b.done ? '- [x] ' : '- ';
    const [first, ...rest] = (b.text || '').split('\n');
    const cont = rest.map(l => '  ' + l).join('\n');
    return prefix + first + (cont ? '\n' + cont : '');
  }).join('\n');
}

function meetingSeriesKey(meeting) {
  if (!meeting) return '';
  if (meeting.type === 'oneOnOne') return meeting.personId ? `oneOnOne:${meeting.personId}` : '';
  const title = String(meeting.title || '').trim().toLocaleLowerCase('de-AT');
  return title ? `meeting:${title}` : '';
}

function earlierMeetingsInSeries(meeting) {
  const key = meetingSeriesKey(meeting);
  if (!key) return [];
  const referenceDate = meeting.date || todayStr();
  return data.meetings
    .filter(candidate => candidate.id !== meeting.id && candidate.date && candidate.date < referenceDate && meetingSeriesKey(candidate) === key)
    .sort((a, b) => b.date.localeCompare(a.date));
}

function openPrepCarryovers(meeting) {
  return earlierMeetingsInSeries(meeting).flatMap(sourceMeeting =>
    parsePrepBullets(sourceMeeting.prep)
      .map((bullet, index) => ({ ...bullet, index, sourceMeeting }))
      .filter(bullet => !bullet.done && bullet.text.trim())
  );
}

function meetingRelativeDate(d) {
  if (!d) return '';
  const today = todayStr();
  if (d === today) return 'heute';
  if (d === dateShift(today, 1)) return 'morgen';
  if (d === dateShift(today, -1)) return 'gestern';
  const diff = Math.round((parseISO(d) - parseISO(today)) / 86400000);
  if (diff > 1 && diff <= 7) return `in ${diff} Tagen`;
  if (diff < -1 && diff >= -7) return `vor ${-diff} Tagen`;
  return formatDate(d);
}

function meetingFollowupCounts(id) {
  const items = meetingItems(id);
  const counts = { todo: 0, waiting: 0, done: 0, backlog: 0, total: items.length };
  items.forEach(i => { if (counts[i.status] !== undefined) counts[i.status]++; });
  return counts;
}

function meetingMonthKey(meeting) {
  return meeting.date ? meeting.date.slice(0, 7) : 'ohne-datum';
}

function meetingMonthLabel(key) {
  return key === 'ohne-datum' ? 'ohne datum' : formatMonth(key).toLocaleLowerCase('de-AT');
}

function meetingListExcerpt(m, query) {
  const linkedItems = data.items
    .filter(item => item.meetingId === m.id)
    .flatMap(item => [item.text, item.notes]);
  const source = [m.notes, m.prep, ...linkedItems].filter(Boolean).join(' ');
  if (!source) return '';
  const compact = String(source).replace(/\s+/g, ' ').trim();
  if (!query) return previewText(compact, 110);
  const idx = compact.toLocaleLowerCase('de-AT').indexOf(query);
  if (idx < 0) return previewText(compact, 110);
  const start = Math.max(0, idx - 36);
  const end = Math.min(compact.length, idx + query.length + 74);
  return `${start ? '...' : ''}${compact.slice(start, end).trim()}${end < compact.length ? '...' : ''}`;
}

function meetingHasOpenFollowups(meeting) {
  const counts = meetingFollowupCounts(meeting.id);
  return counts.todo + counts.waiting + counts.backlog > 0;
}

function meetingMatchesRange(meeting, range, today) {
  if (range === 'upcoming') return !meeting.date || meeting.date >= today;
  if (range === 'past') return meeting.date && meeting.date < today;
  if (range === 'open') return meetingHasOpenFollowups(meeting);
  if (range === 'undated') return !meeting.date;
  return true;
}

// Kommende Meetings bleiben eine flache, chronologische Liste. Unscharfe Koerbe
// ("naechste 7 tage") sind zum Scannen schlechter als das Datum selbst — die
// Datebox links sagt ohnehin schon Tag und Wochentag. Struktur kommt nur noch
// aus echten Kalendergrenzen: Monatstrenner vorne, Monatsgruppen in der Historie.
function groupMeetingsByTimeline(meetings, today) {
  const groups = { kommend: [], ohneDatum: [], vergangen: {} };
  meetings.forEach(m => {
    if (!m.date) { groups.ohneDatum.push(m); return; }
    if (m.date >= today) { groups.kommend.push(m); return; }
    const key = meetingMonthKey(m);
    if (!groups.vergangen[key]) groups.vergangen[key] = [];
    groups.vergangen[key].push(m);
  });
  groups.kommend.sort((a, b) => a.date.localeCompare(b.date)
    || meetingTitleText(a).localeCompare(meetingTitleText(b), 'de-AT'));
  groups.ohneDatum.sort((a, b) => meetingTitleText(a).localeCompare(meetingTitleText(b), 'de-AT'));
  Object.values(groups.vergangen).forEach(entries => entries.sort((a, b) => (b.date || '').localeCompare(a.date || '')));
  return groups;
}

function pastMonthKeys(groups) {
  return Object.keys(groups.vergangen).sort((a, b) => b.localeCompare(a));
}

function flattenMeetingGroups(groups) {
  return [
    ...groups.kommend,
    ...groups.ohneDatum,
    ...pastMonthKeys(groups).flatMap(key => groups.vergangen[key]),
  ];
}

function renderMeetingListRow(m, isActive, query = '', isToday = false) {
  const counts = meetingFollowupCounts(m.id);
  const person = m.personId ? data.persons.find(p => p.id === m.personId) : null;
  const participants = meetingParticipants(m);
  const openTodos = counts.todo + counts.waiting;
  const teamMeeting = isTeamMeeting(m);
  // Ohne Suche ist der Auszug nur Rauschen und kostet jede Zeile eine Zeile mehr;
  // fuer den Blick zwischendurch reicht der Hover-Peek.
  const excerpt = query ? meetingListExcerpt(m, query) : '';
  const date = m.date ? new Date(`${m.date}T12:00:00`) : null;
  const day = date ? String(date.getDate()).padStart(2, '0') : '--';
  const weekday = date ? date.toLocaleDateString('de-AT', { weekday: 'short' }).replace('.', '') : '';
  const peekBits = [];
  if (participants.length) peekBits.push(participants.map(p => p.name).join(', '));
  if (m.notes) peekBits.push(previewText(m.notes));
  const peek = peekBits.join('\n\n');
  return `
    <div class="meeting-list-row ${isActive ? 'active' : ''} ${isToday ? 'is-today' : ''}"
         onclick="openMeetingDetail('${m.id}')"
         role="button" tabindex="0"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMeetingDetail('${m.id}')}"
         ${peek ? `data-peek="${esc(peek)}"` : ''}>
      <div class="meeting-list-datebox">
        <span class="meeting-list-datebox-day">${day}</span>
        <span class="meeting-list-datebox-weekday">${weekday ? esc(weekday) : '--'}</span>
      </div>
      <div class="meeting-list-main">
        <div class="meeting-list-head">
          <span class="meeting-list-type">${m.type === 'oneOnOne' ? '1:1' : (teamMeeting ? 'team' : 'mtg')}</span>
          <span class="meeting-list-title">${meetingDisplayTitle(m)}</span>
          ${(openTodos || counts.done) ? `<span class="meeting-list-followups">
            ${openTodos ? `<span class="badge badge-todo">${openTodos}</span>` : ''}
            ${counts.done ? `<span class="badge badge-done">${counts.done}</span>` : ''}
          </span>` : ''}
        </div>
        <div class="meeting-list-meta">
          ${person && m.type !== 'oneOnOne' ? `<span class="meeting-list-person">@${esc(person.name)}</span>` : ''}
          ${participants.length && !person && teamMeeting ? `<span class="meeting-list-count">${participants.length}p</span>` : ''}
        </div>
        ${excerpt ? `<div class="meeting-list-excerpt">${esc(excerpt)}</div>` : ''}
      </div>
    </div>
  `;
}

function renderMeetingListGroup(label, meetings, selectedId, query = '') {
  if (!meetings.length) return '';
  return `
    <div class="meeting-list-group">
      <div class="meeting-list-group-label">${label} <span class="meeting-list-group-count">${meetings.length}</span></div>
      ${meetings.map(m => renderMeetingListRow(m, m.id === selectedId, query)).join('')}
    </div>
  `;
}

// Zugeklappte Monate der Vergangenheit. Bewusst modulweit statt in viewState:
// der Zustand soll einen Ausflug in eine andere View ueberleben.
const expandedPastMonths = new Set();
let seededSelectionId = null;

function togglePastMonth(key) {
  const sidebar = document.querySelector('.meetings-sidebar');
  const scrollTop = sidebar ? sidebar.scrollTop : 0;
  if (expandedPastMonths.has(key)) expandedPastMonths.delete(key);
  else expandedPastMonths.add(key);
  render();
  const renderedSidebar = document.querySelector('.meetings-sidebar');
  if (renderedSidebar) renderedSidebar.scrollTop = scrollTop;
}

function renderUpcomingMeetingRows(meetings, selectedId, query, today) {
  let lastMonth = '';
  return meetings.map(m => {
    const key = meetingMonthKey(m);
    const divider = key === lastMonth ? '' : `<div class="meeting-list-month">${meetingMonthLabel(key)}</div>`;
    lastMonth = key;
    return divider + renderMeetingListRow(m, m.id === selectedId, query, m.date === today);
  }).join('');
}

function renderPastMeetingGroup(key, meetings, selectedId, query, open) {
  return `
    <div class="meeting-list-group">
      <button class="meeting-list-group-label meeting-list-group-toggle ${open ? 'is-open' : ''}"
        onclick="togglePastMonth('${key}')" aria-expanded="${open ? 'true' : 'false'}">
        <span class="meeting-list-group-toggle-label">
          <span class="meeting-list-group-caret" aria-hidden="true">${open ? '&#9662;' : '&#9656;'}</span>
          ${meetingMonthLabel(key)}
        </span>
        <span class="meeting-list-group-count">${meetings.length}</span>
      </button>
      ${open ? meetings.map(m => renderMeetingListRow(m, m.id === selectedId, query)).join('') : ''}
    </div>
  `;
}

// Rechte Spalte ohne Auswahl. Statt eines leeren Kastens die naechsten Termine
// als Sprungziele — damit bleibt das Layout stehen und der erste Klick ist kurz.
function renderMeetingsDetailPlaceholder(upcoming) {
  const next = upcoming.slice(0, 4);
  return `
    <div class="meetings-empty-panel">
      <div class="meetings-empty-title">Kein Meeting ausgewählt</div>
      <div class="meetings-empty-sub">links wählen &mdash; oder direkt weiter:</div>
      <div class="meetings-empty-quickcards">
        ${next.map(m => `
          <button class="meetings-empty-card" onclick="openMeetingDetail('${m.id}')">
            <span class="meetings-empty-card-label">${m.type === 'oneOnOne' ? '1:1' : (isTeamMeeting(m) ? 'team' : 'mtg')}</span>
            <span class="meetings-empty-card-title">${meetingDisplayTitle(m)}</span>
            <span class="meetings-empty-card-date">${meetingRelativeDate(m.date)}</span>
          </button>
        `).join('')}
        <button class="meetings-empty-card meetings-empty-card-new" onclick="openMeetingForm('meeting')">
          <span class="meetings-empty-card-label">neu</span>
          <span class="meetings-empty-card-title">+ Meeting</span>
          <span class="meetings-empty-card-date">ad hoc erfassen</span>
        </button>
        <button class="meetings-empty-card meetings-empty-card-new" onclick="openMeetingForm('oneOnOne')">
          <span class="meetings-empty-card-label">neu</span>
          <span class="meetings-empty-card-title">+ 1:1</span>
          <span class="meetings-empty-card-date">mit einer Person</span>
        </button>
      </div>
    </div>
  `;
}

function renderMeetings() {
  const filter = viewState.meetingFilter || 'all';
  const range = viewState.meetingRange || 'all';
  const rawQuery = viewState.meetingQuery || '';
  const query = rawQuery.trim().toLocaleLowerCase('de-AT');
  const today = todayStr();

  let meetings = [...data.meetings];
  if (filter === 'oneOnOne') meetings = meetings.filter(m => m.type === 'oneOnOne');
  else if (filter === 'team') meetings = meetings.filter(m => isTeamMeeting(m));
  else if (filter === 'other') meetings = meetings.filter(m => m.type !== 'oneOnOne' && !isTeamMeeting(m));
  if (range !== 'all') meetings = meetings.filter(m => meetingMatchesRange(m, range, today));
  if (query) meetings = meetings.filter(m => meetingMatchesQuery(m, query));

  const groups = groupMeetingsByTimeline(meetings, today);
  const ordered = flattenMeetingGroups(groups);

  const selectedId = currentView === 'meetings:detail' && ordered.some(m => m.id === viewState.meetingId)
    ? viewState.meetingId
    : null;
  const selected = selectedId ? data.meetings.find(m => m.id === selectedId) : null;

  const totalCount = data.meetings.length;
  const oneOnOneCount = data.meetings.filter(m => m.type === 'oneOnOne').length;
  const teamCount = data.meetings.filter(m => isTeamMeeting(m)).length;
  const openFollowupCount = data.meetings.filter(meetingHasOpenFollowups).length;
  const pastKeys = pastMonthKeys(groups);
  const pastCount = pastKeys.reduce((sum, key) => sum + groups.vergangen[key].length, 0);
  // Historie ist standardmaessig zu. Sie geht auf, wenn man sie ausdruecklich
  // sucht (Suchbegriff, Range-Tab) oder das offene Meeting drin liegt.
  const pastAlwaysOpen = !!query || range === 'past';
  // Ein ausgewaehltes Meeting klappt seinen Monat auf — aber nur einmal beim
  // Wechsel der Auswahl, sonst liesse er sich danach nicht mehr zuklappen.
  if (selectedId && seededSelectionId !== selectedId) {
    seededSelectionId = selectedId;
    pastKeys.forEach(key => {
      if (groups.vergangen[key].some(m => m.id === selectedId)) expandedPastMonths.add(key);
    });
  }
  const isPastMonthOpen = key => pastAlwaysOpen || expandedPastMonths.has(key);
  const meetingListContent = `
    <div class="meetings-sidebar-controls">
      <div class="meetings-sidebar-head">
        <div class="meetings-result-line">
          <span>${ordered.length}</span>
          <strong>/ ${totalCount}</strong>
          <em>${query ? 'treffer' : 'sichtbar'}</em>
        </div>
        <div class="meetings-sidebar-stats">
          <span>${oneOnOneCount} 1:1</span>
          <span>${teamCount} team</span>
          <span>${openFollowupCount} offen</span>
        </div>
      </div>
      <div class="meeting-range-tabs">
        <button class="${range === 'all' ? 'active' : ''}" onclick="setMeetingRangeFilter('all')">alle</button>
        <button class="${range === 'upcoming' ? 'active' : ''}" onclick="setMeetingRangeFilter('upcoming')">kommend</button>
        <button class="${range === 'past' ? 'active' : ''}" onclick="setMeetingRangeFilter('past')">historie</button>
        <button class="${range === 'open' ? 'active' : ''}" onclick="setMeetingRangeFilter('open')">offen</button>
        <button class="${range === 'undated' ? 'active' : ''}" onclick="setMeetingRangeFilter('undated')">ohne datum</button>
      </div>
    </div>
    ${ordered.length ? `
      ${renderUpcomingMeetingRows(groups.kommend, selectedId, query, today)}
      ${renderMeetingListGroup('ohne datum', groups.ohneDatum, selectedId, query)}
      ${pastCount ? `
        <div class="meeting-list-divider">historie <span>${pastCount}</span></div>
        ${pastKeys.map(key => renderPastMeetingGroup(key, groups.vergangen[key], selectedId, query, isPastMonthOpen(key))).join('')}
      ` : ''}
    ` : `<div class="meetings-sidebar-empty">${query ? 'keine treffer' : 'keine meetings'}</div>`}
  `;

  return `
    <div class="section-header">
      <div class="overview-toolbar">
        <span class="section-title">Meetings</span>
        <div class="view-search">
          <input
            id="meetingSearchInput"
            type="search"
            placeholder="grep: titel, notizen, prep, personen..."
            value="${esc(rawQuery)}"
            oninput="setMeetingQuery(this.value)"
          >
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="openMeetingForm('meeting')">+ Meeting</button>
        <button class="btn btn-primary btn-sm" onclick="openMeetingForm('oneOnOne')">+ 1:1</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn ${filter === 'all' ? 'active' : ''}" onclick="setMeetingTypeFilter('all')">alle</button>
      <button class="filter-btn ${filter === 'oneOnOne' ? 'active' : ''}" onclick="setMeetingTypeFilter('oneOnOne')">1:1s</button>
      <button class="filter-btn ${filter === 'team' ? 'active' : ''}" onclick="setMeetingTypeFilter('team')">team</button>
      <button class="filter-btn ${filter === 'other' ? 'active' : ''}" onclick="setMeetingTypeFilter('other')">sonstige</button>
    </div>

    ${totalCount ? `
      <div class="meetings-layout">
        <aside class="meetings-sidebar card">
          ${meetingListContent}
        </aside>
        ${selected ? `
          <section class="meetings-detail-panel card">
            <div class="meetings-detail-header">
              <div class="meetings-detail-title-row">
                <span class="section-title">${meetingDisplayTitle(selected)}</span>
                <button class="meetings-detail-date" title="Datum ändern" onclick="openScheduleMeetingDate('${selected.id}')">${selected.date ? meetingRelativeDate(selected.date) : 'ohne Datum'}</button>
              </div>
              <div class="meetings-detail-actions">
                ${selected.personId ? `<button class="btn btn-secondary btn-sm" onclick="openPersonById('${selected.personId}')">@${esc(personName(selected.personId))}</button>` : ''}
                ${selected.type !== 'oneOnOne' ? `<label class="btn btn-secondary btn-sm" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" ${isTeamMeeting(selected) ? 'checked' : ''} onchange="toggleMeetingTeamFlag('${selected.id}', this.checked)" style="margin:0"><span>Team</span></label>` : ''}
                ${selected.type !== 'oneOnOne' ? `<button class="btn btn-secondary btn-sm" onclick="openMeetingTitleForm('${selected.id}')">Titel bearbeiten</button>` : ''}
                ${selected.type === 'oneOnOne' && !selected.date ? `<button class="btn btn-secondary btn-sm" onclick="openScheduleMeetingDate('${selected.id}')">Einplanen</button>` : ''}
                <button class="btn btn-primary btn-sm" onclick="openMeetingFollowUp('${selected.id}')">+ Follow-up</button>
                <button class="btn btn-secondary btn-sm" onclick="exportMeeting('${selected.id}')">Export .md</button>
                <button class="btn btn-secondary btn-sm" onclick="deleteMeeting('${selected.id}')">Löschen</button>
              </div>
            </div>
            ${renderMeetingDetailBody(selected)}
          </section>
        ` : `
          <section class="meetings-detail-panel card">
            ${renderMeetingsDetailPlaceholder(groups.kommend)}
          </section>
        `}
      </div>
    ` : `
      <div class="empty-state">
        <div class="empty-state-icon">&#128197;</div>
        <div class="empty-state-text">Noch keine Meetings</div>
      </div>
    `}
  `;
}

function setMeetingTypeFilter(value) {
  viewState.meetingFilter = value;
  render();
}

// ============================================================
// MEETING DETAIL
// ============================================================
function renderMeetingDetail() {
  const m = data.meetings.find(m => m.id === viewState.meetingId);
  if (!m) return '<div>Meeting nicht gefunden</div>';
  return `
    <button class="back-btn" onclick="navigate('meetings')">&#8592; Zurück</button>

    <div class="section-header">
      <span class="section-title">${meetingDisplayTitle(m)}</span>
      <div style="display:flex;gap:8px">
        ${m.personId ? `<button class="btn btn-secondary btn-sm" onclick="openPersonById('${m.personId}')">@${esc(personName(m.personId))}</button>` : ''}
        ${m.type !== 'oneOnOne' ? `<label class="btn btn-secondary btn-sm" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" ${isTeamMeeting(m) ? 'checked' : ''} onchange="toggleMeetingTeamFlag('${m.id}', this.checked)" style="margin:0"><span>Team</span></label>` : ''}
        ${m.type !== 'oneOnOne' ? `<button class="btn btn-secondary btn-sm" onclick="openMeetingTitleForm('${m.id}')">Titel bearbeiten</button>` : ''}
        <button class="btn btn-primary btn-sm" onclick="openMeetingFollowUp('${m.id}')">+ Follow-up</button>
        <span style="color:var(--text-muted);font-size:14px;line-height:32px">${m.date ? formatDate(m.date) : 'ohne Datum'}</span>
        ${m.type === 'oneOnOne' && !m.date ? `<button class="btn btn-secondary btn-sm" onclick="openScheduleMeetingDate('${m.id}')">Einplanen</button>` : ''}
        <button class="btn btn-secondary btn-sm" onclick="exportMeeting('${m.id}')">Export .md</button>
        <button class="btn btn-secondary btn-sm" onclick="deleteMeeting('${m.id}')">Löschen</button>
      </div>
    </div>
    ${renderMeetingDetailBody(m)}
  `;
}

function meetingStatusExpanded() {
  return viewState.meetingStatusCollapsed === false;
}

function toggleMeetingStatusSection() {
  viewState.meetingStatusCollapsed = meetingStatusExpanded() ? true : false;
