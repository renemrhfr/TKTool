  render();
}

function renderMeetingStatusSection(m) {
  if (!isTeamMeeting(m) && m.type !== 'oneOnOne') return '';
  const content = renderMeetingTeamStatus(m);
  if (!content) return '';
  const expanded = meetingStatusExpanded();
  return `
    <div class="meeting-section-card ${expanded ? 'is-expanded' : 'is-collapsed'}">
      <button class="meeting-section-toggle" onclick="toggleMeetingStatusSection()" aria-expanded="${expanded ? 'true' : 'false'}">
        <span>Planung / Status</span>
        <span class="meeting-section-toggle-icon" aria-hidden="true">${expanded ? '&#8722;' : '+'}</span>
      </button>
      ${expanded ? `<div class="meeting-section-content">${content}</div>` : ''}
    </div>
  `;
}

function renderCarryoverSignal(item) {
  const tone = item.type === 'concern' ? 'concern' : 'highlight';
  const label = item.type === 'concern' ? 'concern' : 'win';
  return `
    <button class="oneonone-carryover-signal oneonone-carryover-signal-${tone}" onclick="openEditItem('${item.id}')">
      <span class="oneonone-carryover-date">${formatDateShort(item.date) || '&ndash;'}</span>
      <span class="badge badge-${item.type}">${label}</span>
      <span class="oneonone-carryover-text">${esc(item.text)}</span>
    </button>
  `;
}

function renderOneOnOneCarryover(m) {
  const person = m.personId ? data.persons.find(p => p.id === m.personId) : null;
  if (m.type !== 'oneOnOne' || !person) return '';
  const carryover = oneOnOneCarryover(m);
  const total = carryoverCount(carryover);
  const empty = '<div class="oneonone-carryover-empty">Nichts offen</div>';
  return `
    <div class="meeting-detail-section meeting-detail-section-emphasis oneonone-carryover">
      <div class="oneonone-carryover-head">
        <h3>Übernahme</h3>
        <span class="oneonone-carryover-count">${total} Signale</span>
      </div>
      <div class="oneonone-carryover-grid">
        <div class="oneonone-carryover-column oneonone-carryover-column-followups">
          <div class="oneonone-carryover-title">Offene Follow-ups</div>
          ${carryover.openFollowUps.length
            ? `<ul class="item-list oneonone-carryover-list">${carryover.openFollowUps.map(item => renderItem(item, false, { compact: true })).join('')}</ul>`
            : empty}
        </div>
        <div class="oneonone-carryover-column oneonone-carryover-column-todos">
          <div class="oneonone-carryover-title">Todos</div>
          ${carryover.openTodos.length
            ? `<ul class="item-list oneonone-carryover-list">${carryover.openTodos.map(item => renderItem(item, false, { compact: true })).join('')}</ul>`
            : empty}
        </div>
        <div class="oneonone-carryover-column oneonone-carryover-column-signals">
          <div class="oneonone-carryover-title">Concerns / Wins seit letztem 1:1</div>
          ${carryover.recentSignals.length
            ? `<div class="oneonone-carryover-signals">${carryover.recentSignals.map(renderCarryoverSignal).join('')}</div>`
            : '<div class="oneonone-carryover-empty">Noch keine Signale</div>'}
        </div>
      </div>
    </div>
  `;
}

function renderMeetingDetailBody(m) {
  const linkedItems = meetingItems(m.id);
  const person = m.personId ? data.persons.find(p => p.id === m.personId) : null;
  const participants = meetingParticipants(m);
  const teamMeeting = isTeamMeeting(m);
  const participantCard = !teamMeeting ? '' : `
    <div class="card">
      <div class="card-header">
        <span class="card-title">Teilnehmer (${participants.length})</span>
      </div>
      <div class="participant-list">
        ${data.persons
          .filter(person => person.type !== 'kontakt')
          .slice()
          .sort(comparePersonsByName)
          .map(member => {
          const active = meetingParticipantIds(m).includes(member.id);
          const locked = m.type === 'oneOnOne' && m.personId === member.id;
          return `
            <button class="participant-pill ${active ? 'active' : ''}" onclick="toggleMeetingParticipant('${m.id}', '${member.id}')" ${locked ? 'disabled' : ''}>
              ${personAvatar(member, 'sm')}
              <span>${esc(member.name)}</span>
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
  return `
    ${renderMeetingInsights(m)}

    ${participantCard}

    ${renderMeetingStatusSection(m)}

    ${renderOneOnOneCarryover(m)}

    <div class="meeting-detail-section meeting-detail-section-emphasis">
      <h3>Vorbereitung</h3>
      ${renderPrepCarryovers(m)}
      <div id="prepBullets" class="prep-bullets">${renderPrepBullets(m.id)}</div>
      <button class="btn btn-sm btn-secondary" onclick="addPrepBullet('${m.id}')">+ punkt</button>
    </div>

    <div class="meeting-detail-section meeting-detail-section-emphasis">
      <h3>Mitschrift</h3>
      <textarea class="form-textarea" style="min-height:400px" placeholder="Notizen..."
        onchange="updateMeetingField('${m.id}','notes',this.value)">${esc(m.notes || '')}</textarea>
    </div>

    <div class="card meeting-detail-section-emphasis">
      <div class="card-header">
        <span class="card-title">Follow-ups (${linkedItems.length})</span>
        <button class="btn btn-sm btn-secondary" onclick="openMeetingFollowUp('${m.id}')">+ Follow-up</button>
      </div>
      ${linkedItems.length ? `<ul class="item-list">${linkedItems.map(item => renderItem(item)).join('')}</ul>` : '<div style="color:var(--text-muted);font-size:14px">Noch keine Follow-ups</div>'}
    </div>
  `;
}

function openMeetingFollowUp(meetingId) {
  const meeting = data.meetings.find(entry => entry.id === meetingId);
  if (!meeting) return;
  openCapture({
    meetingId: meeting.id,
    personId: meeting.personId || null,
    month: meeting.date ? meeting.date.slice(0, 7) : currentMonth(),
    date: meeting.date || todayStr(),
    status: 'todo',
    type: 'todo',
  });
}

function updateMeetingField(id, field, value) {
  const m = data.meetings.find(m => m.id === id);
  if (m) { m[field] = value; saveData(data); }
}

function openMeetingTitleForm(id) {
  const meeting = data.meetings.find(m => m.id === id);
  if (!meeting || meeting.type === 'oneOnOne') return;
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">Meeting-Titel bearbeiten</span>
      <button class="modal-close" onclick="closeOverlay()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Titel</label>
        <input
          class="form-input"
          id="editMeetingTitle"
          value="${esc(meeting.title || '')}"
          placeholder="z.B. Standup, TK-Meeting, Retro..."
          autofocus
          onkeydown="if(event.key==='Enter'){saveMeetingTitle('${meeting.id}')}"
        >
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="saveMeetingTitle('${meeting.id}')">Speichern</button>
    </div>
  `;
  openOverlay();
  setTimeout(() => {
    const input = document.getElementById('editMeetingTitle');
    input?.focus();
    input?.select();
  }, 100);
}

function saveMeetingTitle(id) {
  const meeting = data.meetings.find(m => m.id === id);
  if (!meeting || meeting.type === 'oneOnOne') return;
  const title = document.getElementById('editMeetingTitle')?.value.trim();
  if (!title) { toast('Titel nötig'); return; }
  meeting.title = title;
  saveData(data);
  closeOverlay();
  toast('Titel aktualisiert');
  render();
}

function openScheduleMeetingDate(id) {
  const meeting = data.meetings.find(m => m.id === id);
  if (!meeting) return;
  const isReschedule = !!meeting.date;
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">${isReschedule ? 'Datum ändern' : (meeting.type === 'oneOnOne' ? '1:1 einplanen' : 'Meeting einplanen')}</span>
      <button class="modal-close" onclick="closeOverlay()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Datum</label>
        <input type="date" class="form-input" id="scheduleMeetingDate" value="${meeting.date || todayStr()}" autofocus
          onkeydown="if(event.key==='Enter'){saveScheduledMeetingDate('${meeting.id}')}">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="saveScheduledMeetingDate('${meeting.id}')">${isReschedule ? 'Speichern' : 'Einplanen'}</button>
    </div>
  `;
  openOverlay();
  setTimeout(() => document.getElementById('scheduleMeetingDate')?.focus(), 100);
}

function saveScheduledMeetingDate(id) {
  const meeting = data.meetings.find(m => m.id === id);
  const date = document.getElementById('scheduleMeetingDate')?.value || '';
  if (!meeting) return;
  if (!date) { toast('Datum nötig'); return; }
  const wasScheduled = !!meeting.date;
  meeting.date = date;
  saveData(data);
  closeOverlay();
  toast(wasScheduled ? 'Datum aktualisiert' : (meeting.type === 'oneOnOne' ? '1:1 eingeplant' : 'Meeting eingeplant'));
  render();
}

function toggleMeetingParticipant(meetingId, personId) {
  const meeting = data.meetings.find(entry => entry.id === meetingId);
  if (!meeting) return;
  if (meeting.type === 'oneOnOne' && meeting.personId === personId) return;
  const participants = meetingParticipantIds(meeting).filter(id => id !== meeting.personId);
  const next = participants.includes(personId)
    ? participants.filter(id => id !== personId)
    : [...participants, personId];
  meeting.participants = next;
  saveData(data);
  render();
}

function toggleMeetingTeamFlag(meetingId, checked) {
  const meeting = data.meetings.find(entry => entry.id === meetingId);
  if (!meeting || meeting.type === 'oneOnOne') return;
  meeting.isTeamMeeting = checked;
  if (!checked) meeting.participants = [];
  saveData(data);
  render();
}

// ---- Prep bullet editor ----
let draggedPrepBulletIndex = null;

function autoResizePrepBullet(el) {
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}

function renderPrepBulletList(meetingId, bullets) {
  if (!bullets.length) return `<div class="prep-empty">Noch keine Punkte</div>`;
  return bullets.map((b, idx) => `
    <div class="prep-bullet ${b.done ? 'prep-bullet-done' : ''}" data-prep-index="${idx}"
      ondragover="prepBulletDragOver(event)" ondragleave="prepBulletDragLeave(event)"
      ondrop="dropPrepBullet(event, '${meetingId}', ${idx})">
      <button class="prep-bullet-drag" draggable="true"
        title="Ziehen zum Verschieben · Alt+Pfeiltasten"
        aria-label="Punkt ${idx + 1} verschieben"
        ondragstart="startPrepBulletDrag(event, ${idx})"
        ondragend="endPrepBulletDrag(event)"
        onkeydown="prepBulletMoveKey(event, '${meetingId}', ${idx})">&#8942;&#8942;</button>
      <input type="checkbox" ${b.done ? 'checked' : ''} onchange="togglePrepBullet('${meetingId}', ${idx})">
      <textarea class="prep-bullet-input" rows="1"
        placeholder="Gedanke, Frage, Info... (Shift+Enter für Zeilenumbruch)"
        oninput="autoResizePrepBullet(this)"
        onchange="editPrepBullet('${meetingId}', ${idx}, this.value)"
        onkeydown="prepBulletKey(event, '${meetingId}', ${idx})">${esc(b.text)}</textarea>
      <button class="prep-bullet-delete" onclick="deletePrepBullet('${meetingId}', ${idx})" title="Löschen">&#x2715;</button>
    </div>
  `).join('');
}

function renderPrepCarryovers(meeting) {
  const carryovers = openPrepCarryovers(meeting);
  if (!carryovers.length) return '';
  return `
    <div class="prep-carryover">
      <div class="prep-carryover-head">offen aus früheren meetings <span>${carryovers.length}</span></div>
      ${carryovers.map(item => `
        <div class="prep-carryover-row">
          <input type="checkbox" onchange="toggleCarriedPrepBullet('${item.sourceMeeting.id}', ${item.index})">
          <span class="prep-carryover-text">${esc(item.text)}</span>
          <button class="prep-carryover-source" onclick="openMeetingDetail('${item.sourceMeeting.id}')">${formatDate(item.sourceMeeting.date)}</button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderPrepBullets(meetingId) {
  const m = data.meetings.find(x => x.id === meetingId);
  return renderPrepBulletList(meetingId, m ? parsePrepBullets(m.prep) : []);
}

function readPrepBulletsFromDOM() {
  const section = document.getElementById('prepBullets');
  if (!section) return [];
  const rows = section.querySelectorAll('.prep-bullet');
  return Array.from(rows).map(row => ({
    text: row.querySelector('.prep-bullet-input').value,
    done: row.querySelector('input[type=checkbox]').checked,
  }));
}

function commitPrepBullets(meetingId, bullets) {
  const m = data.meetings.find(x => x.id === meetingId);
  if (!m) return;
  m.prep = serializePrepBullets(bullets);
  saveData(data);
}

function toggleCarriedPrepBullet(sourceMeetingId, idx) {
  const source = data.meetings.find(meeting => meeting.id === sourceMeetingId);
  if (!source) return;
  const bullets = parsePrepBullets(source.prep);
  if (!bullets[idx]) return;
  bullets[idx].done = !bullets[idx].done;
  source.prep = serializePrepBullets(bullets);
  saveData(data);
  render();
}

function startPrepBulletDrag(event, idx) {
  draggedPrepBulletIndex = idx;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', String(idx));
  event.currentTarget.closest('.prep-bullet')?.classList.add('prep-bullet-dragging');
}

function endPrepBulletDrag() {
  draggedPrepBulletIndex = null;
  document.querySelectorAll('.prep-bullet').forEach(row => row.classList.remove('prep-bullet-dragging', 'prep-bullet-drop-before', 'prep-bullet-drop-after'));
}

function prepBulletDragOver(event) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  const row = event.currentTarget;
  const after = event.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2;
  row.classList.toggle('prep-bullet-drop-before', !after);
  row.classList.toggle('prep-bullet-drop-after', after);
}

function prepBulletDragLeave(event) {
  event.currentTarget.classList.remove('prep-bullet-drop-before', 'prep-bullet-drop-after');
}

function movePrepBullet(meetingId, fromIdx, toIdx) {
  const bullets = readPrepBulletsFromDOM();
  if (!bullets[fromIdx] || fromIdx === toIdx) return;
  const [moved] = bullets.splice(fromIdx, 1);
  bullets.splice(toIdx, 0, moved);
  commitPrepBullets(meetingId, bullets);
  renderPrepBulletsWith(meetingId, bullets, toIdx);
}

function dropPrepBullet(event, meetingId, targetIdx) {
  event.preventDefault();
  const fromIdx = Number(event.dataTransfer.getData('text/plain') || draggedPrepBulletIndex);
  const after = event.clientY > event.currentTarget.getBoundingClientRect().top + event.currentTarget.offsetHeight / 2;
  let toIdx = targetIdx + (after ? 1 : 0);
  if (fromIdx < toIdx) toIdx--;
  movePrepBullet(meetingId, fromIdx, toIdx);
  endPrepBulletDrag();
}

function prepBulletMoveKey(event, meetingId, idx) {
  if (!event.altKey || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
  event.preventDefault();
  const target = idx + (event.key === 'ArrowUp' ? -1 : 1);
  const bullets = readPrepBulletsFromDOM();
  if (target < 0 || target >= bullets.length) return;
  movePrepBullet(meetingId, idx, target);
}

function renderPrepBulletsWith(meetingId, bullets, focusIdx) {
  const section = document.getElementById('prepBullets');
  if (!section) return;
  section.innerHTML = renderPrepBulletList(meetingId, bullets);
  section.querySelectorAll('.prep-bullet-input').forEach(autoResizePrepBullet);
  if (focusIdx !== undefined && focusIdx !== null) {
    const inputs = section.querySelectorAll('.prep-bullet-input');
    const target = inputs[focusIdx];
    if (target) {
      target.focus();
      const v = target.value;
      target.setSelectionRange(v.length, v.length);
    }
  }
}

function togglePrepBullet(meetingId, idx) {
  const bullets = readPrepBulletsFromDOM();
  if (!bullets[idx]) return;
  commitPrepBullets(meetingId, bullets);
  renderPrepBulletsWith(meetingId, bullets);
}

function editPrepBullet(meetingId, idx, value) {
  const bullets = readPrepBulletsFromDOM();
  if (!bullets[idx]) return;
  bullets[idx].text = value;
  commitPrepBullets(meetingId, bullets);
}

function deletePrepBullet(meetingId, idx) {
  const bullets = readPrepBulletsFromDOM();
  bullets.splice(idx, 1);
  commitPrepBullets(meetingId, bullets);
  renderPrepBulletsWith(meetingId, bullets, Math.max(0, idx - 1));
}

function addPrepBullet(meetingId) {
  const bullets = readPrepBulletsFromDOM();
  bullets.push({ text: '', done: false });
  commitPrepBullets(meetingId, bullets);
  renderPrepBulletsWith(meetingId, bullets, bullets.length - 1);
}

function prepBulletKey(event, meetingId, idx) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    const bullets = readPrepBulletsFromDOM();
    bullets.splice(idx + 1, 0, { text: '', done: false });
    commitPrepBullets(meetingId, bullets);
    renderPrepBulletsWith(meetingId, bullets, idx + 1);
  } else if (event.key === 'Backspace' && !event.target.value) {
    event.preventDefault();
    const bullets = readPrepBulletsFromDOM();
    if (bullets.length <= 1 && !bullets[0]?.text) return;
    bullets.splice(idx, 1);
    commitPrepBullets(meetingId, bullets);
    renderPrepBulletsWith(meetingId, bullets, Math.max(0, idx - 1));
  }
}

function initPrepBulletsAutoResize() {
  const section = document.getElementById('prepBullets');
  if (!section) return;
  section.querySelectorAll('.prep-bullet-input').forEach(autoResizePrepBullet);
}

// ---- Insights ----
function renderMeetingInsights(m) {
  const today = todayStr();
  const referenceDate = m.date || today;
  const parts = [];

  const items = meetingItems(m.id);
  if (items.length) {
    const done = items.filter(i => i.status === 'done').length;
    const open = items.length - done;
    const pct = Math.round((done / items.length) * 100);
    parts.push(`<div class="insight-row"><span class="insight-label">Follow-ups</span><span class="insight-value">${done}/${items.length} erledigt (${pct}%)${open ? ` · ${open} offen` : ''}</span></div>`);
  }

  if (m.type !== 'oneOnOne' && m.title) {
    const sameTitle = data.meetings
      .filter(x => x.title === m.title && x.id !== m.id);
    if (sameTitle.length) {
      const prior = sameTitle
        .filter(x => x.date && m.date && x.date < m.date)
        .sort((a, b) => b.date.localeCompare(a.date))[0];
      const total = sameTitle.length + 1;
      parts.push(`<div class="insight-row"><span class="insight-label">serie</span><span class="insight-value">${total}× insgesamt${prior ? ` · <a href="#" onclick="event.preventDefault();navigate('meetings:detail', {meetingId:'${prior.id}'})">vorheriges am ${formatDate(prior.date)}</a>` : ''}</span></div>`);
    }
  }

  if (m.type === 'oneOnOne' && m.personId) {
    const person = data.persons.find(p => p.id === m.personId);
    if (person?.pushDirection) {
      parts.push(`<div class="insight-row insight-row-push"><span class="insight-label">Push</span><span class="insight-value">${esc(person.pushDirection)}</span></div>`);
    }

    const prior = data.meetings
      .filter(x => x.type === 'oneOnOne' && x.personId === m.personId && x.id !== m.id && x.date && x.date < referenceDate)
      .sort((a, b) => b.date.localeCompare(a.date))[0];
    if (prior) {
      const gap = Math.round((parseISO(referenceDate) - parseISO(prior.date)) / 86400000);
      parts.push(`<div class="insight-row"><span class="insight-label">seit letztem 1:1</span><span class="insight-value">${gap} Tage · <a href="#" onclick="event.preventDefault();navigate('meetings:detail', {meetingId:'${prior.id}'})">${formatDate(prior.date)}</a></span></div>`);
    }
  }

  if (!parts.length) return '';
  return `
    <div class="meeting-detail-section">
      <h3>Insights</h3>
      <div class="insights-list">${parts.join('')}</div>
    </div>
  `;
}

const personFieldSaveTimers = {};

function updatePersonFieldDebounced(id, field, value) {
  const p = data.persons.find(p => p.id === id);
  if (!p) return;
  p[field] = value;
  const timerKey = `${id}:${field}`;
  clearTimeout(personFieldSaveTimers[timerKey]);
  personFieldSaveTimers[timerKey] = setTimeout(() => {
    saveData(data);
  }, 250);
}

// ============================================================
// REVIEWS VIEW
// ============================================================
// Bei woechentlichem Rhythmus ist "wann war das letzte 1:1" kein Signal mehr —
// die Antwort ist immer "diese Woche". Interessant ist die Gegenrichtung: steht
// das naechste schon, und was ist bis dahin liegengeblieben.
function personNextOneOnOne(personId) {
  const today = todayStr();
  return data.meetings
    .filter(meeting => meeting.type === 'oneOnOne'
      && meeting.personId === personId
      && meeting.date
      && meeting.date >= today)
    .sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}

// Ein angelegtes, aber noch nicht terminiertes 1:1. Zaehlt nicht als geplant,
// darf aber auch kein zweites nach sich ziehen.
function personUnscheduledOneOnOne(personId) {
  return data.meetings.find(meeting =>
    meeting.type === 'oneOnOne' && meeting.personId === personId && !meeting.date) || null;
}

// Ein Klick, egal in welchem Zustand das naechste Gespraech steckt: geplantes
// oeffnen, undatiertes einplanen, sonst gleich ein neues anlegen.
function openNextOneOnOne(personId) {
  const next = personNextOneOnOne(personId);
  if (next) { openMeetingDetail(next.id); return; }
  const draft = personUnscheduledOneOnOne(personId);
  if (draft) { openScheduleMeetingDate(draft.id); return; }
  openMeetingForm('oneOnOne', personId);
}

function oneOnOneDueLabel(dateISO) {
  if (!dateISO) return 'ohne datum';
  const days = Math.round((parseISO(dateISO) - parseISO(todayStr())) / 86400000);
  if (days === 0) return 'heute';
  if (days === 1) return 'morgen';
  if (days <= 7) {
    const weekday = new Date(`${dateISO}T12:00:00`).toLocaleDateString('de-AT', { weekday: 'short' }).replace('.', '');
    return `${weekday.toLowerCase()} · in ${days} tagen`;
  }
  return `in ${days} tagen`;
}

function personAbsenceOnDate(personId, date) {
  return data.blocks.find(block =>
    block.personId === personId &&
    block.typ === 'abwesenheit' &&
    block.start <= date &&
    block.end >= date
  ) || null;
}

// Sortierung der Karten. Bewusst nur aus dem, was die Karte selbst zeigt —
// eine unsichtbare Rangfolge waere nicht nachvollziehbar. Freie Werktage und
// Todo-Zahlen fehlen: die stehen in Planung und Todos.
// "Nichts geplant" greift erst, wenn wirklich nichts da ist: wer Montag
// anfaengt, hat einen kommenden Block und stand sonst trotzdem ganz oben,
// waehrend die Karte darunter brav "ab 03.08." anzeigte.
function teamFocusScore(entry) {
  const nothingPlanned = !entry.activeBlocks.length
    && !entry.upcomingBlocks.length
    && !entry.overdueBlocks.length;
  return (nothingPlanned && !entry.absenceToday ? 30 : 0)
    + (entry.overdueBlocks.length * 20)
    + (entry.oneOnOneMissing ? 24 : 0)
    + (entry.drift ? (entry.drift.stale.length * 16) + (entry.drift.unplanned.length * 6) + (entry.drift.renamed.length * 3) : 0);
}

</script>
<script data-source="./js/notes.js">
// ============================================================
// NOTES
// ============================================================
const noteSaveTimers = {};

function formatNoteUpdatedAt(value) {
  const date = String(value || '').slice(0, 10);
  return date ? formatDate(date) : '';
}

function noteMatches(note, query) {
  if (!query) return true;
  return [note.title, note.text].some(value => includesQuery(value, query));
}

function renderNotes() {
  const sudo = isSudoMode();
  const rawQuery = viewState.notesQuery || '';
  const query = rawQuery.trim().toLocaleLowerCase('de-AT');
  const allNotes = (data.notes || []).slice().sort((a, b) =>
    (b.updatedAt || b.createdAt || '').localeCompare(a.updatedAt || a.createdAt || '')
  );
  const notes = allNotes.filter(note => noteMatches(note, query));

  if (!sudo) {
    return `
      <div class="section-header notes-page-head">
        <div class="overview-toolbar">
          <span class="section-title">Notizen</span>
        </div>
      </div>
      <p class="notes-page-intro">Langfristige Pläne, Beobachtungen und Dokumentationen, die keinem einzelnen Todo oder Meeting gehören.</p>
      ${sudoLockedPlaceholder('Notizen')}
    `;
  }

  return `
    <div class="section-header notes-page-head">
      <div class="overview-toolbar">
        <span class="section-title">Notizen</span>
        <div class="view-search">
          <input id="notesSearchInput" type="search" placeholder="grep: titel, inhalt..."
            value="${esc(rawQuery)}" oninput="setNotesQuery(this.value)">
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openNoteForm()">+ Notiz</button>
    </div>
    <p class="notes-page-intro">Langfristige Pläne, Beobachtungen und Dokumentationen, die keinem einzelnen Todo oder Meeting gehören.</p>

    ${notes.length ? `
      <div class="notes-grid">
        ${notes.map(note => renderNoteCard(note)).join('')}
      </div>
    ` : `
      <div class="empty-state">
        <div class="empty-state-text">${query ? 'Keine passenden Notizen' : 'Noch keine Notizen'}</div>
      </div>
    `}
  `;
}

function renderNoteCard(note) {
  return `
    <article class="note-card ${viewState.focusNoteId === note.id ? 'is-focused' : ''}" id="note-${note.id}">
      <div class="note-toolbar">
        <input class="note-title" value="${esc(note.title || '')}"
          aria-label="Titel der Notiz"
          oninput="updateNoteDebounced('${note.id}','title',this.value)"
          onchange="saveNoteField('${note.id}','title',this.value)">
        <button class="btn btn-sm btn-secondary" onclick="deleteNote('${note.id}')">löschen</button>
      </div>
      <textarea class="form-textarea note-editor"
        placeholder="Beobachtungen, Daten, Vorkommnisse, nächste Schritte..."
        oninput="updateNoteDebounced('${note.id}','text',this.value)"
        onchange="saveNoteField('${note.id}','text',this.value)">${esc(note.text || '')}</textarea>
      <div class="note-meta">zuletzt geändert ${formatNoteUpdatedAt(note.updatedAt) || '—'}</div>
    </article>
  `;
}

function openNoteForm() {
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">Neue Notiz</span>
      <button class="modal-close" onclick="closeOverlay()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Titel</label>
        <input class="form-input" id="newNoteTitle" placeholder="Titel der Notiz" autofocus
          onkeydown="if(event.key==='Enter'){createNote()}">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="createNote()">Notiz anlegen</button>
    </div>
  `;
  openOverlay();
}

function createNote() {
  const title = document.getElementById('newNoteTitle')?.value.trim();
  if (!title) { toast('Titel nötig'); return; }
  const timestamp = new Date().toISOString();
  const note = { id: uid(), title, text: '', createdAt: timestamp, updatedAt: timestamp };
  data.notes.push(note);
  saveData(data);
  closeOverlay();
  navigate('notizen', { focusNoteId: note.id });
}

function setNotesQuery(value) {
  const input = document.getElementById('notesSearchInput');
  pendingNotesSearchSelection = input
    ? { start: input.selectionStart, end: input.selectionEnd }
    : { start: value.length, end: value.length };
  viewState.notesQuery = value;
  render();
}

function restoreNotesSearchFocus() {
  if (currentView !== 'notizen' || !pendingNotesSearchSelection) return;
  const input = document.getElementById('notesSearchInput');
  if (!input) return;
  const selection = pendingNotesSearchSelection;
  pendingNotesSearchSelection = null;
  input.focus({ preventScroll: true });
  input.setSelectionRange(selection.start ?? input.value.length, selection.end ?? input.value.length);
}

function updateNoteDebounced(id, field, value) {
  const note = data.notes.find(entry => entry.id === id);
  if (!note) return;
  note[field] = value;
  note.updatedAt = new Date().toISOString();
  clearTimeout(noteSaveTimers[id]);
  noteSaveTimers[id] = setTimeout(() => saveData(data), 300);
}

function saveNoteField(id, field, value) {
  const note = data.notes.find(entry => entry.id === id);
  if (!note) return;
  note[field] = value;
  note.updatedAt = new Date().toISOString();
  clearTimeout(noteSaveTimers[id]);
  saveData(data);
}

function deleteNote(id) {
  const note = data.notes.find(entry => entry.id === id);
  if (!note || !confirm(`Notiz „${note.title || 'Unbenannt'}“ löschen?`)) return;
  clearTimeout(noteSaveTimers[id]);
  data.notes = data.notes.filter(entry => entry.id !== id);
  saveData(data);
  render();
}

function initNotesView() {
  const id = viewState.focusNoteId;
  if (!id) return;
  const card = document.getElementById(`note-${id}`);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.querySelector('.note-editor')?.focus({ preventScroll: true });
  viewState.focusNoteId = null;
}

</script>
<script data-source="./js/dashboard.js">
// ============================================================
// DASHBOARD / REVIEWS
// ============================================================
function renderReviewItemList(items, emptyText) {
  if (!items.length) return `<div style="color:var(--text-muted);font-size:14px">${emptyText}</div>`;
  return `<ul class="item-list">${items.map(item => renderItem(item)).join('')}</ul>`;
}

function renderReviewMeetingList(meetings, emptyText) {
  const rows = meetings.map(meeting => {
    const linkedCount = meetingItems(meeting.id).length;
    const date = meeting.date ? new Date(`${meeting.date}T12:00:00`) : null;
    const weekday = date ? date.toLocaleDateString('de-AT', { weekday: 'short' }).replace('.', '') : '';
    const day = date ? String(date.getDate()).padStart(2, '0') : '--';
    const metaDate = meeting.date ? formatDate(meeting.date) : 'ohne Datum';
    return `
      <div class="review-meeting-row" onclick="navigate('meetings:detail', {meetingId:'${meeting.id}'})">
        <div class="review-meeting-badge">
          <div class="review-meeting-badge-weekday">${esc(weekday)}</div>
          <div class="review-meeting-badge-day">${day}</div>
        </div>
        <div class="review-meeting-main">
          <div class="review-row-title">${meetingDisplayTitle(meeting)}</div>
          <div class="review-row-meta">
            ${meeting.personId ? '@' + esc(personName(meeting.personId)) + ' · ' : ''}${metaDate}
          </div>
        </div>
        <div class="review-row-side">
          ${meeting.date
            ? `${linkedCount} Follow-up${linkedCount === 1 ? '' : 's'}`
            : `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openScheduleMeetingDate('${meeting.id}')">Einplanen</button>`}
        </div>
      </div>
    `;
  });
  return renderReviewScheduleList(rows, emptyText);
}

function reviewMarkerRelativeLabel(date) {
  const diff = Math.round((parseISO(date) - parseISO(todayStr())) / 86400000);
  if (diff === 0) return 'heute';
  if (diff === 1) return 'morgen';
  if (diff <= 13) return `in ${diff} Tagen`;
  const weeks = Math.round(diff / 7);
  return `in ${weeks} Wochen`;
}

function renderReviewMarkerList(markers, emptyText) {
  const rows = markers.map(marker => {
    const date = marker.date ? new Date(`${marker.date}T12:00:00`) : null;
    const weekday = date ? date.toLocaleDateString('de-AT', { weekday: 'short' }).replace('.', '') : '';
    const day = date ? String(date.getDate()).padStart(2, '0') : '--';
    const color = marker.color || 'var(--accent)';
    return `
      <div class="review-meeting-row review-marker-row" onclick="openMarkerForm('${marker.id}')" style="--marker-color:${esc(color)}">
        <div class="review-meeting-badge review-marker-badge">
          <div class="review-meeting-badge-weekday">${esc(weekday)}</div>
          <div class="review-meeting-badge-day">${day}</div>
        </div>
        <div class="review-meeting-main">
          <div class="review-row-title">${esc(marker.label || 'Marker')}</div>
          <div class="review-row-meta">${marker.date ? formatDate(marker.date) : 'ohne Datum'}</div>
        </div>
        <div class="review-row-side review-marker-side">${marker.date ? reviewMarkerRelativeLabel(marker.date) : ''}</div>
      </div>
    `;
  });
  return renderReviewScheduleList(rows, emptyText);
}

function renderReviewScheduleList(rows, emptyText) {
  return `
    <div class="review-schedule-list">
      ${rows.length
        ? rows.join('')
        : `<div class="review-schedule-empty">${emptyText}</div>`}
    </div>
  `;
}

function itemStatusLabel(status) {
  return ({
    todo: 'todo',
    backlog: 'backlog',
    waiting: 'wartet',
    done: 'done',
  })[status] || status;
}

function reviewDueRelativeLabel(itemDate, today) {
  if (!itemDate) return '';
  if (itemDate === today) return 'heute';
  const days = Math.round((parseISO(today) - parseISO(itemDate)) / 86400000);
  if (days === 1) return 'seit gestern';
  return `seit ${days} Tagen`;
}

function renderReviewDueItem(item, tone) {
  const today = todayStr();
  const linkedMeeting = item.meetingId ? data.meetings.find(meeting => meeting.id === item.meetingId) : null;
  const notesPreview = previewText(item.notes);
  return `
    <li class="review-due-item review-due-item-${tone}">
      <button class="review-due-item-main" onclick="openEditItem('${item.id}')">
        <span class="review-due-item-date">
          <span class="review-due-item-day">${formatDateShort(item.date)}</span>
          <span class="review-due-item-age">${reviewDueRelativeLabel(item.date, today)}</span>
        </span>
        <span class="review-due-item-body">
          <span class="review-due-item-title">${esc(item.text)}</span>
          ${notesPreview ? `<span class="review-due-item-notes">${esc(notesPreview)}</span>` : ''}
          <span class="review-due-item-meta">
            <span class="badge badge-${item.status}">${itemStatusLabel(item.status)}</span>
            ${item.personId ? `<span>@${esc(personName(item.personId))}</span>` : ''}
            ${linkedMeeting ? `<span>${meetingDisplayTitle(linkedMeeting)}</span>` : ''}
          </span>
        </span>
      </button>
      <button class="review-due-item-check" onclick="event.stopPropagation();toggleItem('${item.id}')" title="Erledigt">&#10003;</button>
    </li>
  `;
}

function renderReviewDueList(items) {
  if (!items.length) return `<div style="color:var(--text-muted);font-size:14px">Keine fälligen Items</div>`;
  const today = todayStr();
  const overdue = items.filter(item => item.date && item.date < today);
  const todayDue = items.filter(item => item.date === today);
  const sections = [
    {
      key: 'overdue',
      title: 'Überfällig',
      hint: overdue.length ? 'Braucht direkte Aufmerksamkeit' : 'Nichts überfällig',
      items: overdue,
      tone: 'danger',
    },
    {
      key: 'today',
      title: 'Fällig',
      hint: todayDue.length ? 'Heute geplant oder fällig' : 'Heute nichts fällig',
      items: todayDue,
      tone: 'warning',
    },
  ];
  return `
    <div class="review-due-panel">
      <div class="review-due-sections">
        ${sections.map(section => `
          <div class="review-due-section review-due-section-${section.tone}">
            <div class="review-due-section-head">
              <div>
                <div class="review-due-section-title">${section.title}</div>
                <div class="review-due-section-hint">${section.hint}</div>
              </div>
              <span class="review-due-section-count">${section.items.length}</span>
            </div>
            ${section.items.length
              ? `<ul class="review-due-item-list">${section.items.map(item => renderReviewDueItem(item, section.tone)).join('')}</ul>`
              : '<div class="review-due-empty">Keine Items</div>'}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function dashboardLinkKind(link) {
  const value = `${link.kind || ''} ${link.title || ''} ${link.url || ''}`.toLocaleLowerCase('de-AT');
  if (value.includes('jira') || value.includes('atlassian')) return 'jira';
  if (value.includes('gitlab')) return 'gitlab';
  return 'link';
}

function dashboardLinkHost(url) {
  const href = normalizeExternalUrl(url);
  if (!href) return '';
  try {
    return new URL(href).hostname.replace(/^www\./, '');
  } catch {
    return href.replace(/^https?:\/\//i, '').split('/')[0];
  }
}

function dashboardLinkInitial(link) {
  return (link.title || 'L').trim().slice(0, 1).toUpperCase();
}

function renderDashboardLinkMark(link) {
  const kind = dashboardLinkKind(link);
  if (kind === 'jira' || kind === 'gitlab') return memberLinkIcon(kind);
  return esc(dashboardLinkInitial(link));
}

function renderDashboardLinks() {
  const links = (data.dashboardLinks || []).filter(link => link.title && link.url);
  return `
    <div class="dashboard-links">
      ${links.length ? links.map(link => {
        const href = normalizeExternalUrl(link.url);
        const kind = dashboardLinkKind(link);
        return `
          <div class="dashboard-link dashboard-link-${kind}">
            <a class="dashboard-link-main" href="${esc(href)}" target="_blank" rel="noopener noreferrer">
              <span class="dashboard-link-mark">${renderDashboardLinkMark(link)}</span>
              <span class="dashboard-link-title">${esc(link.title)}</span>
            </a>
            <button class="dashboard-link-edit" type="button" onclick="openDashboardLinkForm('${link.id}')" title="Link bearbeiten">&#9998;</button>
          </div>
        `;
      }).join('') : `
        <button class="dashboard-link-empty" onclick="openDashboardLinkForm()">
          <span class="dashboard-link-mark">+</span>
          <span class="dashboard-link-title">Ersten Link hinzufügen</span>
        </button>
      `}
      <button class="dashboard-link-add" onclick="openDashboardLinkForm()" title="Quick Link hinzufügen">+</button>
    </div>
  `;
}

function renderDashboardReviewAction() {
  const count = monthReviewMonths().length;
  return `
    <button class="btn btn-secondary btn-sm dashboard-review-action" onclick="openMonthReviewsArchive()" title="Frühere Monatsrückblicke ansehen">
      <span>monatsrückblicke</span>
      <span class="dashboard-review-count">${count}</span>
    </button>
  `;
}

// Muss zur max-height von .tf-blocks-list passen: so viele Zeilen stehen ohne
// Scrollen da, der Rest wird als "+n" angekuendigt.
const TF_VISIBLE_BLOCKS = 3;

function ticketCountLabel(count) {
  return `${count} ${count === 1 ? 'ticket' : 'tickets'}`;
}

// Die Zahl am Avatar zaehlt nicht die Arbeit, sondern den Handlungsbedarf:
// ueberfaellige Bloecke plus Jira-Drift. Zehn saubere Tickets sind kein
// Signal, ein ueberfaelliger Block ist eines — und nur das gehoert an den
// Avatar, der aus drei Metern Abstand noch lesbar ist.
function teamFocusAttentionBadge(entry) {
  const drift = entry.drift;
  const parts = [
    entry.overdueBlocks.length ? `${entry.overdueBlocks.length} überfällig` : '',
    drift?.unplanned.length ? `${drift.unplanned.length} ohne block` : '',
    drift?.stale.length ? `${drift.stale.length} ${drift.stale.length === 1 ? 'block' : 'blocks'} veraltet` : '',
  ].filter(Boolean);
  // Nichts offen heisst kein Badge: eine 0 waere nur Rauschen, und der ruhige
  // Avatar ist selbst die Aussage.
  if (!parts.length) return {};
  const count = entry.overdueBlocks.length + (drift?.unplanned.length || 0) + (drift?.stale.length || 0);
  return {
    count,
    // Ueberfaellig und veraltet sind Fehler, ein ungeplantes Ticket ist bloss
    // noch nicht eingeplant — das darf nicht gleich aussehen.
    countTone: entry.overdueBlocks.length || drift?.stale.length ? 'bad' : 'warn',
    countTitle: parts.join(' · '),
  };
}

// "urlaub bis 12.08." — ohne das Enddatum weiss man nur, dass jemand heute
// weg ist, nicht ob man morgen wieder mit ihm rechnen kann.
function teamFocusAbsenceLabel(absence) {
  const label = (absence.label || 'abwesend').toLocaleLowerCase('de-AT');
  return absence.end ? `${label} bis ${formatDateShort(absence.end)}` : label;
}

// Haengt das Ticket hinter dem Block in einem Uebergabe-Status (Review, QA),
// dann ist die Person fertig und wartet auf jemand anderen. Fuer die Frage
// "wen muss ich anstossen" ist das eine andere Antwort als "arbeitet dran".
function teamFocusBlockHandoverStatus(block) {
  if (!block.jiraRef) return '';
  const ref = jiraStatusForBlock(block);
  return ref && isJiraHandoverStatus(ref.status) ? String(ref.status || '') : '';
}

// Woran die Person arbeitet und was als naechstes kommt. Ein Klick fuehrt in
// die Planung.
function renderTeamFocusBlockRow(block, kind) {
  const handover = kind === 'active' ? teamFocusBlockHandoverStatus(block) : '';
  const canOpenJira = !!jiraUrl(block.jiraRef);
  const timing = kind === 'overdue' ? `seit ${formatDateShort(block.end)}`
    : kind === 'upcoming' ? `ab ${formatDateShort(block.start)}`
    : handover ? 'wartet'
    : `noch ${workdaysBetween(todayStr(), block.end)} wt`;
  const state = kind === 'overdue' ? 'überfällig — nicht erledigt'
    : handover ? `wartet auf ${handover}`
    : '';
  const title = [
    `${block.label || 'Block'} · ${formatDate(block.start)} – ${formatDate(block.end)}`,
    state,
    canOpenJira ? `Jira: ${block.jiraRef} (Cmd/Strg-Klick öffnet)` : '',
  ].filter(Boolean).join('\n');
  return `
    <button class="tf-block tf-block-${kind} ${handover ? 'tf-block-handover' : ''}" type="button" onclick="if((event.metaKey||event.ctrlKey)&&openBlockJira('${block.id}'))return;navigateToPlanungBlock('${block.id}')" title="${esc(title)}">
      <span class="tf-block-mark"></span>
      <span class="tf-block-body">
        <span class="tf-block-title">${esc(block.label || 'Block')}</span>
        ${block.jiraRef ? `<span class="tf-block-ref">${esc(block.jiraRef)}</span>` : ''}
      </span>
      <span class="tf-block-timing">${esc(timing)}</span>
    </button>
  `;
}

// Alle Bloecke, aber ab dem vierten scrollt die Liste in sich. So zieht ein
// Teammitglied mit sieben Bloecken die Nachbarkarte nicht in die Laenge, und
// trotzdem geht nichts verloren. Laufende stehen vor kommenden.
function renderTeamFocusBlocks(entry) {
  // Ueberfaellige zuerst: sie sind das einzige, was hier eine Handlung
  // erzwingt, und wuerden sonst im Scrollbereich verschwinden.
  const blocks = [
    ...entry.overdueBlocks.map(block => ({ block, kind: 'overdue' })),
    ...entry.activeBlocks.map(block => ({ block, kind: 'active' })),
    ...entry.upcomingBlocks.map(block => ({ block, kind: 'upcoming' })),
  ];
  const empty = entry.absenceToday
    ? `${esc(teamFocusAbsenceLabel(entry.absenceToday))} · nichts geplant`
    : 'nichts geplant';
  // Drei Zeilen sind sichtbar. Dass darunter noch etwas liegt, sieht man sonst
  // erst beim Scrollen — der Hinweis steht deshalb unten am Schnitt, wo man
  // hinschaut, nicht oben in der Kopfzeile.
  const hidden = Math.max(0, blocks.length - TF_VISIBLE_BLOCKS);
  return `
    <div class="tf-blocks${hidden ? ' tf-blocks-more' : ''}">
      <div class="tf-blocks-head">
        <span>Arbeitet an${blocks.length > 1 ? ` <span class="tf-blocks-count">${blocks.length}</span>` : ''}</span>
        <button class="tf-blocks-link" type="button" onclick="navigate('planung')">planung öffnen</button>
      </div>
      <div class="tf-blocks-scroll">
        <div class="tf-blocks-list">
          ${blocks.length
            ? blocks.map(({ block, kind }) => renderTeamFocusBlockRow(block, kind)).join('')
            : `<div class="tf-blocks-empty">${empty}</div>`}
        </div>
      </div>
      ${hidden ? `<div class="tf-blocks-hint">+${hidden} ${hidden === 1 ? 'weiterer' : 'weitere'} ↓</div>` : ''}
    </div>
  `;
}

function renderTeamFocusJiraMetric(entry) {
  if (!jiraSyncData) return '';
  if (entry.jiraTickets === null) {
    return `
      <button class="tf-metric tf-metric-action" type="button" onclick="event.preventDefault(); event.stopPropagation(); openPersonForm('${entry.person.id}')" title="jira-user im Profil ergänzen">
        <span class="tf-metric-label">Jira</span>
        <span class="tf-metric-value">&ndash;</span>
        <span class="tf-metric-note">kein jira-user</span>
      </button>`;
  }
  const drift = entry.drift;
  const driftParts = [];
  if (drift.unplanned.length) driftParts.push(`${drift.unplanned.length} nicht eingeplant`);
  if (drift.stale.length) driftParts.push(`${drift.stale.length} ${drift.stale.length === 1 ? 'block' : 'blocks'} veraltet`);
  const driftDetail = [
    drift.unplanned.length ? `Ohne Block: ${drift.unplanned.map(t => t.key).join(', ')}` : '',
    drift.stale.length ? `Veraltet: ${drift.stale.map(b => `${b.label || b.jiraRef} (${b.jiraRef})`).join(', ')}` : '',
  ].filter(Boolean).join('\n');
  const jiraSig = drift.stale.length ? 'tf-sig-bad' : drift.unplanned.length ? 'tf-sig-warn' : 'tf-sig-ok';
  return `
    <button class="tf-metric tf-metric-action ${jiraSig}" type="button" onclick="event.preventDefault(); event.stopPropagation(); openPersonById('${entry.person.id}')" title="${esc(`Jira-Tickets von ${entry.person.name} ansehen (Stand: ${jiraSyncAgeLabel() || 'unbekannt'})${driftDetail ? '\n' + driftDetail : ''}`)}">
      <span class="tf-metric-label">Jira</span>
      <span class="tf-metric-value">${entry.jiraTickets.length ? ticketCountLabel(entry.jiraTickets.length) : 'keine tickets'}</span>
      ${driftParts.length ? `<span class="tf-metric-note">${driftParts.join(' · ')}</span>` : ''}
    </button>`;
}

// Vorschau statt Rueckschau: bei woechentlichem Rhythmus ist "wann war das
// letzte" immer dieselbe Antwort. Der Klick fuehrt in jedem Zustand ans Ziel —
// notfalls legt er das Gespraech gleich an.
function renderTeamFocusOneOnOneMetric(entry) {
  const meeting = entry.nextOneOnOne || entry.unscheduledOneOnOne
    || { id: '', type: 'oneOnOne', personId: entry.person.id, date: todayStr() };
  const carryover = carryoverCount(oneOnOneCarryover(meeting));
  const value = entry.nextOneOnOne
    ? oneOnOneDueLabel(entry.nextOneOnOne.date)
    : entry.unscheduledOneOnOne ? 'nicht terminiert' : 'keines geplant';
  const note = carryover
    ? `${carryover} mitzunehmen`
    : entry.nextOneOnOne ? 'nichts offen' : 'anlegen';
  const title = entry.nextOneOnOne ? 'Nächstes 1:1 öffnen'
    : entry.unscheduledOneOnOne ? '1:1 einplanen'
    : `Neues 1:1 mit ${entry.person.name} anlegen`;
  return `
    <button class="tf-metric tf-metric-action ${entry.nextOneOnOne ? 'tf-sig-ok' : 'tf-sig-warn'}" type="button" onclick="event.preventDefault(); event.stopPropagation(); openNextOneOnOne('${entry.person.id}')" title="${esc(title)}">
      <span class="tf-metric-label">1:1</span>
      <span class="tf-metric-value">${esc(value)}</span>
      <span class="tf-metric-note">${esc(note)}</span>
    </button>`;
}

function renderReviews() {
  const currentMonthLabel = currentMonth();
  const dueItems = data.items
    .filter(item => item.status !== 'done' && item.status !== 'backlog' && item.date && item.date <= todayStr())
    .sort(compareByDueDate);
  const upcomingMeetings = data.meetings
    .filter(meeting => meeting.type !== 'oneOnOne' && meeting.date && meeting.date >= todayStr())
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(0, 5);
  const upcomingMarkers = (data.markers || [])
    .filter(marker => marker.date && marker.date >= todayStr())
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(0, 5);
  const today = todayStr();
  const peopleAttention = data.persons
    .filter(person => person.type !== 'kontakt')
    .map(person => {
      const absenceToday = personAbsenceOnDate(person.id, today);
      const activeBlocks = personActiveBlocks(person.id, today);
      const overdueBlocks = personOverdueBlocks(person.id);
      // Ohne Fenster: die Liste scrollt ohnehin, und "ab 12.08." sagt mehr
      // als eine Stichtagsgrenze, die man nicht mehr einstellen kann.
      const upcomingBlocks = personUpcomingBlocks(person.id, today);
      const jiraTickets = jiraTicketsForPerson(person);
      const drift = jiraDriftForPerson(person);
      const nextOneOnOne = personNextOneOnOne(person.id);
      const unscheduledOneOnOne = nextOneOnOne ? null : personUnscheduledOneOnOne(person.id);
      const oneOnOneMissing = !nextOneOnOne;
      const entry = {
        person, absenceToday, activeBlocks, overdueBlocks, upcomingBlocks,
        jiraTickets, drift, nextOneOnOne, unscheduledOneOnOne, oneOnOneMissing,
      };
      entry.attentionScore = teamFocusScore(entry);
      entry.attentionLevel = entry.attentionScore >= 50 ? 'high' : entry.attentionScore >= 20 ? 'medium' : 'low';
      return entry;
    })
    .sort((a, b) => comparePersonsByName(a.person, b.person));

  return `
    <div class="section-header">
      ${renderDashboardLinks()}
      ${renderDashboardReviewAction()}
    </div>

    <div class="review-grid">
      <div class="card review-team-focus-card">
        <div class="card-header">
          <span class="card-title">Teamfokus</span>
        </div>
        <div class="review-team-focus-list">
        ${peopleAttention.length ? peopleAttention.map(entry => {
          const cardStateClass = entry.absenceToday ? 'absent' : entry.attentionLevel;
          const supportThisMonth = personSupportInMonth(entry.person, currentMonthLabel);
          return `
          <div class="tf-card tf-card-${cardStateClass}">
            <div class="tf-card-head">
              <button class="tf-person-link" type="button" onclick="openPersonById('${entry.person.id}')" title="Teammitglied öffnen">
                ${personAvatar(entry.person, 'md', { absent: !!entry.absenceToday, ...teamFocusAttentionBadge(entry) })}
              </button>
              <div class="tf-name-line">
                <button class="review-row-title tf-name-link" type="button" onclick="openPersonById('${entry.person.id}')" title="Teammitglied öffnen">${esc(entry.person.name)}</button>
                ${supportThisMonth ? `<span class="tl-sup-badge" title="Support ${esc(formatMonth(currentMonthLabel))}">sup</span>` : ''}
                ${entry.absenceToday ? `<span class="tf-absent-mark" title="${esc(`${entry.absenceToday.label || 'Abwesend'} · ${formatDate(entry.absenceToday.start)} – ${formatDate(entry.absenceToday.end)}`)}">${esc(teamFocusAbsenceLabel(entry.absenceToday))}</span>` : ''}
              </div>
            </div>
            <div class="tf-metric-row">
              ${renderTeamFocusJiraMetric(entry)}
              ${renderTeamFocusOneOnOneMetric(entry)}
            </div>
            ${renderTeamFocusBlocks(entry)}
          </div>`;
        }).join('') : '<div style="color:var(--text-muted);font-size:14px">Keine Teammitglieder vorhanden</div>'}
        </div>
      </div>

      <div class="card review-schedule-card">
        <div class="card-header"><span class="card-title">Nächste Meetings</span></div>
        ${renderReviewMeetingList(upcomingMeetings, 'Keine kommenden Meetings')}
      </div>

      <div class="card review-schedule-card">
        <div class="card-header"><span class="card-title">Events</span></div>
        ${renderReviewMarkerList(upcomingMarkers, 'Keine kommenden Events')}
      </div>

      <div class="card review-due-card">
        <div class="card-header">
          <span class="card-title">Fällig</span>
          <span class="search-summary">${dueItems.length} Items</span>
        </div>
        ${renderReviewDueList(dueItems)}
      </div>
    </div>

    ${renderMonthlyFocusPanel(currentMonthLabel)}
    ${renderMonthImpactPanel(currentMonthLabel)}
  `;
}

</script>
<script data-source="./js/search.js">
// ============================================================
// GLOBAL SEARCH
// ============================================================
let globalSearchReturnTarget = null;

function syncGlobalSearchInput() {
  const input = document.getElementById('globalSearchInput');
  if (!input) return;
  const nextValue = currentView === 'search' ? (viewState.query || '') : '';
  if (input.value !== nextValue) input.value = nextValue;
}

function openGlobalSearch(query) {
  if (currentView !== 'search') {
    globalSearchReturnTarget = {
      view: currentView,
      state: { ...viewState },
    };
  }
  navigate('search', { query });
}

function closeGlobalSearch() {
  if (currentView !== 'search') return;
  const target = globalSearchReturnTarget;
  globalSearchReturnTarget = null;
  navigate(target?.view || 'overview', target?.state || {});
}

function handleGlobalSearchInput(value) {
  const query = value.trim();
  if (!query) {
    closeGlobalSearch();
    return;
  }
  openGlobalSearch(value);
}

function handleGlobalSearchKeydown(event) {
  if (event.key === 'Escape') {
    event.preventDefault();
    event.currentTarget.value = '';
    closeGlobalSearch();
    return;
  }
  if (event.key === 'Enter') {
    event.preventDefault();
    submitGlobalSearch();
  }
}

function submitGlobalSearch() {
  const input = document.getElementById('globalSearchInput');
  if (!input) return;
  const query = input.value.trim();
  if (!query) {
    closeGlobalSearch();
    return;
  }
  openGlobalSearch(query);
}

function restoreOverviewSearchFocus() {
  if (currentView !== 'overview' || !pendingOverviewSearchSelection) return;
  const input = document.getElementById('overviewSearchInput');
  if (!input) return;
  const { start, end } = pendingOverviewSearchSelection;
  input.focus();
  input.setSelectionRange(start ?? input.value.length, end ?? input.value.length);
  pendingOverviewSearchSelection = null;
}

function restoreMeetingSearchFocus() {
  if (!currentView.startsWith('meetings') || !pendingMeetingSearchSelection) return;
  const input = document.getElementById('meetingSearchInput');
  if (!input) return;
  const { start, end } = pendingMeetingSearchSelection;
  pendingMeetingSearchSelection = null;
  requestAnimationFrame(() => {
    const nextInput = document.getElementById('meetingSearchInput');
    if (!nextInput) return;
    nextInput.focus({ preventScroll: true });
    nextInput.setSelectionRange(start ?? nextInput.value.length, end ?? nextInput.value.length);
  });
}

</script>
<script data-source="./js/capture.js">
// ============================================================
// QUICK CAPTURE
// ============================================================
function personOptions(selectedId) {
  const team = data.persons
    .filter(p => p.type !== 'kontakt')
    .slice()
    .sort(comparePersonsByName);
  const kontakte = data.persons
    .filter(p => p.type === 'kontakt')
    .slice()
    .sort(comparePersonsByName);
  let html = '';
  if (team.length) {
    html += `<optgroup label="Team">`;
    html += team.map(p => `<option value="${p.id}" ${selectedId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
    html += `</optgroup>`;
  }
  if (kontakte.length) {
    html += `<optgroup label="Kontakte">`;
    html += kontakte.map(p => `<option value="${p.id}" ${selectedId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
    html += `</optgroup>`;
  }
  return html;
}

function captureModeForType(type) {
  if (type === 'meeting' || type === 'oneOnOne') return 'meeting';
  return isGrowthType(type) ? 'teammate' : 'personal';
}

function currentCaptureMode() {
  return document.getElementById('captureMode')?.value || 'personal';
}

function setCaptureMode(mode) {
  const input = document.getElementById('captureMode');
  if (!input) return;
  input.value = ['personal', 'teammate', 'meeting'].includes(mode) ? mode : 'personal';
  updateCaptureModeUI();
  updateCaptureDateUI();
}

function updateCaptureModeUI() {
  const mode = currentCaptureMode();
  const personalActive = mode === 'personal';
  const teammateActive = mode === 'teammate';
  const meetingActive = mode === 'meeting';
  const personalBtn = document.getElementById('captureModePersonal');
  const teammateBtn = document.getElementById('captureModeTeammate');
  const meetingBtn = document.getElementById('captureModeMeeting');
  const textGroup = document.getElementById('captureTextGroup');
  const personalFields = document.getElementById('capturePersonalFields');
  const teammateFields = document.getElementById('captureTeammateFields');
  const meetingFields = document.getElementById('captureMeetingFields');
  const personalPersonGroup = document.getElementById('capturePersonalPersonGroup');
  const dateGroup = document.getElementById('captureDateGroup');
  const meetingGroup = document.getElementById('captureMeetingGroup');
  const notesGroup = document.getElementById('captureNotesGroup');
  const monthGroup = document.getElementById('captureMonthGroup');
  const showMonthGroup = personalActive;
  if (personalBtn) personalBtn.classList.toggle('active', personalActive);
  if (teammateBtn) teammateBtn.classList.toggle('active', teammateActive);
  if (meetingBtn) meetingBtn.classList.toggle('active', meetingActive);
  if (textGroup) textGroup.style.display = meetingActive ? 'none' : '';
  if (personalFields) personalFields.style.display = personalActive ? '' : 'none';
  if (teammateFields) teammateFields.style.display = teammateActive ? '' : 'none';
  if (meetingFields) meetingFields.style.display = meetingActive ? '' : 'none';
  if (personalPersonGroup) personalPersonGroup.style.display = personalActive ? '' : 'none';
  if (dateGroup) dateGroup.style.display = meetingActive ? 'none' : '';
  if (meetingGroup) meetingGroup.style.display = personalActive ? '' : 'none';
  if (notesGroup) notesGroup.style.display = personalActive ? '' : 'none';
  if (monthGroup) monthGroup.style.display = showMonthGroup ? '' : 'none';
  if (meetingActive) updateCaptureMeetingTypeUI();
}

function updateCaptureTypeUI() {
  const type = document.getElementById('captureType')?.value || 'todo';
  const statusSelect = document.getElementById('captureStatus');
  if (statusSelect && type === 'win') statusSelect.value = 'done';
  updateCaptureModeUI();
  updateCaptureDateUI();
}

function updateCaptureDateUI() {
  const mode = currentCaptureMode();
  const type = document.getElementById('captureType')?.value || 'todo';
  const status = document.getElementById('captureStatus')?.value || 'todo';
  const dateInput = document.getElementById('captureDate');
  if (!dateInput) return;
  const dateDisabled = mode === 'personal' && type !== 'win' && status === 'backlog';
  dateInput.disabled = dateDisabled;
  if (dateDisabled) dateInput.value = '';
}

function currentCaptureMeetingType() {
  return document.getElementById('captureMeetingType')?.value || 'meeting';
}

function setCaptureMeetingType(type) {
  const input = document.getElementById('captureMeetingType');
  if (!input) return;
  input.value = type === 'oneOnOne' ? 'oneOnOne' : 'meeting';
  updateCaptureMeetingTypeUI();
}

function updateCaptureMeetingTypeUI() {
  const type = currentCaptureMeetingType();
  const isOneOnOne = type === 'oneOnOne';
  const meetingBtn = document.getElementById('captureMeetingTypeMeeting');
  const oneOnOneBtn = document.getElementById('captureMeetingTypeOneOnOne');
  const titleGroup = document.getElementById('captureMeetingTitleGroup');
  const teamGroup = document.getElementById('captureMeetingTeamGroup');
  const personGroup = document.getElementById('captureMeetingPersonGroup');
  const oneOnOneDateHint = document.getElementById('captureOneOnOneDateHint');
  const dateInput = document.getElementById('meetingDate');
  if (meetingBtn) meetingBtn.classList.toggle('active', !isOneOnOne);
  if (oneOnOneBtn) oneOnOneBtn.classList.toggle('active', isOneOnOne);
  if (titleGroup) titleGroup.style.display = isOneOnOne ? 'none' : '';
  if (teamGroup) teamGroup.style.display = isOneOnOne ? 'none' : '';
  if (personGroup) personGroup.style.display = isOneOnOne ? '' : 'none';
  if (oneOnOneDateHint) oneOnOneDateHint.style.display = isOneOnOne ? '' : 'none';
  if (dateInput && !isOneOnOne && !dateInput.value) dateInput.value = todayStr();
  updateMeetingStatusPreview();
}

function currentEditType() {
  return document.getElementById('editType')?.value || 'todo';
}

function updateEditItemTypeUI() {
  const type = currentEditType();
  const isGrowth = isGrowthType(type);
  const statusSelect = document.getElementById('editStatus');
  const meetingGroup = document.getElementById('editMeetingGroup');
  const monthInput = document.getElementById('editMonth');
  const personLabel = document.getElementById('editPersonLabel');
  if (statusSelect) {
    statusSelect.disabled = isGrowth;
    if (isGrowth) statusSelect.value = 'done';
  }
  if (meetingGroup) meetingGroup.style.display = isGrowth ? 'none' : '';
  if (personLabel) personLabel.textContent = isGrowth ? 'Teammitglied' : 'Person';
  // Nur Growth-Eintraege leiten den Monat aus dem Datum ab. Bei Todos bleibt der
  // Monat eigenstaendig, damit uebernommene Items ihr altes Faelligkeitsdatum
  // behalten koennen, ohne in den Vormonat zurueckzuspringen.
  const editDate = document.getElementById('editDate')?.value;
  if (monthInput && isGrowth && editDate) monthInput.value = editDate.slice(0, 7);
  updateEditItemDateUI();
}

function updateEditItemDateUI() {
  const type = currentEditType();
  const status = document.getElementById('editStatus')?.value || 'todo';
  const dateInput = document.getElementById('editDate');
  if (!dateInput) return;
  const dateDisabled = !isGrowthType(type) && status === 'backlog';
  dateInput.disabled = dateDisabled;
  if (dateDisabled) dateInput.value = '';
}

  const month = prefill.month || viewState.month || currentMonth();
  const selectedPersonId = prefill.personId || null;
  const selectedMeetingId = prefill.meetingId || null;
  const captureMode = prefill.captureMode || captureModeForType(prefill.type);
  const captureStatus = prefill.status || (prefill.type === 'win' ? 'done' : 'todo');
  const captureMeetingType = prefill.meetingType || (prefill.type === 'oneOnOne' ? 'oneOnOne' : 'meeting');
  const personOpts = personOptions(selectedPersonId);
  const meetingOpts = meetingOptions(selectedMeetingId, { personId: selectedPersonId });
  const teamPersons = data.persons
    .filter(p => p.type !== 'kontakt')

    .sort(comparePersonsByName);

    .map(p => `<option value="${p.id}" ${selectedPersonId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`)
    .join('');
  const existingMeetingTitles = [...new Set(data.meetings
    .filter(m => m.type === 'meeting' && m.title)
    .map(m => m.title))];
  const meetingDate = prefill.date || (captureMeetingType === 'oneOnOne' ? '' : todayStr());

  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">Quick Capture</span>
      <div><span class="kbd">Ctrl+K</span> <button class="modal-close" onclick="closeOverlay()">&#x2715;</button></div>
    </div>
    <div class="modal-body">
      <input type="hidden" id="captureMode" value="${captureMode}">
      <div class="segmented-toggle capture-mode-toggle">
        <button type="button" class="segmented-toggle-btn" id="captureModePersonal" onclick="setCaptureMode('personal')">mein impact</button>
        <button type="button" class="segmented-toggle-btn" id="captureModeTeammate" onclick="setCaptureMode('teammate')">teamentwicklung</button>
        <button type="button" class="segmented-toggle-btn" id="captureModeMeeting" onclick="setCaptureMode('meeting')">meeting</button>
      </div>
      <div class="form-group" id="captureTextGroup">
        <textarea class="form-textarea" id="captureText" placeholder="Was ist passiert / was muss getan werden?" rows="3" autofocus>${esc(prefill.text || '')}</textarea>
      </div>
      <div id="capturePersonalFields">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Typ</label>
            <select class="form-select" id="captureType" onchange="updateCaptureTypeUI()">
              <option value="todo" ${(!prefill.type || prefill.type === 'todo') ? 'selected' : ''}>Todo</option>
              <option value="win" ${prefill.type === 'win' ? 'selected' : ''}>Win</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select class="form-select" id="captureStatus" onchange="updateCaptureDateUI()">
              <option value="todo" ${captureStatus === 'todo' ? 'selected' : ''}>Todo</option>
              <option value="backlog" ${captureStatus === 'backlog' ? 'selected' : ''}>Backlog</option>

      </div>
      <div id="captureTeammateFields">
        <div class="form-row">

                .filter(person => person.type !== 'kontakt')
                .slice()
                .sort(comparePersonsByName)
                .map(person => `<option value="${person.id}" ${selectedPersonId === person.id ? 'selected' : ''}>${esc(person.name)}</option>`)
                .join('')}

          </div>

          <input type="date" class="form-input" id="captureDate" value="${captureStatus === 'backlog' ? '' : (prefill.date || todayStr())}">
        </div>
      </div>
      <div class="form-group" id="captureMonthGroup">
        <label class="form-label">Monat</label>
        <input type="month" class="form-input" id="captureMonth" value="${month}">
      </div>
      <div class="form-group" id="captureMeetingGroup">

        <textarea class="form-textarea" id="captureNotes" placeholder="Zwischenstand, Details, nächste Schritte..." rows="3">${esc(prefill.notes || '')}</textarea>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="saveCapture()">Speichern</button>
    </div>
  `;
  openOverlay();
  updateCaptureModeUI();
  updateCaptureDateUI();
  setTimeout(() => {
    const focusTarget = currentCaptureMode() === 'meeting'
      ? (currentCaptureMeetingType() === 'oneOnOne' ? document.getElementById('meetingPerson') : document.getElementById('meetingTitle'))
      : document.getElementById('captureText');
    focusTarget?.focus();
  }, 100);
}

function saveCapture() {
  const mode = currentCaptureMode();
  if (mode === 'meeting') {
    saveCaptureMeeting();
    return;
  }

  const text = document.getElementById('captureText').value.trim();
  if (!text) return;
  let item;
  if (mode === 'teammate') {
    const personId = document.getElementById('captureGrowthPerson').value || null;
    if (!personId) {
      toast('Teammitglied wählen');
      return;
    }
    const date = document.getElementById('captureDate').value;
    item = {
      id: uid(),
      type: document.getElementById('captureGrowthType').value,
      status: 'done',
      text,
      personId,
      meetingId: null,
      date,
      month: date ? date.slice(0, 7) : document.getElementById('captureMonth').value,
      notes: null,
    };
  } else {
    const type = document.getElementById('captureType').value;
    const status = document.getElementById('captureStatus').value;
    const personId = type === 'win' ? null : (document.getElementById('capturePerson').value || null);
    const date = status === 'backlog' ? '' : document.getElementById('captureDate').value;
    item = {
      id: uid(),
      type,
      status,
      text,
      personId,
      meetingId: document.getElementById('captureMeeting').value || null,
      date,
      month: type === 'win'
        ? (date ? date.slice(0, 7) : document.getElementById('captureMonth').value)
        : document.getElementById('captureMonth').value,
      notes: document.getElementById('captureNotes').value.trim() || null,
    };
  }

  data.items.push(item);
  saveData(data);
  closeOverlay();
  toast('Item gespeichert');
  render();
}

function saveCaptureMeeting() {
  const type = currentCaptureMeetingType();
  const isOneOnOne = type === 'oneOnOne';
  const personId = isOneOnOne ? (document.getElementById('meetingPerson')?.value || '') : '';
  if (isOneOnOne && !personId) {
    toast('Person wählen');
    document.getElementById('meetingPerson')?.focus();
    return;
  }

  const title = isOneOnOne
    ? ''
    : (document.getElementById('meetingTitle')?.value.trim() || 'Meeting');
  const meeting = {
    id: uid(),
    type,
    isTeamMeeting: isOneOnOne ? false : !!document.getElementById('meetingIsTeam')?.checked,
    title,
    date: document.getElementById('meetingDate')?.value || '',
    personId: isOneOnOne ? personId : null,
    participants: [],
    prep: document.getElementById('meetingPrep')?.value.trim() || '',
    notes: '',
  };

  data.meetings.push(meeting);
  saveData(data);
  closeOverlay();
  toast('Meeting erstellt');
  navigate('meetings:detail', { meetingId: meeting.id });
}

let draggedItemId = null;

function onItemDragStart(event, id) {
  draggedItemId = id;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', id);
  event.currentTarget.classList.add('dragging');
}

function onItemDragEnd(event) {
  draggedItemId = null;
  event.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drop-target.drop-over').forEach(el => el.classList.remove('drop-over'));
}

function onItemDragOver(event) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  event.currentTarget.classList.add('drop-over');
}

function onItemDragLeave(event) {
  if (event.currentTarget.contains(event.relatedTarget)) return;
  event.currentTarget.classList.remove('drop-over');
}

function onItemDrop(event, status) {
  event.preventDefault();
  event.currentTarget.classList.remove('drop-over');

  const id = event.dataTransfer.getData('text/plain') || draggedItemId;
  if (!id) return;

  const item = data.items.find(i => i.id === id);
  if (!item || item.status === status) return;

  item.status = status;
  if (status === 'backlog') item.date = '';
  saveData(data);
  toast('Status aktualisiert');
  render();
}

function deleteItem(id) {
  if (!confirm('Item löschen?')) return;
  data.items = data.items.filter(i => i.id !== id);
  saveData(data);
  render();
}

function savePerson(id) {
  const name = document.getElementById('personName').value.trim();
  if (!name) return;
  const type = document.getElementById('personType').value;
  const isKontakt = type === 'kontakt';

  if (id) {
    const p = data.persons.find(p => p.id === id);
    if (p) {
      p.name = name;
      if (!isKontakt) {
        p.pushDirection = document.getElementById('personPush').value.trim();
        p.jiraUrl = normalizeExternalUrl(document.getElementById('personJiraUrl').value);
        p.jiraAccountId = document.getElementById('personJiraAccountId').value.trim();
        p.gitlabMrUrl = normalizeExternalUrl(document.getElementById('personGitlabUrl').value);
      }
    }
  } else {
    const person = { id: uid(), name, type };
    if (isKontakt) {
      person.pushDirection = '';
    } else {
      person.pushDirection = document.getElementById('personPush').value.trim();
      person.jiraUrl = normalizeExternalUrl(document.getElementById('personJiraUrl').value);
      person.jiraAccountId = document.getElementById('personJiraAccountId').value.trim();
      person.gitlabMrUrl = normalizeExternalUrl(document.getElementById('personGitlabUrl').value);
    }
    data.persons.push(person);
  }

  saveData(data);
  closeOverlay();
  toast(id ? 'Person aktualisiert' : 'Person angelegt');
  render();
}

function deletePerson(id) {
  if (!confirm('Person und alle zugehörigen Daten löschen?')) return;
  const p = data.persons.find(p => p.id === id);
  const wasKontakt = p && p.type === 'kontakt';
  data.persons = data.persons.filter(p => p.id !== id);
  data.items = data.items.filter(i => i.personId !== id);
  data.meetings = data.meetings
    .filter(m => m.personId !== id)
    .map(m => ({
      ...m,
      participants: meetingParticipantIds(m).filter(participantId => participantId !== id && participantId !== m.personId),
    }));
  saveData(data);
  closeOverlay();
  navigate(wasKontakt ? 'kontakte' : 'team');
}

function updateMeetingStatusPreview() {
  const preview = document.getElementById('meetingStatusPreview');
  const carryoverPreview = document.getElementById('meetingCarryoverPreview');
  const date = document.getElementById('meetingDate')?.value;
  const captureMeetingType = document.getElementById('captureMeetingType')?.value;
  const isOneOnOne = captureMeetingType ? captureMeetingType === 'oneOnOne' : !!document.getElementById('meetingPerson');
  const personId = isOneOnOne ? (document.getElementById('meetingPerson')?.value || '') : '';
  const isTeam = document.getElementById('meetingIsTeam')?.checked ?? true;
  if (preview) preview.innerHTML = renderMeetingFormStatusPreview(date, isOneOnOne, personId, isTeam);
  if (carryoverPreview) carryoverPreview.innerHTML = renderMeetingFormCarryoverPreview(isOneOnOne, personId, date);
}

function renderMeetingFormStatusPreview(dateISO, isOneOnOne, personId, teamMeeting = true) {
  if (!dateISO) return '';
  if (isOneOnOne) {
    if (!personId) return '';
    const person = data.persons.find(p => p.id === personId);
    return renderMeetingTeamStatusForDate(dateISO, {
      inForm: true,
      personIds: [personId],
      heading: person ? person.name : '1:1-Status',
      idPrefix: 'meeting-preview-oneonone',
    });
  }
  if (!teamMeeting) return '';
  return renderMeetingTeamStatusForDate(dateISO, { inForm: true });
}

function renderMeetingFormCarryoverPreview(isOneOnOne, personId, dateISO) {
  if (!isOneOnOne || !personId) return '';
  const carryover = oneOnOneCarryover({
    id: '',
    type: 'oneOnOne',
    personId,
    date: dateISO || todayStr(),
  });
  const total = carryoverCount(carryover);
  if (!total) return '';
  return `
    <div class="meeting-carryover-preview">
      <span>Übernahme</span>
      <strong>${carryover.openFollowUps.length}</strong> Follow-ups
      <strong>${carryover.openTodos.length}</strong> Todos
      <strong>${carryover.recentSignals.length}</strong> Signale
    </div>
  `;
}

function saveMonthClosure(month) {
  const openItems = data.items.filter(i => i.month === month && i.status !== 'done');
  const next = nextMonth(month);
  const shouldCarry = !!document.getElementById('monthCarryoverCheckbox')?.checked && openItems.length > 0;
  const summary = document.getElementById('monthReviewSummary')?.value || '';

  upsertMonthReview(month, summary);

  if (shouldCarry) {
    openItems.forEach(item => {
      item.month = next;
    });
  }

  saveData(data);
  closeOverlay();
  if (shouldCarry) viewState.month = next;
  toast(shouldCarry ? `${openItems.length} Items übernommen` : 'Monatsrückblick gespeichert');
  render();
}

function exportMonth(month) {
  const items = data.items.filter(i => i.month === month);
  const focuses = data.focuses.filter(f => f.month === month);
  const taskItems = items.filter(i => !isGrowthEntry(i));

  let md = `# ${formatMonth(month)}\n\n`;

  if (focuses.length) {
    md += `## Focus\n`;
    focuses.forEach(f => {
      md += `- **${f.title}**${f.description ? ': ' + f.description : ''}\n`;
    });
    md += '\n';
  }

  const review = monthReview(month);
  if (review) {
    md += `## Monatsrückblick\n`;
    md += `${review.summary}\n\n`;
  }

  const groups = [
    ['Todo', taskItems.filter(i => i.status === 'todo')],
    ['Backlog', taskItems.filter(i => i.status === 'backlog')],
    ['Warte auf', taskItems.filter(i => i.status === 'waiting')],
    ['Done', taskItems.filter(i => i.status === 'done')],
  ];

  groups.forEach(([title, list]) => {
    if (list.length) {
      md += `## ${title}\n`;
      list.forEach(i => {
        const check = i.status === 'done' ? 'x' : ' ';
        const person = i.personId ? ` (@${personName(i.personId)})` : '';
        const badge = i.type !== 'todo' ? ` [${itemTypeLabel(i.type)}]` : '';
        md += `- [${check}] ${i.text}${person}${badge}\n`;
        if (i.notes) md += `  > ${i.notes.replace(/\n/g, '\n  > ')}\n`;
      });
      md += '\n';
    }
  });

  const wins = items.filter(isPersonalWin);
  if (wins.length) {
    md += `## My Wins\n`;
    wins.forEach(i => { md += `- ${formatDate(i.date)}: ${i.text}\n`; });
    md += '\n';
  }

  const growth = items.filter(isGrowthEntry).sort(compareItemsByDateDesc);
  if (growth.length) {
    md += `## Team Growth\n`;
    growth.forEach(i => { md += `- ${formatDate(i.date)}: ${personName(i.personId)} · ${itemTypeLabel(i.type)} · ${i.text}\n`; });
    md += '\n';
  }

  md += exportMonthBlocks(month);

  downloadFile(`${month}.md`, md);
}

function openPersonDossierExport(id) {

        Erstellt eine Markdown-Chronik für ${esc(p.name)} aus personenbezogenen Items,
        1:1-Notizen und Planungsblöcken.
      </div>
      <div class="form-row">
        <div class="form-group">
