        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Label</label>
        <input class="form-input" id="blockLabel" value="${b ? esc(b.label || '') : ''}" placeholder="z.B. Projekt Alpha, TK-1234" autofocus>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Start</label>
          <input type="date" class="form-input" id="blockStart" value="${parked ? '' : start}" ${parked ? 'readonly' : ''}>
        </div>
        <div class="form-group">
          <label class="form-label">Ende</label>
          <input type="date" class="form-input" id="blockEnd" value="${parked ? '' : end}" ${parked ? 'readonly' : ''}>
        </div>
        <div class="form-group form-group-parked">
          <label class="form-label" title="Noch keiner Woche zugeordnet — Block erscheint in der geparkt-Zeile">
            <input type="checkbox" id="blockParked" ${parked ? 'checked' : ''} onchange="toggleBlockParked(this.checked)">
            <span>Geparkt</span>
          </label>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Typ</label>
          <select class="form-select" id="blockTyp" onchange="document.getElementById('blockDoneGroup').hidden = this.value === 'abwesenheit'">
            ${BLOCK_TYPES.map(t => `<option value="${t.val}" ${typ === t.val ? 'selected' : ''}>${t.label}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group" id="blockDoneGroup" ${typ === 'abwesenheit' ? 'hidden' : ''}>
        <label class="form-label" style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="blockDone" ${b && b.done ? 'checked' : ''}>
          <span>Erledigt</span>
        </label>
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between;align-items:baseline">
          Jira-Ref (optional)
          <a id="blockJiraLink" class="jira-link" target="_blank" rel="noopener" href="${b && jiraUrl(b.jiraRef) ? esc(jiraUrl(b.jiraRef)) : '#'}" ${b && jiraUrl(b.jiraRef) ? '' : 'hidden'}>öffnen ↗</a>
        </label>
        <input class="form-input" id="blockJira" list="blockJiraSuggest" autocomplete="off"
          value="${b ? esc(b.jiraRef || '') : ''}" placeholder="TK-1234 oder Stichwort aus dem Titel"
          oninput="onBlockJiraInput(this.value)">
        <datalist id="blockJiraSuggest">
          ${jiraTicketPool().map(t => `<option value="${esc(t.key)}" label="${esc(t.summary)}">${esc(t.summary)}</option>`).join('')}
        </datalist>
        <input type="hidden" id="blockJiraSummary" value="${b ? esc(b.jiraSummary || '') : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">Notiz</label>
        <textarea class="form-textarea" id="blockNotiz" rows="3">${b ? esc(b.notiz || '') : ''}</textarea>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" style="flex:1;min-width:140px" onclick="saveBlock('${blockId || ''}')">Speichern</button>
        <button class="btn btn-secondary" onclick="closeOverlay()">Abbrechen</button>
        ${b ? `<button class="btn btn-danger" onclick="deleteBlock('${b.id}')">Löschen</button>` : ''}
      </div>
    </div>
  `;
  openOverlay();
}

function toggleBlockParked(checked) {
  const s = document.getElementById('blockStart');
  const e = document.getElementById('blockEnd');
  if (!s || !e) return;
  if (checked) { s.value = ''; e.value = ''; }
  s.readOnly = checked;
  e.readOnly = checked;
}

function updateBlockJiraLink(val) {
  const a = document.getElementById('blockJiraLink');
  if (!a) return;
  const href = jiraUrl((val || '').trim());
  a.hidden = !href;
  if (href) a.href = href;
}

// Auswahl aus der Vorschlagsliste: Link nachziehen und das Label mit dem
// Ticket-Titel fuellen — aber nur, solange das Label leer ist oder noch
// unveraendert aus Jira stammt. Handgeschriebenes wird nicht ueberschrieben.
function onBlockJiraInput(val) {
  updateBlockJiraLink(val);
  const summary = jiraSummaryForKey(val);
  if (!summary) return;
  const labelEl = document.getElementById('blockLabel');
  const summaryEl = document.getElementById('blockJiraSummary');
  if (!labelEl) return;
  const current = labelEl.value.trim();
  const fromJira = summaryEl ? summaryEl.value : '';
  if (current && current !== fromJira) return;
  labelEl.value = summary;
  if (summaryEl) summaryEl.value = summary;
}

// Opens the block's Jira ticket in a new tab. Returns false when there is
// nothing to open (no ref or no base URL configured) so the caller can
// fall back to the edit form.
function openBlockJira(blockId) {
  const b = data.blocks.find(x => x.id === blockId);
  const url = b ? jiraUrl(b.jiraRef) : null;
  if (!url) return false;
  window.open(url, '_blank', 'noopener');
  return true;
}

// ============================================================
// JIRA-DRIFT: Tickets in einem Klick verplanen / Bloecke nachziehen
// ============================================================
// Haengt am "jira ±N"-Chip der Timeline. Drei Sorten Abweichung, jede mit
// genau einer Aktion: Ticket ohne Block anlegen, veralteten Block erledigen,
// geaenderten Ticket-Titel uebernehmen.
function openJiraDriftMenu(personId) {
  const person = data.persons.find(p => p.id === personId);
  if (!person) return;
  const drift = jiraDriftForPerson(person);
  if (!drift || !drift.hasDrift) { closeOverlay(); return; }

  const section = (title, rows) => rows.length ? `
    <div class="jira-drift-group">
      <div class="jira-drift-head">${title} &middot; ${rows.length}</div>
      ${rows.join('')}
    </div>` : '';

  const unplanned = drift.unplanned.map(t => `
      <div class="jira-drift-row">
        ${jiraKeyLink(t.key)}
        <span class="jira-drift-text" title="${esc(t.summary || '')}">${esc(t.summary || '')}</span>
        <span class="jira-status-chip jira-status-${esc(t.statusCategory || 'new')}">${esc((t.status || '').toLowerCase())}</span>
        <button class="btn btn-sm btn-primary" type="button"
          onclick="quickPlanJiraTicket('${person.id}','${esc(t.key)}')"
          title="Block ab heute anlegen">+ block</button>
      </div>`);

  const stale = drift.stale.map(b => `
    <div class="jira-drift-row">
      ${jiraKeyLink(b.jiraRef)}
      <span class="jira-drift-text" title="${esc(b.label || '')}">${esc(b.label || '(ohne Label)')}</span>
      <span class="jira-drift-note">ticket nicht mehr offen</span>
      <button class="btn btn-sm btn-secondary" type="button"
        onclick="resolveStaleJiraBlock('${b.id}')"
        title="Block als erledigt markieren">&#x2713; erledigt</button>
    </div>`);

  const renamed = drift.renamed.map(b => {
    const current = jiraSummaryForKey(b.jiraRef);
    return `
      <div class="jira-drift-row">
        ${jiraKeyLink(b.jiraRef)}
        <span class="jira-drift-text jira-drift-rename" title="${esc(b.label || '')} → ${esc(current)}">
          <s>${esc(b.label || '')}</s> ${esc(current)}
        </span>
        <button class="btn btn-sm btn-secondary" type="button"
          onclick="applyJiraLabel('${b.id}')"
          title="Ticket-Titel als Block-Label übernehmen">titel übernehmen</button>
      </div>`;
  });

  // Block abgelaufen, Ticket laeuft weiter: verlaengern statt einen zweiten
  // Block auf denselben Key anzulegen.
  const expired = drift.expired.map(b => `
    <div class="jira-drift-row">
      ${jiraKeyLink(b.jiraRef)}
      <span class="jira-drift-text" title="${esc(b.label || '')}">${esc(b.label || '(ohne Label)')}</span>
      <span class="jira-drift-note">bis ${esc(formatDate(b.end || b.start))}</span>
      <button class="btn btn-sm btn-secondary" type="button"
        onclick="extendJiraDriftBlock('${b.id}')"
        title="Ende auf Freitag dieser Woche setzen">+1 woche</button>
      <button class="btn btn-sm btn-secondary" type="button"
        onclick="resolveStaleJiraBlock('${b.id}')"
        title="Block als erledigt markieren">&#x2713; erledigt</button>
    </div>`);

  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">Jira &mdash; ${esc(person.name)}</span>
      <button class="modal-close" onclick="closeOverlay()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-hint" style="margin-bottom:10px">Stand: ${esc(jiraSyncAgeLabel() || 'unbekannt')}</div>
      ${section('ohne block', unplanned)}
      ${section('block abgelaufen', expired)}
      ${section('block veraltet', stale)}
      ${section('titel geändert', renamed)}
    </div>
  `;
  openOverlay();
}

// Nach jeder Aktion neu aufbauen, damit mehrere Tickets hintereinander
// abgearbeitet werden koennen. Ist nichts mehr offen, schliesst das Menue.
function refreshJiraDriftMenu(personId) {
  saveData(data);
  render();
  const person = data.persons.find(p => p.id === personId);
  const drift = person ? jiraDriftForPerson(person) : null;
  if (drift && drift.hasDrift) openJiraDriftMenu(personId);
  else closeOverlay();
}

// Wie "+1 woche" in der Ueberfaellig-Liste, nur bleibt das Drift-Menue offen.
function extendJiraDriftBlock(blockId) {
  const b = data.blocks.find(x => x.id === blockId);
  if (!b || isBlockParked(b)) return;
  const friday = toISO(addDays(startOfWeek(parseISO(todayStr())), 4));
  b.end = friday > todayStr() ? friday : todayStr();
  toast(`${b.jiraRef || 'Block'} bis ${formatDate(b.end)} verlängert`);
  refreshJiraDriftMenu(b.personId);
}

function quickPlanJiraTicket(personId, key) {
  const person = data.persons.find(p => p.id === personId);
  if (!person) return;
  const ref = String(key || '').trim().toUpperCase();
  // Doppelte Absicherung gegen zwei Bloecke auf demselben Ticket: der Drift
  // zaehlt abgelaufene Bloecke zwar schon als verplant, aber der Klick darf
  // auch aus einem veralteten Menue heraus nichts Doppeltes anlegen.
  const existing = data.blocks.find(b =>
    b.personId === personId && !b.done && String(b.jiraRef || '').trim().toUpperCase() === ref);
  if (existing) {
    toast(`${ref} hat schon einen Block`);
    refreshJiraDriftMenu(personId);
    return;
  }
  const summary = jiraSummaryForKey(ref);
  const today = todayStr();
  data.blocks.push({
    id: uid(),
    personId,
    label: summary || ref,
    start: today,
    end: today,
    typ: 'ticket',
    done: false,
    jiraRef: ref,
    jiraSummary: summary || null,
    notiz: null,
  });
  toast(`${ref} verplant — ab heute`);
  refreshJiraDriftMenu(personId);
}

function resolveStaleJiraBlock(blockId) {
  const b = data.blocks.find(x => x.id === blockId);
  if (!b) return;
  b.done = true;
  toast(`${b.jiraRef || 'Block'} erledigt`);
  refreshJiraDriftMenu(b.personId);
}

function applyJiraLabel(blockId) {
  const b = data.blocks.find(x => x.id === blockId);
  if (!b) return;
  const summary = jiraSummaryForKey(b.jiraRef);
  if (!summary) return;
  b.label = summary;
  b.jiraSummary = summary;
  toast('Titel übernommen');
  refreshJiraDriftMenu(b.personId);
}

function saveBlock(id) {
  const personId = document.getElementById('blockPerson').value;
  const label = document.getElementById('blockLabel').value.trim();
  let start = document.getElementById('blockStart').value;
  let end = document.getElementById('blockEnd').value;
  const typ = document.getElementById('blockTyp').value;
  const jiraRef = document.getElementById('blockJira').value.trim();
  const summaryEl = document.getElementById('blockJiraSummary');
  const jiraSummary = summaryEl ? summaryEl.value.trim() : '';
  const notiz = document.getElementById('blockNotiz').value.trim();
  const doneEl = document.getElementById('blockDone');
  const done = typ !== 'abwesenheit' && !!(doneEl && doneEl.checked);
  const parkedEl = document.getElementById('blockParked');
  const parked = !!(parkedEl && parkedEl.checked);

  if (!personId) { toast('Person nötig'); return; }
  if (parked) {
    // Geparkt: ohne Datum anlegen, taucht in der "geparkt"-Zeile auf
    start = null;
    end = null;
  } else {
    if (!start && !end) { toast('Start und Ende nötig — oder Geparkt anhaken'); return; }
    if (!start) start = end;
    if (!end) end = start;
    if (end < start) { const tmp = start; start = end; end = tmp; }
  }

  if (id) {
    const b = data.blocks.find(x => x.id === id);
    if (!b) return;
    Object.assign(b, { personId, label, start, end, typ, done, jiraRef: jiraRef || null, jiraSummary: jiraSummary || null, notiz: notiz || null });
  } else {
    data.blocks.push({ id: uid(), personId, label, start, end, typ, done, jiraRef: jiraRef || null, jiraSummary: jiraSummary || null, notiz: notiz || null });
  }
  saveData(data);
  closeOverlay();
  toast(id ? 'Block aktualisiert' : (start ? 'Block angelegt' : 'Block geparkt'));
  render();
}

function deleteBlock(id) {
  if (!confirm('Block löschen?')) return;
  data.blocks = data.blocks.filter(b => b.id !== id);
  saveData(data);
  closeOverlay();
  render();
}

function openMarkerForm(markerId) {
  const m = markerId ? (data.markers || []).find(x => x.id === markerId) : null;
  const date = m ? m.date : todayStr();
  const color = m ? m.color : MARKER_COLORS[0];
  const swatches = MARKER_COLORS.map(c => `
    <label class="marker-swatch ${c === color ? 'selected' : ''}" style="background:${c}">
      <input type="radio" name="markerColor" value="${c}" ${c === color ? 'checked' : ''}>
    </label>
  `).join('');
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">${m ? 'Marker bearbeiten' : 'Neuer Marker'}</span>
      <button class="modal-close" onclick="closeOverlay()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Label</label>
        <input class="form-input" id="markerLabel" value="${m ? esc(m.label || '') : ''}" placeholder="z.B. Release 4.2, Code Freeze" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Datum</label>
        <input type="date" class="form-input" id="markerDate" value="${date}">
      </div>
      <div class="form-group">
        <label class="form-label">Farbe</label>
        <div class="marker-swatches" onclick="onMarkerSwatchClick(event)">${swatches}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" style="flex:1;min-width:140px" onclick="saveMarker('${markerId || ''}')">Speichern</button>
        <button class="btn btn-secondary" onclick="closeOverlay()">Abbrechen</button>
        ${m ? `<button class="btn btn-danger" onclick="deleteMarker('${m.id}')">Löschen</button>` : ''}
      </div>
    </div>
  `;
  openOverlay();
}

function onMarkerSwatchClick(e) {
  const label = e.target.closest('.marker-swatch');
  if (!label) return;
  document.querySelectorAll('.marker-swatch').forEach(el => el.classList.remove('selected'));
  label.classList.add('selected');
}

function saveMarker(id) {
  const label = document.getElementById('markerLabel').value.trim();
  const date = document.getElementById('markerDate').value;
  const colorInput = document.querySelector('input[name="markerColor"]:checked');
  const color = colorInput ? colorInput.value : MARKER_COLORS[0];
  if (!date) { toast('Datum nötig'); return; }
  if (!data.markers) data.markers = [];
  if (id) {
    const m = data.markers.find(x => x.id === id);
    if (!m) return;
    Object.assign(m, { label, date, color });
  } else {
    data.markers.push({ id: uid(), label, date, color });
  }
  saveData(data);
  closeOverlay();
  toast(id ? 'Marker aktualisiert' : 'Marker angelegt');
  render();
}

function deleteMarker(id) {
  if (!confirm('Marker löschen?')) return;
  data.markers = (data.markers || []).filter(m => m.id !== id);
  saveData(data);
  closeOverlay();
  render();
}

// ============================================================
// BLOCK DRAG INTERACTIONS
// ============================================================
let _tlDrag = null;
let _tlFrozenOrder = null;

function _dayIsoFromTrack(trackEl, clientX) {
  const cells = trackEl.querySelectorAll('.tl-track-grid .tl-cell');
  if (!cells.length) return null;
  const firstRect = cells[0].getBoundingClientRect();
  if (clientX < firstRect.left) return cells[0].dataset.dayIso;
  for (let i = cells.length - 1; i >= 0; i--) {
    const rect = cells[i].getBoundingClientRect();
    if (clientX >= rect.left) return cells[i].dataset.dayIso;
  }
  return cells[cells.length - 1].dataset.dayIso;
}

function onTrackPointerDown(event, personId) {
  if (event.target.closest('.tl-block')) return; // block handles its own drag
  if (event.button !== 0) return;
  const track = event.currentTarget;
  const overlay = track.querySelector('.tl-track-overlay');
  const startIso = _dayIsoFromTrack(track, event.clientX);
  if (!startIso || !overlay) return;
  _tlDrag = { mode: 'create', personId, track, startIso, currentIso: startIso };
  track.classList.add('tl-track-creating');
  track.setPointerCapture(event.pointerId);
  event.preventDefault();

  const ghost = document.createElement('div');
  ghost.className = 'tl-block tl-block-preview';
  ghost.style.pointerEvents = 'none';
  const insertLane = track.querySelector('.tl-insert-lane');
  if (insertLane) {
    ghost.style.top = insertLane.style.top;
    ghost.style.height = insertLane.style.height;
    ghost.style.zIndex = '3';
  }
  overlay.appendChild(ghost);

  const updateGhost = () => {
    const cells = track.querySelectorAll('.tl-track-grid .tl-cell');
    let sIdx = -1, eIdx = -1;
    cells.forEach((c, i) => {
      if (c.dataset.dayIso === _tlDrag.startIso) sIdx = i;
      if (c.dataset.dayIso === _tlDrag.currentIso) eIdx = i;
    });
    if (sIdx < 0 || eIdx < 0) return;
    const lo = Math.min(sIdx, eIdx), hi = Math.max(sIdx, eIdx);
    const cols = parseInt(track.dataset.cols || String(cells.length), 10) || cells.length;
    ghost.style.left = `${(lo / cols) * 100}%`;
    ghost.style.width = `${((hi - lo + 1) / cols) * 100}%`;
    const n = hi - lo + 1;
    ghost.textContent = `${n} ${n === 1 ? 'Tag' : 'Tage'}`;
  };
  updateGhost();

  const onMove = (e) => {
    const iso = _dayIsoFromTrack(track, e.clientX);
    if (iso) { _tlDrag.currentIso = iso; updateGhost(); }
  };
  const onUp = (e) => {
    track.removeEventListener('pointermove', onMove);
    track.removeEventListener('pointerup', onUp);
    track.removeEventListener('pointercancel', onUp);
    track.classList.remove('tl-track-creating');
    ghost.remove();
    if (!_tlDrag) return;
    const s = _tlDrag.startIso, c = _tlDrag.currentIso;
    const start = s < c ? s : c;
    const end = s < c ? c : s;
    _tlDrag = null;
    openBlockForm(null, personId, start, end);
  };
  track.addEventListener('pointermove', onMove);
  track.addEventListener('pointerup', onUp);
  track.addEventListener('pointercancel', onUp);
}

function onBlockPointerDown(event, blockId) {
  if (event.button !== 0) return;
  const blockEl = event.currentTarget;
  const track = blockEl.closest('.tl-track');
  if (!track) return;
  const rect = blockEl.getBoundingClientRect();
  const relX = event.clientX - rect.left;
  const edgeSize = Math.min(12, Math.max(6, rect.width / 4));
  let mode = 'move';
  if (relX <= edgeSize) mode = 'resize-start';
  else if (relX >= rect.width - edgeSize) mode = 'resize-end';

  const b = data.blocks.find(x => x.id === blockId);
  if (!b) return;

  const startIsoAtDown = _dayIsoFromTrack(track, event.clientX);
  _tlDrag = { mode, blockId, track, downIso: startIsoAtDown, origStart: b.start, origEnd: b.end, moved: false };
  _tlFrozenOrder = Array.from(document.querySelectorAll('.tl-track[data-person-id]')).map(el => el.dataset.personId);
  event.preventDefault();
  event.stopPropagation();

  const apply = (iso) => {
    if (!iso) return;
    const signedDelta = Math.round((parseISO(iso) - parseISO(_tlDrag.downIso)) / 86400000);
    if (mode === 'move') {
      b.start = toISO(addDays(parseISO(_tlDrag.origStart), signedDelta));
      b.end = toISO(addDays(parseISO(_tlDrag.origEnd), signedDelta));
    } else if (mode === 'resize-start') {
      let newStart = toISO(addDays(parseISO(_tlDrag.origStart), signedDelta));
      if (newStart > b.end) newStart = b.end;
      b.start = newStart;
    } else if (mode === 'resize-end') {
      let newEnd = toISO(addDays(parseISO(_tlDrag.origEnd), signedDelta));
      if (newEnd < b.start) newEnd = b.start;
      b.end = newEnd;
    }
    _tlDrag.moved = true;
    render();
  };

  const onMove = (e) => {
    const iso = _dayIsoFromTrack(document.querySelector(`.tl-track[data-person-id="${b.personId}"]`) || track, e.clientX);
    apply(iso);
  };
  const onUp = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    const moved = _tlDrag && _tlDrag.moved;
    _tlDrag = null;
    _tlFrozenOrder = null;
    if (moved) {
      _suppressNextBlockClick = true;
      setTimeout(() => { _suppressNextBlockClick = false; }, 100);
      saveData(data);
      render();
    }
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

let _suppressNextBlockClick = false;

// ============================================================
// EXPORT EXTENSIONS
// ============================================================
function exportMonthBlocks(month) {
  const ms = toISO(monthStart(month));
  const me = toISO(monthEnd(month));
  const blocks = data.blocks.filter(b => b.end >= ms && b.start <= me);
  if (!blocks.length) return '';
  // Group by person
  const byPerson = {};
  blocks.forEach(b => {
    (byPerson[b.personId] = byPerson[b.personId] || []).push(b);
  });
  let md = `## Kapazitätsplanung\n\n`;
  Object.keys(byPerson).forEach(pid => {
    const p = data.persons.find(x => x.id === pid);
    const name = p ? p.name : '(unbekannt)';
    md += `### ${name}\n`;
    byPerson[pid].sort((a, b) => a.start.localeCompare(b.start));
    byPerson[pid].forEach(b => {
      md += `- ${b.label || '(ohne Label)'} · ${b.typ}`;
      if (b.jiraRef) md += ` · ${jiraMd(b.jiraRef)}`;
      md += '\n';
    });
    md += '\n';
  });
  return md;
}

function exportPersonBlocks(personId, from, to, matchingBlocks) {
  const blocks = matchingBlocks || data.blocks.filter(b =>
    b.personId === personId
    && (!from || (b.end && b.end >= from))
    && (!to || (b.start && b.start <= to))
  );
  let md = `## Planungsblöcke (${blocks.length})\n\n`;
  if (blocks.length) {
    blocks.slice().sort((a, b) => (b.start || '').localeCompare(a.start || '')).forEach(b => {
      md += `- ${b.start && b.end ? `${formatDate(b.start)}–${formatDate(b.end)}` : 'ohne Zeitraum'} · ${b.label || '(ohne Label)'} · ${b.typ}`;
      if (b.done) md += ` · erledigt`;
      if (b.jiraRef) md += ` · ${jiraMd(b.jiraRef)}`;
      md += '\n';
    });
  } else {
    md += `_Keine Planungsblöcke im gewählten Zeitraum._\n`;
  }
  md += '\n';

  const p = data.persons.find(x => x.id === personId);
  const sup = (p && p.supportMonate)
    ? p.supportMonate.filter(month => (!from || month >= from.slice(0, 7)) && (!to || month <= to.slice(0, 7))).slice().sort()
    : [];
  if (sup.length) {
    md += `## Support-Rotation\n\n`;
    sup.forEach(m => { md += `- ${formatMonthName(m)}\n`; });
    md += '\n';
  }
  return md;
}

</script>
<script data-source="./js/ui.js">
// ============================================================
// THEME
// ============================================================
function getSavedTheme() {
  try {
    const t = localStorage.getItem(THEME_KEY);
    return THEMES.includes(t) ? t : 'light';
  } catch {
    return 'light';
  }
}

function applyTheme(theme) {
  const next = THEMES.includes(theme) ? theme : 'light';
  document.body.setAttribute('data-theme', next);
  const trigger = document.getElementById('themeTrigger');
  if (trigger) {
    trigger.title = `Einstellungen - Theme: ${THEME_LABELS[next] || next}`;
    trigger.setAttribute('aria-label', `Einstellungen öffnen, aktuelles Theme: ${THEME_LABELS[next] || next}`);
  }
  updateThemeMenuSelection(next);
  try {
    localStorage.setItem(THEME_KEY, next);
  } catch {}
}

function toggleTheme() {
  const current = document.body.getAttribute('data-theme');
  const currentIndex = THEMES.indexOf(current);
  const nextIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % THEMES.length;
  applyTheme(THEMES[nextIndex]);
}

function setTheme(theme) {
  applyTheme(theme);
  closeThemeMenu();
}

function renderThemeMenu() {
  const menu = document.getElementById('themeMenu');
  if (!menu) return;
  const themeOptions = THEMES.map(theme => {
    const [bg, accent] = THEME_COLORS[theme] || THEME_COLORS.light;
    const label = THEME_LABELS[theme] || theme;
    return `
      <button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-theme-option="${theme}" onclick="setTheme('${theme}')" style="--theme-swatch-bg:${bg};--theme-swatch-accent:${accent};">
        <span class="theme-option-swatch" aria-hidden="true"></span>
        <span class="theme-option-label">${label}</span>
      </button>
    `;
  }).join('');
  menu.innerHTML = `
    <div class="theme-menu-section" aria-label="Darstellung">
      <div class="theme-menu-label">darstellung</div>
      ${themeOptions}
    </div>
    <div class="theme-menu-divider" aria-hidden="true"></div>
    <div class="theme-menu-section" aria-label="Daten">
      <div class="theme-menu-label">daten</div>
      <button class="theme-action" type="button" role="menuitem" onclick="exportBackup()">
        backup
        ${backupAgeLabel() ? `<span class="theme-action-note">${backupAgeLabel()}</span>` : ''}
      </button>
      <button class="theme-action" type="button" role="menuitem"
        aria-pressed="${autoBackupEnabled() ? 'true' : 'false'}"
        title="Tägliche Sicherung beim Start – gilt für alle Geräte in diesem Datenordner"
        onclick="toggleAutoBackup()">
        auto-backup
        <span class="theme-action-toggle ${autoBackupEnabled() ? 'is-on' : ''}">${autoBackupEnabled() ? 'täglich' : 'aus'}</span>
      </button>
      <button class="theme-action" type="button" role="menuitem" onclick="importBackup()">import</button>
      <button class="theme-action" type="button" role="menuitem" onclick="openCleanupDialog()">cleanup</button>
      <button class="theme-action" type="button" role="menuitem" onclick="configureJiraBase()">jira-url</button>
      ${renderDeviceList()}
    </div>
    <div class="theme-menu-divider" aria-hidden="true"></div>
    <div class="theme-menu-section" aria-label="App">
      <div class="theme-menu-label">app</div>
      ${window.pendingUpdate ? `
        <button class="theme-action theme-action-update" type="button" role="menuitem" onclick="closeThemeMenu(); downloadUpdate()">
          <span class="theme-action-update-dot" aria-hidden="true"></span>
          update herunterladen
          <span class="theme-action-update-version">v${APP_VERSION} → v${window.pendingUpdate.version}</span>
        </button>
      ` : ''}
      <button class="theme-action" type="button" role="menuitem" onclick="closeThemeMenu(); checkForUpdate({ silent: false })">auf updates prüfen</button>
      <div class="theme-menu-version">v${APP_VERSION}</div>
    </div>
  `;
}

// Menü bleibt offen: man will sehen, dass der Schalter umgesprungen ist.
async function toggleAutoBackup() {
  const enabled = await setAutoBackupEnabled(!autoBackupEnabled());
  renderThemeMenu();
  updateThemeMenuSelection(document.body.getAttribute('data-theme'));
  toast(enabled ? 'Auto-Backup an – täglich beim Start' : 'Auto-Backup aus');
  if (enabled) maybeAutoBackup();
}

// Wer teilt sich diesen Datenordner, und wann war das letzte Mal? Wenn etwas
// nicht ankommt, sieht man hier zuerst, ob die andere Seite ueberhaupt
// synchronisiert hat.
function renderDeviceList() {
  const devices = activeDevices();
  if (devices.length < 2) return '';
  const me = getDeviceId();
  const rows = devices
    .slice()
    .sort((a, b) => (b.lastSeenAt || '').localeCompare(a.lastSeenAt || ''))
    .map(device => `
      <div class="theme-menu-device ${device.id === me ? 'is-self' : ''}">
        <span class="theme-menu-device-name">${esc(device.label || device.id.slice(0, 4))}</span>
        <span class="theme-menu-device-seen">${device.id === me ? 'dieses gerät' : esc(agoLabel(device.lastSeenAt))}</span>
      </div>
    `).join('');
  return `<div class="theme-menu-devices" title="Geräte, die diesen Datenordner nutzen">${rows}</div>`;
}

function configureJiraBase() {
  closeThemeMenu();
  const current = getJiraBaseUrl();
  const input = prompt('Jira Base-URL (z.B. https://jira.firma.at)\nLeer lassen zum Entfernen.', current);
  if (input === null) return;
  let val = input.trim().replace(/\/+$/, '');
  if (val && !/^https?:\/\//i.test(val)) val = 'https://' + val;
  try {
    if (val) localStorage.setItem(JIRA_BASE_KEY, val);
    else localStorage.removeItem(JIRA_BASE_KEY);
  } catch {}
  toast(val ? 'Jira-URL gespeichert' : 'Jira-URL entfernt');
}

function updateThemeMenuSelection(theme) {
  document.querySelectorAll('[data-theme-option]').forEach(option => {
    const active = option.dataset.themeOption === theme;
    option.classList.toggle('active', active);
    option.setAttribute('aria-checked', active ? 'true' : 'false');
  });
}

function setThemeMenuOpen(open) {
  const picker = document.getElementById('themePicker');
  const trigger = document.getElementById('themeTrigger');
  if (!picker || !trigger) return;
  // Beim Oeffnen neu bauen: das Backup-Alter steht erst nach dem Laden fest.
  if (open) {
    renderThemeMenu();
    updateThemeMenuSelection(document.body.getAttribute('data-theme'));
  }
  picker.classList.toggle('open', open);
  trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function toggleThemeMenu(event) {
  if (event) event.stopPropagation();
  const picker = document.getElementById('themePicker');
  setThemeMenuOpen(!picker?.classList.contains('open'));
}

function closeThemeMenu() {
  setThemeMenuOpen(false);
}

function initTheme() {
  initThemeEasterEggs();
  renderThemeMenu();
  applyTheme(getSavedTheme());
}

// ============================================================
// THEME EASTER EGGS
// ============================================================
let starfoxShotTimer = null;
let themeEasterEggsReady = false;

function initThemeEasterEggs() {
  if (themeEasterEggsReady) return;
  themeEasterEggsReady = true;

  const layer = document.createElement('div');
  layer.className = 'hyrule-easter-eggs';
  layer.id = 'hyruleEasterEggs';
  layer.setAttribute('aria-hidden', 'true');
  layer.innerHTML = `
    <div class="hyrule-triforce" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  `;
  document.body.appendChild(layer);

  const popLayer = document.createElement('div');
  popLayer.className = 'pop-theme-easter-eggs';
  popLayer.setAttribute('aria-hidden', 'true');
  popLayer.innerHTML = `
    <div class="starfox-space">
      <span class="starfox-stars starfox-stars-far"></span>
      <span class="starfox-stars starfox-stars-near"></span>
    </div>
    <div class="starfox-target-burst" id="starfoxTargetBurst">
      <span class="starfox-target-ring"></span>
    </div>
  `;
  document.body.appendChild(popLayer);

  const atmosphereLayer = document.createElement('div');
  atmosphereLayer.className = 'atmosphere-theme-effects';
  atmosphereLayer.setAttribute('aria-hidden', 'true');
  atmosphereLayer.innerHTML = `
    <div class="kodama-spores">
      <span class="kodama-spores-layer kodama-spores-far"></span>
      <span class="kodama-spores-layer kodama-spores-near"></span>
    </div>
    <div class="arrakis-atmosphere">
      <span class="arrakis-heat"></span>
      <span class="arrakis-sand arrakis-sand-a"></span>
      <span class="arrakis-sand arrakis-sand-b"></span>
    </div>
  `;
  document.body.appendChild(atmosphereLayer);

  document.addEventListener('click', triggerStarfoxTargetShot, true);
}

function triggerStarfoxTargetShot(event) {
  if (document.body.getAttribute('data-theme') !== 'starfox') return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const button = event.target.closest('button');
  const burst = document.getElementById('starfoxTargetBurst');
  if (!button || button.disabled || !burst) return;

  const rect = button.getBoundingClientRect();
  const x = Number.isFinite(event.clientX) && event.clientX > 0 ? event.clientX : rect.left + rect.width / 2;
  const y = Number.isFinite(event.clientY) && event.clientY > 0 ? event.clientY : rect.top + rect.height / 2;
  burst.style.left = `${x}px`;
  burst.style.top = `${y}px`;
  burst.classList.remove('is-firing');
  void burst.offsetWidth;
  burst.classList.add('is-firing');
  clearTimeout(starfoxShotTimer);
  starfoxShotTimer = setTimeout(() => burst.classList.remove('is-firing'), 720);
}

// ============================================================
// QUICKNOTES
// ============================================================
const QUICKNOTES_KEY = 'tktool-quicknotes';
const QUICKNOTES_OPEN_KEY = 'tktool-quicknotes-open';

function updateQuickNotesIndicator(value) {
  const indicator = document.getElementById('quicknotesIndicator');
  if (!indicator) return;
  const hasText = !!value.trim();
  indicator.classList.toggle('has-content', hasText);
  indicator.hidden = !hasText;
  indicator.textContent = hasText ? 'notiz' : '';
}

function toggleQuickNotes() {
  const el = document.getElementById('quicknotes');
  const isOpen = el.classList.toggle('open');
  try { localStorage.setItem(QUICKNOTES_OPEN_KEY, isOpen ? '1' : '0'); } catch {}
  if (isOpen) {
    setTimeout(() => document.getElementById('quicknotesEditor').focus(), 50);
  }
}

function initQuickNotes() {
  const editor = document.getElementById('quicknotesEditor');
  try {
    const saved = localStorage.getItem(QUICKNOTES_KEY);
    if (saved) editor.value = saved;
  } catch {}
  updateQuickNotesIndicator(editor.value);
  editor.addEventListener('input', () => {
    try { localStorage.setItem(QUICKNOTES_KEY, editor.value); } catch {}
    updateQuickNotesIndicator(editor.value);
  });
  try {
    if (localStorage.getItem(QUICKNOTES_OPEN_KEY) === '1') {
      document.getElementById('quicknotes').classList.add('open');
    }
  } catch {}
}

initQuickNotes();

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
initTheme();

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 's') {
    e.preventDefault();
    toggleSudoMode();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openCapture(e.shiftKey ? { captureMode: 'teammate' } : {});
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j') {
    e.preventDefault();
    toggleQuickNotes();
  }
  if (e.key === 'Escape') {
    closeThemeMenu();
    const qn = document.getElementById('quicknotes');
    if (qn.classList.contains('open') && document.activeElement === document.getElementById('quicknotesEditor')) {
      qn.classList.remove('open');
      try { localStorage.setItem(QUICKNOTES_OPEN_KEY, '0'); } catch {}
      document.getElementById('quicknotesEditor').blur();
      return;
    }
    closeOverlay();
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#themePicker')) closeThemeMenu();
});

// ============================================================
// INIT
// ============================================================
function showSetupScreen(mode = 'pick') {
  const setup = document.getElementById('setupScreen');
  const kicker = document.getElementById('setupKicker');
  const title = document.getElementById('setupTitle');
  const text = document.getElementById('setupText');
  const button = document.getElementById('setupButton');
  const altButton = document.getElementById('setupAltButton');
  const hint = document.getElementById('setupHint');
  const reconnect = mode === 'reconnect';

  if (kicker) kicker.textContent = reconnect ? 'start' : 'setup';
  if (title) title.textContent = reconnect ? 'Zugriff erlauben' : 'Speicherort wählen';
  if (text) {
    text.textContent = reconnect
      ? 'Chrome braucht kurz deine Freigabe, damit TKTool deine lokalen Daten laden kann.'
      : 'Wähle einen Ordner, in dem TKTool deine Daten speichern darf.';
  }
  if (button) button.textContent = reconnect ? 'Zugriff erlauben' : 'Datenordner auswählen';
  if (altButton) altButton.hidden = !reconnect;
  if (hint) {
    hint.textContent = reconnect
      ? 'Deine Daten bleiben lokal.'
      : 'Deine Daten bleiben lokal in deinem Ordner.';
  }
  if (setup) setup.style.display = 'flex';
}

async function finishStorageConnection(handle) {
  dirHandle = handle;
  // Load first: if it fails, the setup screen stays visible instead of
  // leaving a blank app behind.
  await loadData();
  document.getElementById('setupScreen').style.display = 'none';
  render();
  scheduleAutoBackup();
}

// Nicht awaiten: der erste Render darf darauf nicht warten, und Fehler
// melden sich selbst. Erst bestaetigen, dann sichern — so steht die
// Geraete-Bestaetigung schon im Backup.
function scheduleAutoBackup() {
  setTimeout(async () => {
    await ackAndPurgeGraves();
    await maybeAutoBackup();
  }, 1500);
}

async function connectStorage() {
  try {
    const handle = await getSavedDirHandle() || await pickDataDirectory();
    await finishStorageConnection(handle);
  } catch (err) {
    console.error('Directory pick cancelled or failed:', err);
    if (err?.name !== 'AbortError') reportUiError('Datenordner konnte nicht geöffnet werden', err);
  }
}

async function chooseStorageDirectory() {
  try {
    const handle = await pickDataDirectory();
    await finishStorageConnection(handle);
  } catch (err) {
    console.error('Directory pick cancelled or failed:', err);
    if (err?.name !== 'AbortError') reportUiError('Datenordner konnte nicht geöffnet werden', err);
  }
}

(async () => {
  const saved = await getStoredDirHandle();
  if (saved) {
    if (await hasHandlePermission(saved)) {
      dirHandle = saved;
      await loadData();
      render();
      scheduleAutoBackup();
    } else {
      render();
      showSetupScreen('reconnect');
    }
  } else {
    render();
    showSetupScreen('pick');
  }
})();

</script>
<script data-source="./js/update.js">
// ============================================================
// UPDATE CHECK
// ------------------------------------------------------------
// Compares the local APP_VERSION against the version baked into
// the TKTool.html on GitHub (raw). The running file:// page cannot
// rewrite itself on disk (no path -> writable handle bridge in the
// File System Access API), so a newer version is offered as a
// download. We know our own location via location.pathname, so the
// banner shows exactly where the downloaded file has to go.
// ============================================================
const UPDATE_RAW_URL = 'https://raw.githubusercontent.com/renemrhfr/TKTool/main/TKTool.html';
const UPDATE_DISMISS_KEY = 'tktool-update-dismissed';
// The newest version known to be available remotely. Persisted so the gear
// indicator and in-menu offer survive a reload without re-fetching (works
// offline too). Only ever holds the latest known version, so skipping several
// releases still points at the newest one.
const UPDATE_AVAILABLE_KEY = 'tktool-update-available';

function parseVersion(v) {
  return String(v || '').split('.').map(n => parseInt(n, 10) || 0);
}

// True if `remote` is strictly newer than `local` (semver-ish, dot-separated).
function isNewerVersion(remote, local) {
  const r = parseVersion(remote);
  const l = parseVersion(local);
  const len = Math.max(r.length, l.length);
  for (let i = 0; i < len; i++) {
    const a = r[i] || 0;
    const b = l[i] || 0;
    if (a > b) return true;
    if (a < b) return false;
  }
  return false;
}

function extractRemoteVersion(html) {
  const m = html.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
  return m ? m[1] : null;
}

async function fetchRemoteHtml() {
  const res = await fetch(UPDATE_RAW_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}

// Holds the downloaded remote HTML once a newer version is found. On window so
// renderThemeMenu (which runs at init, before this file's body executes) can
// safely read it as a property without a temporal-dead-zone ReferenceError.
window.pendingUpdate = null; // { version, html }

function currentFilePath() {
  try {
    return decodeURIComponent(location.pathname);
  } catch {
    return location.pathname;
  }
}

async function checkForUpdate({ silent = true } = {}) {
  try {
    const html = await fetchRemoteHtml();
    const remoteVersion = extractRemoteVersion(html);
    if (!remoteVersion) {
      if (!silent) toast('Versionsinfo nicht gefunden');
      return;
    }
    if (isNewerVersion(remoteVersion, APP_VERSION)) {
      window.pendingUpdate = { version: remoteVersion, html };
      // Persist so the indicator/offer come back instantly on the next reload.
      try { localStorage.setItem(UPDATE_AVAILABLE_KEY, remoteVersion); } catch {}
      // The settings-menu indicator and in-menu offer stay regardless of the
      // banner, so a dismissed (or never-shown) banner is not the only path.
      refreshUpdateIndicator();
      // On a silent (startup) check, respect a prior dismissal of this version.
      let dismissed = null;
      try { dismissed = localStorage.getItem(UPDATE_DISMISS_KEY); } catch {}
      if (silent && dismissed === remoteVersion) return;
      showUpdateBanner(remoteVersion);
    } else {
      // We are on (or past) the remote version: clear any stale "available"
      // and "dismissed" markers and drop the indicator.
      clearUpdateState();
      if (!silent) toast('TKTool ist aktuell (v' + APP_VERSION + ')');
    }
  } catch (err) {
    if (!silent) toast('Update-Prüfung fehlgeschlagen');
    console.warn('Update check failed:', err);
  }
}

// Drops all persisted update markers and the in-memory state, then refreshes
// the UI. Used once the running app has caught up to the remote version.
function clearUpdateState() {
  window.pendingUpdate = null;
  try { localStorage.removeItem(UPDATE_AVAILABLE_KEY); } catch {}
  try { localStorage.removeItem(UPDATE_DISMISS_KEY); } catch {}
  refreshUpdateIndicator();
}

// Restores the indicator from persisted state at startup, before (and without
// needing) any network call. The downloaded HTML is not persisted, so the
// offer carries only the version; downloadUpdate() fetches the HTML on demand.
function initUpdateIndicator() {
  let stored = null;
  try { stored = localStorage.getItem(UPDATE_AVAILABLE_KEY); } catch {}
  if (stored && isNewerVersion(stored, APP_VERSION)) {
    window.pendingUpdate = { version: stored, html: null };
    refreshUpdateIndicator();
    let dismissed = null;
    try { dismissed = localStorage.getItem(UPDATE_DISMISS_KEY); } catch {}
    if (dismissed !== stored) showUpdateBanner(stored);
  } else if (stored) {
    // App version moved to/past the stored one — stale marker, clean it up.
    clearUpdateState();
  }
}

// Lights up the gear-button badge and re-renders the settings menu so the
// in-menu "update herunterladen" offer is present. Kept in sync with
// `pendingUpdate` and unaffected by dismissing the banner.
function refreshUpdateIndicator() {
  const badge = document.getElementById('themeTriggerBadge');
  if (badge) badge.hidden = !window.pendingUpdate;
  if (typeof renderThemeMenu === 'function') {
    renderThemeMenu();
    const active = document.body.getAttribute('data-theme');
    if (active && typeof updateThemeMenuSelection === 'function') updateThemeMenuSelection(active);
  }
}

function dismissUpdateBanner() {
  if (window.pendingUpdate) {
    try { localStorage.setItem(UPDATE_DISMISS_KEY, window.pendingUpdate.version); } catch {}
  }
  const banner = document.getElementById('updateBanner');
  if (banner) banner.remove();
}

async function downloadUpdate() {
  if (!window.pendingUpdate) return;
  // When the offer was restored from storage on reload we hold only the
  // version, not the HTML — fetch it now.
  let html = window.pendingUpdate.html;
  if (!html) {
    toast('Update wird geladen …');
    try {
      html = await fetchRemoteHtml();
      window.pendingUpdate.html = html;
    } catch (err) {
      toast('Download fehlgeschlagen');
      console.warn('Update download failed:', err);
      return;
    }
  }
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'TKTool.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  const path = currentFilePath();
  toast('Heruntergeladen – ersetze damit: ' + path);
}

function showUpdateBanner(version) {
  const existing = document.getElementById('updateBanner');
  if (existing) existing.remove();

  const path = currentFilePath();
  const banner = document.createElement('div');
  banner.className = 'update-banner';
  banner.id = 'updateBanner';
  banner.innerHTML = `
    <span class="update-banner-dot" aria-hidden="true"></span>
    <div class="update-banner-body">
      <span class="update-banner-title">update verfügbar
        <span class="update-banner-version">v${APP_VERSION} → v${version}</span>
      </span>
      <span class="update-banner-path" title="${path}">ersetze: ${path}</span>
    </div>
    <button class="update-banner-action" type="button" onclick="downloadUpdate()">herunterladen</button>
    <button class="update-banner-close" type="button" onclick="dismissUpdateBanner()" aria-label="schließen" title="für diese version nicht mehr anzeigen">&times;</button>
  `;
  document.body.appendChild(banner);
}

// Silent check shortly after startup so it never blocks rendering,
// then every 8h to catch instances that stay open for days. The
// persistent banner (not a toast) survives until dismissed, so a
// long-running tab still sees the notice.
const UPDATE_INTERVAL_MS = 8 * 60 * 60 * 1000;
// Restore the indicator from persisted state immediately (no network), then do
// the live check shortly after to refresh/clear it.
initUpdateIndicator();
setTimeout(() => { checkForUpdate({ silent: true }); }, 2500);
setInterval(() => { checkForUpdate({ silent: true }); }, UPDATE_INTERVAL_MS);

</script>
