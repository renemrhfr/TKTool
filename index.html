<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TKTool</title>
<link rel="stylesheet" href="./themes/light.css">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./themes/dark.css">
<link rel="stylesheet" href="./themes/rose-pine-dawn.css">
<link rel="stylesheet" href="./themes/daylight.css">
<link rel="stylesheet" href="./themes/bridges.css">
<link rel="stylesheet" href="./themes/hyrule.css">
<link rel="stylesheet" href="./themes/starfox.css">
<link rel="stylesheet" href="./themes/nord.css">
<link rel="stylesheet" href="./themes/switch.css">
<link rel="stylesheet" href="./themes/matrix.css">
<link rel="stylesheet" href="./themes/kodama.css">
<link rel="stylesheet" href="./themes/arrakis.css">
<link rel="stylesheet" href="./themes/hailmary.css">
<link rel="stylesheet" href="./modern.css">
</head>
<body>

<aside class="header sidebar">
  <div class="header-inner sidebar-inner">
    <div class="sidebar-brand">
      <div class="logo">tk</div>
      <span class="sidebar-brand-name">TKTool</span>
      <button class="sidebar-toggle" id="sidebarToggle" type="button" onclick="toggleSidebar()" aria-label="Seitenleiste einklappen" title="Seitenleiste einklappen (Ctrl+\)">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path class="sidebar-toggle-chevron" d="M15 10l-2 2 2 2"/></svg>
      </button>
    </div>
    <button class="sidebar-capture" type="button" onclick="openCapture()" title="Schnellerfassung (Ctrl+K)">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Erfassen</span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="header-search">
      <svg class="nav-icon header-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input
        id="globalSearchInput"
        type="search"
        placeholder="Suchen…"
        autocomplete="off"
        oninput="handleGlobalSearchInput(this.value)"
        onkeydown="handleGlobalSearchKeydown(event)"
      >
    </div>
    <nav class="nav" id="nav">
      <button data-view="reviews" class="active" title="Übersicht"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="nav-label">Übersicht</span></button>
      <button data-view="planung" title="Planung"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h6M10 17h7"/></svg><span class="nav-label">Planung</span></button>
      <button data-view="overview" title="Aufgaben"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span class="nav-label">Aufgaben</span></button>
      <button data-view="meetings" title="Meetings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg><span class="nav-label">Meetings</span></button>
      <button data-view="team" title="Team"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span class="nav-label">Team</span></button>
      <button data-view="notizen" title="Persönliche Notizen (Sudo)"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><span class="nav-label">Notizen</span></button>
    </nav>
    <div class="header-actions sidebar-footer">
      <div class="theme-picker" id="themePicker">
        <button class="theme-trigger" id="themeTrigger" type="button" onclick="toggleThemeMenu(event)" aria-haspopup="menu" aria-expanded="false" aria-label="Einstellungen öffnen" title="Einstellungen">
          <svg class="nav-icon theme-trigger-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span class="theme-trigger-label">Einstellungen</span>
          <span class="theme-trigger-badge" id="themeTriggerBadge" aria-hidden="true" hidden></span>
        </button>
        <div class="theme-menu" id="themeMenu" role="menu" aria-label="Einstellungen"></div>
      </div>
    </div>
  </div>
</aside>

<div id="setupScreen" class="setup-screen">
  <div class="setup-shell">
    <div class="setup-brand">
      <span class="logo">tk_</span>
    </div>
    <div class="setup-panel">
      <div class="setup-kicker" id="setupKicker">setup</div>
      <h2 id="setupTitle">Speicherort wählen</h2>
      <p id="setupText">Wähle einen Ordner, in dem TKTool deine Daten speichern darf.</p>
      <div class="setup-actions">
        <button id="setupButton" class="btn btn-primary setup-button" onclick="connectStorage()">Datenordner auswählen</button>
        <button id="setupAltButton" class="btn btn-secondary setup-button" onclick="chooseStorageDirectory()" hidden>Anderen Ordner auswählen</button>
      </div>
      <div class="setup-hint" id="setupHint">Deine Daten bleiben lokal in deinem Ordner.</div>
    </div>
  </div>
</div>
<main class="main" id="app"></main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<input type="file" id="importInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script src="./js/data.js"></script>
<script src="./js/helpers.js"></script>
<script src="./js/nav.js"></script>
<script src="./js/todo.js"></script>
<script src="./js/team.js"></script>
<script src="./js/meetings.js"></script>
<script src="./js/notes.js"></script>
<script src="./js/dashboard.js"></script>
<script src="./js/search.js"></script>
<script src="./js/capture.js"></script>
<script src="./js/planung.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/update.js"></script>
</body>
</html>
